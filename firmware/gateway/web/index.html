<style>

}

    --border: #2a323d; --accent: #4f8cff; --accent-text: #0b0e12; --ok: #34c77b; --warn: #f0a63a;

  }
}

}

.prefs select { padding: 3px 6px; font-size: 12px; }

  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
/* Layout: header on top, section menu on the left (a drawer below 900 px), content on the right. */
header { position: sticky; top: 0; z-index: 20; height: 52px; background: var(--panel); border-bottom: 1px solid var(--border); }

@keyframes blink { 50% { opacity: .15; } }
#flash-strip { position: absolute; left: 0; bottom: -1px; height: 3px; width: 0; background: var(--warn); transition: width .4s; display: none; }
header.flashing #flash-strip { display: block; }
.bar { height: 100%; padding: 0 16px; display: flex; align-items: center; gap: 10px; }
/* header status tags: outlined and coloured when the link works, plain grey when off */
.tag { display: inline-flex; align-items: center; padding: 1px 7px; border: 1px solid transparent; border-radius: 5px;
  font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--muted); }
.tag.ok { color: var(--ok); border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); }

.tag .mdi { width: 14px; height: 14px; margin-right: 4px; }
[data-htip] { cursor: default; }
.hdr-cap { color: var(--muted); font-size: 12px; white-space: nowrap; }
.hdr-sep { flex: none; width: 1px; height: 20px; background: var(--border); }
.hdr-up { display: grid; grid-template-columns: auto auto; column-gap: 8px; font-size: 12px; line-height: 1.3; white-space: nowrap; }

@media (max-width: 1200px) { .hdr-sep, .brand small, .hdr-clock { display: none; } }

.spacer { flex: 1; }
.mdi { width: 18px; height: 18px; fill: currentColor; flex: none; vertical-align: -4px; }
#menu-btn { display: none; background: none; border: 0; color: var(--text); padding: 6px; cursor: pointer; }
.layout { display: flex; align-items: flex-start; }
#side { position: sticky; top: 52px; flex: none; width: 236px; height: calc(100vh - 52px); overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--border); padding: 12px 10px 24px; }

  text-decoration: none; white-space: nowrap; }

#side { display: flex; flex-direction: column; }
#side-nav { flex: 1 0 auto; }
/* bottom of the menu: language, theme, restart */

.side-prefs { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--border); }
.seg button { display: inline-flex; align-items: center; border: 0; background: none; padding: 5px 7px; border-radius: 6px;
  cursor: pointer; color: var(--muted); }

.roles-table td, .roles-table th { vertical-align: middle; }

.roles-table .rt-group th svg, .rl-name svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }
.rl-name { display: inline-flex; align-items: center; font-weight: 600; white-space: nowrap; }
.role-lines { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
.role-line { display: grid; grid-template-columns: 22px minmax(150px, 220px) 1fr auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; }
.role-line.active { background: var(--panel-2); }
.role-line > svg { width: 18px; height: 18px; }
.role-line .rl-desc { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 700px) { .role-line { grid-template-columns: 22px 1fr auto; } .role-line .rl-desc { display: none; } #roles-view span { display: none; }
  .roles-table .btn.sm span, .roles-table th .muted { display: none; } .roles-table .rl-name { white-space: normal; } .roles-table td, .roles-table th { padding-left: 4px; padding-right: 4px; } }
.seg .flag { display: block; width: 21px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
.seg button:not(.on) .flag { opacity: .55; }
#side-reboot { justify-content: center; }
.side-user { display: flex; align-items: center; gap: 8px; }
.side-user a { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none;
  padding: 6px 8px; border-radius: 8px; overflow: hidden; }
.side-user a:hover { background: var(--panel-2); }
.side-user a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-user small { color: var(--muted); }
.side-user button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 8px; display: inline-flex; }
.side-user button:hover { color: var(--bad); background: var(--panel-2); }
.api-ep { border-top: 1px solid var(--border); padding: 8px 0; }
.api-ep > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; cursor: pointer; list-style: none; }
.api-ep > summary::-webkit-details-marker { display: none; }
.api-m { font: 600 11px/1 var(--mono, monospace); padding: 3px 6px; border-radius: 4px; min-width: 46px; text-align: center; color: #fff; background: var(--muted); }
.api-m.GET { background: var(--ok); } .api-m.POST { background: var(--accent); } .api-m.PUT { background: var(--warn); } .api-m.DELETE { background: var(--bad); }
.api-ep code.path { font-weight: 600; }
.api-ep .api-perm { font-size: 12px; color: var(--muted); }
.api-ep .api-body { display: grid; gap: 8px; margin: 8px 0 4px 54px; }
.api-ep pre { margin: 0; max-height: 320px; overflow: auto; }
@media (max-width: 700px) { .api-ep .api-body { margin-left: 0; } }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; margin-left: auto; }
#side .subs .subs { margin-left: 10px; }
.login-err { color: var(--bad); min-height: 1.2em; margin: 4px 0 8px; }
.qr { width: 200px; height: 200px; border-radius: 8px; background: #fff; padding: 4px; }
.codes { display: grid; grid-template-columns: repeat(2, max-content); gap: 4px 24px; font: 15px ui-monospace, monospace; }
.perm-table select { padding: 3px 6px; }
.perm-table td, .perm-table th { white-space: nowrap; }
.readonly-note { display: flex; align-items: center; gap: 8px; }
#lan-banner { position: sticky; top: 52px; z-index: 15; margin: 0; border-radius: 0; border-width: 0 0 1px; }
.spark { width: 100%; height: 120px; display: block; }
.spark .rx { stroke: var(--ok); } .spark .tx { stroke: var(--accent); }
.spark path { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.spark .grid-l { stroke: var(--border); stroke-width: 1; }
.rate { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.rate small { font-size: 12px; color: var(--muted); font-weight: 400; }
#side .subs { margin: 2px 0 6px 18px; padding-left: 10px; border-left: 1px solid var(--border); }
#side .subs a { padding: 6px 10px; font-size: 13px; }
#side .subs .mdi { width: 16px; height: 16px; }
#side .off { opacity: .55; }
#side a[aria-disabled] { cursor: not-allowed; opacity: .4; }

main { flex: 1; min-width: 0; max-width: 1640px; padding: 18px 24px 40px; }
.page-title { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-size: 20px; font-weight: 650; }
.page-title .mdi { width: 24px; height: 24px; color: var(--accent); }
.page-title small { color: var(--muted); font-weight: 400; font-size: 15px; }
#scrim { display: none; }
@media (max-width: 900px) {
  #menu-btn { display: inline-flex; }
  #side { position: fixed; top: 52px; left: 0; z-index: 30; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  body.menu-open #side { transform: none; }
  body.menu-open #scrim { display: block; position: fixed; inset: 52px 0 0; z-index: 25; background: rgba(0,0,0,.35); }
  main { padding: 14px; }
  .brand small, #hdr-uptime, #hdr-ha, #hdr-mqtt, #hdr-inet { display: none; }
}
@media (max-width: 560px) { #hdr-eth, #hdr-role, #hdr-radio-b, #hdr-peer, #hdr-flash, .hdr-cap { display: none; }
#hdr-ident span { display: none; } }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1100px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.grid > .wide { grid-column: 1 / -1; }
/* overview diagram: LAN - P4 - radio A / radio B - their networks */
.topo-flow { display: grid; gap: 10px 8px; align-items: center; grid-template-columns: minmax(0, 1fr) 22px minmax(0, 1fr) 22px minmax(0, 1.1fr) 22px minmax(0, 1.2fr); }
.topo-flow > :nth-child(1), .topo-flow > :nth-child(2), .topo-flow > :nth-child(3) { grid-row: 1 / 3; }
.topo-flow > :nth-child(1) { grid-column: 1; } .topo-flow > :nth-child(2) { grid-column: 2; } .topo-flow > :nth-child(3) { grid-column: 3; }
.t-a { grid-area: 1 / 4; } .t-a + .tnode { grid-area: 1 / 5; } .t-na { grid-area: 1 / 6; } .t-na + .tnode { grid-area: 1 / 7; }
.t-b { grid-area: 2 / 4; } .t-b + * { grid-area: 2 / 5; } .t-nb { grid-area: 2 / 6; } .t-nb + * { grid-area: 2 / 7; }
.tarrow { color: var(--muted); text-align: center; font-size: 18px; }
.tnode { display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; border: 1px solid var(--border); border-left: 4px solid var(--muted);
  border-radius: 8px; background: var(--panel-2); color: var(--text); text-decoration: none; min-width: 0; font-size: 13px; }
.tnode:hover { border-color: var(--accent); }
.tnode span { color: var(--muted); overflow-wrap: anywhere; }
.tnode .tkind { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.tnode b { font-size: 14px; }
.tnode.ok { border-left-color: var(--ok); } .tnode.warn { border-left-color: var(--warn); } .tnode.bad { border-left-color: var(--bad); }
.tnode.off { border-style: dashed; border-left-style: solid; opacity: .75; }
/* Data flows: three columns of nodes, the links drawn over them in an SVG */
.flows { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 90px; }
.flows .fcol { display: flex; flex-direction: column; gap: 10px; justify-content: center; position: relative; z-index: 1; }
.flows .fcol > h4 { margin: 0 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.flows svg.flinks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.flinks path { fill: none; stroke-width: 2; }
.flinks path.ok { stroke: var(--ok); } .flinks path.warn { stroke: var(--warn); stroke-dasharray: 5 4; } .flinks path.off { stroke: var(--border); stroke-dasharray: 3 5; } .flinks path.bad { stroke: var(--bad); }
@media (max-width: 900px) { .flows { grid-template-columns: minmax(0, 1fr); gap: 16px; } .flows svg.flinks { display: none; } }
@media (max-width: 900px) {
  .topo-flow { grid-template-columns: minmax(0, 1fr); }
  .topo-flow > * { grid-area: auto !important; }
  .tarrow { transform: rotate(90deg); line-height: 1; }
  .tnode-empty, .t-b { display: none; }
}
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 13px; text-transform: uppercase;
  letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.card h3 .mdi { color: var(--accent); }
/* explanation tooltips: an (i) after a label, shown on hover, focus or tap */
.tip { display: inline-flex; margin-left: 4px; color: var(--muted); cursor: help; vertical-align: middle; }
.tip .mdi { width: 14px; height: 14px; }
.tip:hover, .tip:focus { color: var(--accent); outline: none; }
/* the same box as the header tags and network maps (#nodebox): title, text, optional table */
#tipbox { position: fixed; z-index: 50; max-width: 360px; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.4; display: none;
  background: var(--panel); color: var(--text); border: 1px solid var(--border); box-shadow: 0 8px 28px rgba(0,0,0,.35); pointer-events: none; }
#tipbox.rows { max-width: min(480px, calc(100vw - 16px)); }
#tipbox table { width: auto; margin-top: 8px; }
#tipbox td.num { text-align: right; padding-left: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#tipbox tr.sum th, #tipbox tr.sum td { border-top: 1px solid var(--border); padding-top: 4px; }
.card + .card, .grid + .card, .card + .grid, main > * + *, #thread-status > * + * { margin-top: 14px; }
.grid > .card { margin-top: 0; }
/* one label column width on every tile, so values line up across the whole UI */
:root { --label-w: 210px; }
@media (max-width: 560px) { :root { --label-w: 150px; } }
dl { display: grid; grid-template-columns: var(--label-w) minmax(0, 1fr); gap: 6px 16px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px;
  background: var(--panel-2); border: 1px solid var(--border); font-size: 12px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.ok-text { color: var(--ok); } .warn-text { color: var(--warn); } .bad-text { color: var(--bad); }
.muted { color: var(--muted); }
.alert { border-radius: 8px; padding: 10px 12px; border: 1px solid var(--warn); color: var(--text);
  background: color-mix(in srgb, var(--warn) 10%, var(--panel)); margin-bottom: 14px; }
.alert.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--panel)); }
button.btn, a.btn, label.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--text); padding: 6px 12px; border-radius: 7px; font: inherit;
  cursor: pointer; text-decoration: none; }
button.btn:hover, label.btn:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row + .row { margin-top: 8px; }
input[type=text], input[type=password], input[type=number], textarea, select {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 7px;
  padding: 6px 9px; font: inherit; min-width: 0; }
textarea { width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
label.field { display: grid; gap: 4px; margin-bottom: 10px; }
label.field span { color: var(--muted); font-size: 12px; }
.table-wrap { overflow-x: auto; }

th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

  overflow: auto; margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* buttons in the style of the My Home Assistant badges */
.my-badge { display: inline-flex; align-items: center; gap: 14px; padding: 6px 6px 6px 20px; border-radius: 999px; background: #58b9ed;
  color: #fff; font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; }
.my-badge:hover { filter: brightness(1.08); }
.my-badge .my { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 999px; background: #f2f4f9; color: #58b9ed; font-weight: 700; }

.rel-ver { display: flex; align-items: center; gap: 8px; } .rel-btns { display: flex; gap: 6px; justify-content: flex-end; }

.upd-table td { vertical-align: middle; }
.rel > summary::-webkit-details-marker { display: none; }

  [/^(.+) free, min (.+)$/, '$1 volné, min $2'], [/^(.+) \/ (.+), min (.+)$/, '$1 / $2, min $3'], [/^Run only above (.+) dBFS$/, 'Spouštět jen nad $1 dBFS'],
];
let lang = (navigator.language || '').toLowerCase().startsWith('cs') ? 'cs' : 'en';
try { lang = localStorage.getItem('lang') || lang; } catch (e) { /* storage blocked */ }
const original = new WeakMap();

function translateText(text) {
  const key = text.trim().replace(/\s+/g, ' ');
  if (!key) return null;
  let out = CS[key];
  if (out === undefined) {
    for (const [rx, rep] of CS_RX) {
      if (rx.test(key)) { out = key.replace(rx, rep); break; }
    }
  }
  if (out === undefined) return null;
  return text.replace(text.trim(), out);
}

function skip(el) {
  return !el || el.closest('script,style,textarea,pre,code,[data-notr]');
}

function translateTree(root) {
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    if (skip(node.parentElement)) continue;
    const base = original.has(node) && original.get(node).cs === node.nodeValue ? original.get(node).en : node.nodeValue;
    const out = lang === 'cs' ? translateText(base) : null;
    const want = out ?? base;
    if (out !== null) original.set(node, { en: base, cs: out });
    if (node.nodeValue !== want) node.nodeValue = want;
  }
  const els = root.querySelectorAll ? root.querySelectorAll('[placeholder],[title]') : [];
  for (const el of els) {
    if (skip(el)) continue;
    for (const attr of ['placeholder', 'title']) {
      if (!el.hasAttribute(attr)) continue;
      const en = el.dataset['en' + attr] ?? el.getAttribute(attr);
      el.dataset['en' + attr] = en;
      const out = lang === 'cs' ? translateText(en) : null;
      const want = out ?? en;
      if (el.getAttribute(attr) !== want) el.setAttribute(attr, want);
    }
  }
}

const i18nObserver = new MutationObserver(records => {
  for (const r of records) {
    if (r.type === 'characterData') translateTree(r.target.parentElement);
    else r.addedNodes.forEach(n => translateTree(n.nodeType === 3 ? n.parentElement : n));
  }
});

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (opts.json !== undefined) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  const res = await fetch(path, { method: opts.method || (opts.body ? 'POST' : 'GET'), headers, body: opts.body,
    signal: opts.timeout ? AbortSignal.timeout(opts.timeout) : undefined });
  if (res.status === 401 && !opts.noLogin) { await login(); return api(path, opts); }
  const type = res.headers.get('Content-Type') || '';
  const data = type.includes('json') ? await res.json() : await res.text();
  if (res.status === 403 && !opts.noLogin && ['password_change_required', 'totp_setup_required'].includes(data?.error)) {
    await accountSetup(data.error);
    return api(path, opts);
  }
  if (res.status === 403 && data?.error === 'forbidden') throw new Error(L('You do not have the right to do this', 'K této akci nemáte oprávnění'));
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return opts.raw ? { data, res } : data;
}

/* Sign-in dialog: name and password, then the authenticator code when the account has 2FA;
 * "Forgot password" sends a reset request to the admins. */
let loginPromise = null;
function login() {
  if (loginPromise) return loginPromise;
  loginPromise = new Promise(resolve => {
    const dlg = $('#login'), form = $('#login-form');
    let step = 'password', user = '', password = '';
    const draw = (err = '') => {
      const host = esc(status?.hostname || location.hostname);
      form.innerHTML = step === 'reset'
        ? `<h3 style="margin-top:0">${L('Forgotten password', 'Zapomenuté heslo')}</h3>
          <p class="muted">${L('The admins of the gateway get a request to set you a new password.', 'Správci brány dostanou žádost, aby vám nastavili nové heslo.')}</p>
          <label class="field"><span>${L('User name', 'Uživatelské jméno')}</span><input type="text" id="lg-user" value="${esc(user)}" autocomplete="username" required></label>
          <div class="login-err">${esc(err)}</div>
          <div class="row"><button class="btn primary" type="submit">${ic('send')}${L('Send request', 'Odeslat žádost')}</button>
            <button class="btn" type="button" id="lg-back">${L('Back', 'Zpět')}</button></div>`
        : `<h3 style="margin-top:0">${L('Sign in', 'Přihlášení')} <small class="muted" style="font-weight:400">${host}</small></h3>
          <label class="field"><span>${L('User name', 'Uživatelské jméno')}</span><input type="text" id="lg-user" value="${esc(user)}" autocomplete="username" required ${step === 'code' ? 'disabled' : ''}></label>
          <label class="field"><span>${L('Password', 'Heslo')}</span><input type="password" id="lg-pass" autocomplete="current-password" required ${step === 'code' ? 'disabled' : ''}></label>
          ${step === 'code' ? `<label class="field"><span>${L('Code from the authenticator app (or a recovery code)', 'Kód z aplikace Authenticator (nebo záložní kód)')}</span>
            <input type="text" id="lg-code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" required></label>` : ''}
          <label><input type="checkbox" id="lg-remember"> ${L('Stay signed in on this device', 'Zůstat přihlášen na tomto zařízení')}</label>
          <div class="login-err">${esc(err)}</div>
          <div class="row"><button class="btn primary" type="submit">${ic('login')}${L('Sign in', 'Přihlásit')}</button>
            <button class="btn" type="button" id="lg-forgot">${L('Forgot password', 'Zapomenuté heslo')}</button></div>`;
      if (step === 'code') $('#lg-pass').value = password;
      ($('#lg-code') || (user ? $('#lg-pass') : $('#lg-user')))?.focus();
      $('#lg-forgot') && ($('#lg-forgot').onclick = () => { user = $('#lg-user').value.trim(); step = 'reset'; draw(); });
      $('#lg-back') && ($('#lg-back').onclick = () => { step = 'password'; draw(); });
    };
    form.onsubmit = async ev => {
      ev.preventDefault();
      if (step === 'reset') {
        user = $('#lg-user').value.trim();
        try {
          await api('/api/auth/reset-request', { json: { user }, noLogin: true });
          step = 'password';
          draw(L('Request sent. An admin sets you a new password.', 'Žádost odeslána. Správce vám nastaví nové heslo.'));
        } catch (e) { draw(e.message); }
        return;
      }
      if (step === 'password') { user = $('#lg-user').value.trim(); password = $('#lg-pass').value; }
      const body = { user, password, remember: $('#lg-remember').checked };
      if (step === 'code') body.code = $('#lg-code').value.trim();
      try {
        const r = await api('/api/auth/login', { json: body, noLogin: true });
        if (r.code_required) {
          step = 'code';
          return draw(r.clock_set ? '' : L('The gateway clock is not set: use a recovery code.', 'Hodiny brány nejsou nastavené: použijte záložní kód.'));
        }
        me = r;
        dlg.close();
        loginPromise = null;
        renderUser();
        renderNav();
        resolve();
      } catch (e) {
        if (step === 'code' && /user or password/.test(e.message)) step = 'password';
        draw({ 'invalid user or password': L('Wrong name or password', 'Chybné jméno nebo heslo'), 'invalid code': L('Wrong code', 'Chybný kód'),
          locked: L('Too many attempts, the account is locked for a while', 'Příliš mnoho pokusů, účet je na chvíli zamčený'),
          'account disabled': L('The account is disabled', 'Účet je zablokovaný') }[e.message] || e.message);
      }
    };
    dlg.oncancel = ev => ev.preventDefault();
    draw();
    dlg.showModal();
  });
  return loginPromise;
}

/* A forced step after sign-in: a new password (set by an admin) or 2FA required for the role. */
let setupPromise = null;
function accountSetup(why) {
  if (setupPromise) return setupPromise;
  setupPromise = (async () => {
    if (why === 'password_change_required') {
      await formDialog(L('Set a new password', 'Nastavte nové heslo'), `<p class="muted">${L('An admin set your password; choose your own now.', 'Heslo vám nastavil správce; zvolte si teď vlastní.')}</p>
        <label class="field"><span>${L('Current password', 'Současné heslo')}</span><input type="password" name="old" autocomplete="current-password" required></label>
        <label class="field"><span>${L('New password', 'Nové heslo')}</span><input type="password" name="new" autocomplete="new-password" required></label>
        <label class="field"><span>${L('New password again', 'Nové heslo znovu')}</span><input type="password" name="new2" autocomplete="new-password" required></label>`,
        async v => {
          if (v.new !== v.new2) throw new Error(L('The passwords differ', 'Hesla se liší'));
          me = await api('/api/auth/password', { json: { old: v.old, new: v.new }, noLogin: true });
        }, { required: true });
    } else {
      await totpSetup(true);
    }
    me = await api('/api/auth/me', { noLogin: true });
    setupPromise = null;
    renderUser();
    renderNav();
  })();
  return setupPromise;
}

/* Generic modal form: fields by name; submit resolves after save(values) succeeds, errors stay in the dialog. */
function formDialog(title, html, save, opts = {}) {
  return new Promise(resolve => {
    const dlg = $('#form-dlg'), form = $('#form-dlg-form');
    form.innerHTML = `<h3 style="margin-top:0">${title}</h3>${html}<div class="login-err" id="fd-err"></div>
      <div class="row"><button class="btn primary" type="submit">${ic('check')}${opts.ok || L('Save', 'Uložit')}</button>
      ${opts.required ? '' : `<button class="btn" type="button" id="fd-cancel">${L('Cancel', 'Zrušit')}</button>`}</div>`;
    const done = v => { dlg.close(); resolve(v); };
    $('#fd-cancel') && ($('#fd-cancel').onclick = () => done(null));
    dlg.oncancel = ev => { ev.preventDefault(); if (!opts.required) done(null); };
    form.onsubmit = async ev => {
      ev.preventDefault();
      const v = {};
      form.querySelectorAll('[name]').forEach(el => { v[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
      try { done(await save(v) ?? v); } catch (e) { $('#fd-err').textContent = e.message; }
    };
    dlg.showModal();
    form.querySelector('input:not([type=checkbox]), select')?.focus();
  });
}

function confirmDialog(title, text) {
  return new Promise(resolve => {
    const dlg = $('#confirm');
    $('#confirm-title').textContent = title;
    $('#confirm-text').textContent = text;
    dlg.onclose = () => resolve(dlg.returnValue === 'yes');
    dlg.returnValue = 'no';
    dlg.showModal();
  });
}

/* navigator.clipboard exists only in secure contexts (HTTPS, localhost); the gateway serves
 * plain HTTP, so fall back to selecting a textarea and execCommand('copy'). */
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back */ }
  }
  const ta = $('#copy-text');
  ta.value = text;
  ta.focus();
  ta.select();
  try { return document.execCommand('copy'); } catch (e) { return false; }
}

async function showCopy(title, text, hint) {
  $('#copy-title').textContent = title;
  $('#copy-text').value = text;
  $('#copy-hint').textContent = hint || '';
  $('#copy-dlg').showModal();
  const ok = await copyText(text);
  toast(ok ? 'Copied to the clipboard' : 'Select the text and copy it (Ctrl/Cmd+C)');
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 3500);
}

  'Snapshot generation': ['Counter over all backups; the higher one is newer.', 'Počítadlo přes všechny zálohy; vyšší je novější.'],
  'Back up now': ['Restarts the gateway and saves the network data of the running Zigbee role from the C6 (it can be read only while the C6 is stopped).', 'Restartuje bránu a uloží data sítě běžící Zigbee role z C6 (dají se číst jen při zastaveném C6).'],
  'Saved': ['When the backup was taken; — for backups from before this column existed.', 'Kdy byla záloha pořízena; — u záloh z doby před tímto sloupcem.'],
  'Learn from a file': ['A WAV recording, 16 kHz mono 16-bit, 1 to 10 s, e.g. the washing machine beep recorded with a phone next to it (convert with: ffmpeg -i in.m4a -ar 16000 -ac 1 out.wav). As a sample its loudest 0.96 s are used; Test recording shows how the learned sounds score it, nothing is saved.', 'Nahrávka WAV, 16 kHz mono 16 bit, 1 až 10 s, např. pípnutí pračky nahrané telefonem u ní (převod: ffmpeg -i in.m4a -ar 16000 -ac 1 out.wav). Jako vzorek se použije nejhlasitějších 0,96 s; Test nahrávky ukáže, jaké skóre jí dají naučené zvuky, nic se neukládá.'],
  'Log': ['Time of each line in the local time of this browser (logged by the gateway, so also for older lines). Source and tag pick what to show, level hides informational lines, search finds text (or a /regular expression/). A click on a tag shows only that tag. Download saves the lines shown, with the full date. The gateway keeps about 64 kB of log.', 'Čas každého řádku v místním čase tohoto prohlížeče (zapisuje ho brána, takže i u starších řádků). Zdroj a tag vybírají, co zobrazit, úroveň skryje informační řádky, hledání najde text (nebo /regulární výraz/). Kliknutí na tag zobrazí jen ten tag. Stáhnout uloží zobrazené řádky s celým datem. Brána drží asi 64 kB logu.'],
  'Broker URI': ['mqtt://host:1883, mqtts://host:8883 (TLS), ws://host:1884 or wss://… (MQTT over WebSocket, e.g. the Mosquitto add-on port 1884).', 'mqtt://host:1883, mqtts://host:8883 (TLS), ws://host:1884 nebo wss://… (MQTT přes WebSocket, např. port 1884 doplňku Mosquitto).'],
  'Server certificate': ['TLS always verifies the broker. Public CA: brokers with a certificate from a public authority (cloud brokers, Let\'s Encrypt). Own CA: paste the CA that signed the broker certificate, or the self-signed broker certificate itself.', 'TLS vždy ověřuje broker. Veřejná CA: brokery s certifikátem od veřejné autority (cloudové brokery, Let\'s Encrypt). Vlastní CA: vložte CA, která podepsala certifikát brokeru, nebo přímo jeho self-signed certifikát.'],
  'Do not check the server name': ['The certificate is still verified against the CA, only the name in it may differ from the URI host, e.g. when the broker is reached by IP address. Also turns off SNI (one broker per address).', 'Certifikát se dál ověřuje proti CA, jen jméno v něm se může lišit od hostitele v URI, např. když je broker zadaný IP adresou. Vypne také SNI (jeden broker na adrese).'],
  'Client ID': ['MQTT client identifier, unique per broker. Empty: the hostname.', 'Identifikátor MQTT klienta, na brokeru jedinečný. Prázdné: hostname.'],
  'Keepalive': ['How often the client shows the broker it is alive; the broker marks the gateway offline after 1.5 times this. 10-240 s.', 'Jak často klient dává brokeru vědět, že žije; broker označí bránu offline po 1,5násobku. 10-240 s.'],
  'Base topic': ['Topics of the gateway: <base>/state, /availability, /role/set, sound and update. Empty: p4gw/<hostname>.', 'Topicy brány: <base>/state, /availability, /role/set, zvuk a aktualizace. Prázdné: p4gw/<hostname>.'],
  'State interval': ['How often the state (uptime, temperature, role, memory) is published. 10-3600 s.', 'Jak často se publikuje stav (uptime, teplota, role, paměť). 10-3600 s.'],
  'Entities in Home Assistant': ['Groups of entities sent by discovery; a group switched off is removed from Home Assistant, its topics are still published. With the P4 Gateway integration choose Only what the integration lacks: then MQTT adds just the device triggers of the sound events (for automations by device) and no entity shows up twice.', 'Skupiny entit posílané přes discovery; vypnutá skupina se z Home Assistant odebere, její topicy se publikují dál. S integrací P4 Gateway zvolte Jen co integrace nemá: MQTT pak přidá jen spouštěče zařízení pro zvukové události (pro automatizace podle zařízení) a žádná entita nebude dvakrát.'],
  'Home Assistant discovery': ['Entities appear in Home Assistant by themselves. Off: only the plain topics (Node-RED and others); the entities are removed from Home Assistant. Discovery is sent again whenever Home Assistant comes online.', 'Entity se v Home Assistant objeví samy. Vypnuto: jen holé topicy (Node-RED a další); entity se z Home Assistant odeberou. Discovery se pošle znovu pokaždé, když se Home Assistant připojí.'],
  'Learned sound ID': ['Name of the learned sound, also the ID of the event created from it (a-z, 0-9, _). More samples under the same name improve it.', 'Název naučeného zvuku a zároveň ID události z něj vytvořené (a-z, 0-9, _). Další vzorky pod stejným názvem ho zpřesní.'],
  'Learned sound type': ['Any sound: compared with what YAMNet hears (cosine similarity of embeddings), for barking of your dog, a door, a voice. Beep or tone: share of energy at the dominant frequency of the samples, for appliance beeps and piezo alarms.', 'Jakýkoli zvuk: porovnává se s tím, co slyší YAMNet (kosinová podobnost embeddingů), pro štěkot vašeho psa, dveře, hlas. Pípnutí nebo tón: podíl energie na dominantní frekvenci vzorků, pro pípání spotřebičů a piezo alarmy.'],
  'Record background': ['Five recordings of the room as it usually sounds (TV, fridge, talking). They set the threshold: above anything the background reaches, below the samples.', 'Pět nahrávek místnosti, jak obvykle zní (TV, lednice, hovor). Určují práh: nad vším, čeho dosáhne pozadí, pod vzorky.'],
  'Samples alike': ['Lowest score of a sample against the other samples of the sound; low means the samples differ (record more, or closer).', 'Nejnižší skóre vzorku proti ostatním vzorkům zvuku; nízké znamená, že se vzorky liší (nahrajte další nebo blíž).'],
  'Background score': ['Highest score the background recordings reach for this sound. It has to stay below the samples.', 'Nejvyšší skóre, kterého pro tento zvuk dosáhnou nahrávky pozadí. Musí zůstat pod vzorky.'],
  'Suggested threshold': ['Halfway between the background and the samples; used by Create event and editable there.', 'Uprostřed mezi pozadím a vzorky; použije ho Vytvořit událost a dá se tam upravit.'],
  'Learned score now': ['Score of the last recognition window, to test: play the sound and watch it rise above the threshold.', 'Skóre posledního okna rozpoznávání, pro test: pusťte zvuk a sledujte, jestli přesáhne práh.'],
  'Releases': ['Releases from releases.json next to the manifest that run on the flash layout of this board (older ones would lose the C6 firmware or the user accounts). Installing an older one is a rollback: settings stay, functions added later are missing until the next update. The gateway firmware and the C6 package install separately.', 'Vydání ze souboru releases.json vedle manifestu, která běží na layoutu flash této desky (starší by přišla o firmware C6 nebo o uživatelské účty). Instalace staršího vydání je návrat zpět: nastavení zůstane, později přidané funkce chybí do další aktualizace. Firmware brány a balík C6 se instalují zvlášť.'],
  'Update URL': ['Manifest of the online update. By default the latest GitHub release of the project (button GitHub Releases); your own server works too (scripts/make_update_manifest.py, e.g. /config/www/p4gw/ of Home Assistant). Checked every 6 hours; the gateway firmware and the C6 package are installed only on request. Saved empty: off.', 'Manifest online aktualizace. Výchozí je poslední vydání projektu na GitHubu (tlačítko GitHub Releases); funguje i vlastní server (scripts/make_update_manifest.py, např. /config/www/p4gw/ Home Assistant). Kontroluje se každých 6 hodin; firmware brány i balík C6 se instalují jen na vyžádání. Uloženo prázdné: vypnuto.'],
  'Settings backup': ['Role, Thread networks, MQTT, Home Assistant, transmit power and sound settings as one file, for a new board or after an NVS erase. Board state (C6 firmware, counters) is not part of it. Zigbee network data is backed up separately (C6 snapshots).', 'Role, sítě Thread, MQTT, Home Assistant, vysílací výkon a nastavení zvuku v jednom souboru, pro novou desku nebo po smazání NVS. Stav desky (firmware C6, čítače) v něm není. Data sítě Zigbee se zálohují zvlášť (snapshoty C6).'],
  'Previous log': ['The last 16 KiB of log before the last restart (requested, watchdog or crash). Not kept over a power cut.', 'Posledních 16 KiB logu před posledním restartem (vyžádaným, watchdogem i pádem). Výpadek napájení ho nepřežije.'],
  'Core dump': ['Crash record of the last panic, for debugging. Empty when the gateway never crashed.', 'Záznam posledního pádu pro ladění. Prázdný, když brána nespadla.'],
  'Link mode': ['Autonegotiation suits nearly every switch. Force speed and duplex only when the switch port is forced to the same values: a forced port against an autonegotiating one ends up in half duplex and loses packets.',
    'Autonegociace vyhovuje téměř každému switchi. Rychlost a duplex vynuťte, jen když je port switche nastavený napevno na stejné hodnoty: vynucený port proti autonegociaci skončí v half duplexu a ztrácí pakety.'],
  'Restart': ['Restarts the P4; the active role is back after about 10 s.', 'Restartuje P4; aktivní role naběhne asi za 10 s.'],
  'Radio running': ['Firmware the radio runs, as it reports it itself.', 'Firmware, který rádio běží, jak ho samo hlásí.'],
  'Radio MAC': ['Factory MAC of the radio chip, read from its ROM bootloader when it was last flashed.', 'Tovární MAC čipu rádia, načtená z jeho ROM bootloaderu při posledním flashování.'],
  'Radio chip revision': ['Silicon revision of the radio chip.', 'Revize křemíku čipu rádia.'],
  'Radio flash': ['Flash size of the radio module.', 'Velikost flash modulu rádia.'],
  'Radio flashes': ['Successful reflashes of the radio done by the gateway (role switches that change its firmware).', 'Úspěšná přeflashování rádia bránou (přepnutí rolí, která mění jeho firmware).'],
  'Radio temperature': ['Internal temperature sensor of the radio chip, sent by its firmware every 30 s. Min/max since the gateway start.', 'Vnitřní teplotní senzor čipu rádia, jeho firmware ho posílá každých 30 s. Min/max od startu brány.'],
  'Radio memory': ['Free RAM of the radio now and the lowest value since its start.', 'Volná RAM rádia teď a nejnižší hodnota od jeho startu.'],
  'Radio uptime': ['Time since the radio last started. Shorter than the gateway uptime means the radio was reset.', 'Doba od posledního startu rádia. Kratší než doba běhu brány znamená, že rádio bylo resetováno.'],
  'Radio last reset': ['Why the radio last started: poweron (reset by the gateway), panic or watchdog point to a crash.', 'Proč rádio naposledy startovalo: poweron (reset od brány), panic nebo watchdog znamenají pád.'],
  'Radio images': ['Firmwares for this radio on the gateway: the package of its chip, or what the radio was last flashed from. The rest comes with the package at a role switch.', 'Firmwary pro toto rádio na bráně: balík jeho čipu, nebo z čeho bylo naposledy flashováno. Ostatní přijdou s balíkem při přepnutí role.'],
  'Reflash radio B now': ['Rewrites radio B with the firmware of its role on the next start. Use after repeated radio failures.', 'Přepíše rádio B firmwarem jeho role při příštím startu. Použijte po opakovaných výpadcích rádia.'],
  'Back up radio B flash': ['Reads the whole flash of radio B to a file. Works only while radio B has no role.', 'Přečte celou flash rádia B do souboru. Funguje jen, když rádio B nemá roli.'],
  'Reflash C6 now': ['Rewrites the C6 with the firmware of the current role. Use after repeated radio failures.', 'Přepíše C6 firmwarem aktuální role. Použijte po opakovaných výpadcích rádia.'],
  'Back up C6 flash': ['Reads the whole 4 MB C6 flash to a file. Works only in maintenance mode.', 'Přečte celou 4MB flash C6 do souboru. Funguje jen v režimu údržby.'],
  'Matter Server': ['WebSocket of the Matter Server add-on (Home Assistant), e.g. ws://homeassistant.local:5580/ws. Port 5580 has to be exposed in the add-on (Configuration, Network). Gives vendor, product, name, serial number and device type of each Matter device; they are matched with the map by Thread MAC or IPv6 address.', 'WebSocket doplňku Matter Server (Home Assistant), např. ws://homeassistant.local:5580/ws. Port 5580 musí být v doplňku zpřístupněný (Konfigurace, Síť). Dodá výrobce, produkt, název, sériové číslo a typ každého zařízení Matter; s mapou se párují podle MAC Thread nebo IPv6 adresy.'],
  'Zigbee map': ['Zigbee2MQTT asks every router for its neighbour table (it takes several minutes in a large network) and sends the map; the gateway keeps the last one.', 'Zigbee2MQTT se zeptá každého routeru na tabulku sousedů (ve velké síti to trvá několik minut) a pošle mapu; brána si drží poslední.'],
  'Z2M coordinator': ['Coordinator adapter of this Zigbee2MQTT and its firmware. "this gateway" when Zigbee2MQTT uses this gateway as its coordinator.', 'Koordinátor tohoto Zigbee2MQTT a jeho firmware. „tato brána“, když Zigbee2MQTT používá jako koordinátor tuto bránu.'],
  'Z2M base topic': ['MQTT base topic of this Zigbee2MQTT instance (base_topic in its configuration).', 'Základní MQTT topic této instance Zigbee2MQTT (base_topic v její konfiguraci).'],
  'Z2M devices': ['Devices in the Zigbee2MQTT device list, the coordinator included.', 'Zařízení v seznamu Zigbee2MQTT včetně koordinátoru.'],
  'Zigbee model': ['Vendor and model as Zigbee2MQTT identified the device, with its description.', 'Výrobce a model, jak zařízení rozpoznal Zigbee2MQTT, s popisem.'],
  'Zigbee type': ['coordinator: runs the network; router: mains powered, forwards traffic; end device: talks only to its parent, often on battery.', 'koordinátor: řídí síť; router: napájený ze sítě, přeposílá provoz; koncové zařízení: komunikuje jen se svým rodičem, často na baterie.'],
  'Zigbee availability': ['Availability in Zigbee2MQTT (online / offline, needs availability enabled there), plus an available update or an unfinished interview.', 'Dostupnost v Zigbee2MQTT (online / nedostupné, vyžaduje zapnuté availability), k tomu dostupná aktualizace nebo nedokončené načtení zařízení.'],

  'Device Thread role': ['Role of the device in the Thread mesh: router (border router, leader) or end device, always on or sleepy.', 'Role zařízení v Thread síti: router (border router, leader) nebo koncové zařízení, stále zapnuté nebo spící.'],

  'Full scan': ['Restarts into a scanner firmware on the chosen radio: Wi-Fi access points (radio B also 5 GHz), 802.15.4 beacons, PANs seen in traffic and noise. The roles are off for about a minute; Zigbee network data is kept.', 'Restart do skenovacího firmwaru na zvoleném rádiu: přístupové body Wi-Fi (rádio B i 5 GHz), beacony 802.15.4, PAN viditelné v provozu a šum. Role jsou asi minutu mimo provoz; data Zigbee sítě zůstanou.'],
  'Noise': ['Strongest energy measured on the channel (energy detect). Below -90 dBm is quiet, above -75 dBm means strong interference or traffic.', 'Nejsilnější energie naměřená na kanálu (energy detect). Pod -90 dBm je ticho, nad -75 dBm silné rušení nebo provoz.'],
  'Wi-Fi overlap': ['Combined signal of the Wi-Fi networks whose band covers this channel. A 20 MHz Wi-Fi channel covers about four 802.15.4 channels.', 'Součet signálu Wi-Fi sítí, jejichž pásmo zasahuje tento kanál. Kanál Wi-Fi 20 MHz pokryje zhruba čtyři kanály 802.15.4.'],
  'Networks': ['Thread and Zigbee networks found on the channel; ★ marks yours.', 'Sítě Thread a Zigbee nalezené na kanálu; ★ označuje vaše.'],
  'Score': ['0–100 from Wi-Fi overlap, noise and existing networks; higher is better for a new network.', '0–100 podle překryvu s Wi-Fi, šumu a existujících sítí; vyšší je pro novou síť lepší.'],

  'Width': ['40 MHz Wi-Fi covers twice the band of 20 MHz and disturbs more 802.15.4 channels. 5 GHz networks (80, 160 MHz) do not disturb 802.15.4.', 'Wi-Fi 40 MHz zabírá dvojnásobné pásmo než 20 MHz a ruší víc kanálů 802.15.4. Sítě 5 GHz (80, 160 MHz) 802.15.4 neruší.'],

const th = l => { const [label, key] = Array.isArray(l) ? l : [l, l]; return `<th>${esc(label)}${tip(key)}</th>`; };

const dl = pairs => '<dl>' + pairs.filter(p => p && p[1] !== undefined && p[1] !== null && p[1] !== '')
  .map(([k, v, t]) => `<dt>${esc(k)}${tip(t || k)}</dt><dd>${v}</dd>`).join('') + '</dl>';
const rev = n => `v${Math.floor(n / 100)}.${n % 100}`;
/* percentage with a small bar; warn/bad colouring from the thresholds */
const meter = (pct, warn = 70, bad = 90) => `<span class="meter"><span class="progress"><span class="${pct >= bad ? 'bad' : pct >= warn ? 'warn' : ''}" style="width:${Math.min(100, pct)}%"></span></span>${pct.toFixed(0)} %</span>`;
const used = (free, total) => total ? 100 - free / total * 100 : 0;
const temp = s => s.temperature_c === undefined ? '' : `${s.temperature_c} °C` + (s.hw?.temp_max_c !== undefined ? ` <span class="muted">(min ${s.hw.temp_min_c}, max ${s.hw.temp_max_c})</span>` : '');
const cpuLoad = hw => (hw?.cpu_load || []).map((l, i) => `<div class="row">core ${i} ${meter(l)}</div>`).join('');
/* radio temperature with min/max since the gateway start and the age of a stale report */
const telTemp = t => `${t.temp_c} °C` + (t.temp_max_c !== undefined ? ` <span class="muted">(min ${t.temp_min_c}, max ${t.temp_max_c})</span>` : '') + (t.age_s > 90 ? ` <span class="warn-text">(${t.age_s} s old)</span>` : '');

function radioBRows(bundle, c = {}, t) {
  return [
    [L('Running', 'Běží'), bundle ? `<span data-notr>${esc(t?.fw || bundle)}</span>${t?.ver ? ` <span class="muted">${esc(t.ver)}</span>` : ''}` : '', 'Radio running'],
    ['MAC', c.mac ? esc(c.mac) : `<span class="muted">${L('read at the next flashing', 'načte se při příštím flashování')}</span>`, 'Radio MAC'],

    [L('Memory', 'Paměť'), t ? `${fmtBytes(t.heap_free)} ${L('free', 'volné')}, min ${fmtBytes(t.heap_min)}` : '', 'Radio memory'],
    [L('Uptime', 'Doba běhu'), t ? fmtUptime(t.uptime_s) : '', 'Radio uptime'], [L('Last reset', 'Poslední reset'), t ? esc(t.reset) : '', 'Radio last reset']];
}
/* C6 rows shared by the overview and Radios › Status and maintenance */
function c6Rows(s, full) {
  const c = s.c6, chip = c.chip || {}, rs = s.role_status || {}, tel = c.telemetry;
  const img = (c.images || []).find(i => i.name === c.bundle);
  const a = s.role?.active || '';
  const link = a.startsWith('thread') ? [['RCP failures', rs.rcp_failures ?? '']]
    : a.startsWith('zigbee') && rs.mode === 'coordinator' ? [['UART', rs.uart_baud ? rs.uart_baud + ' Bd' : ''], ['UART errors', rs.uart_errors], ['C6 resets', rs.c6_resets]]
    : a.startsWith('zigbee') ? [['Status age', rs.router_status_age_s >= 0 ? rs.router_status_age_s.toFixed(0) + ' s' : 'never']] : [];
  return [
    ['Running', `<span data-notr>${esc(c.bundle || 'unknown')}</span>${img ? ` <span class="muted">${esc(img.version)}</span>` : ''}`, 'C6 running'],
    ...link,
    ['C6 MAC', chip.mac ? esc(chip.mac) : '<span class="muted">read at the next C6 flashing</span>'],
    ['C6 chip revision', chip.mac ? rev(chip.revision) : tel?.rev !== undefined ? rev(tel.rev) : ''],
    ['C6 flash', chip.flash_size ? fmtBytes(chip.flash_size) : ''], ['Flashes', chip.flashes || ''],
    ['Temperature', tel?.temp_c != null ? telTemp(tel) : '<span class="muted">not reported by this C6 firmware</span>', 'C6 temperature'],
    ['C6 memory', tel ? `${fmtBytes(tel.heap_free)} free, min ${fmtBytes(tel.heap_min)}` : ''],
    ['C6 uptime', tel ? fmtUptime(tel.uptime_s) : ''], ['C6 last reset', tel ? esc(tel.reset) : ''],

    ['Last flash error', esc(c.flash.last_error)]];

/* traffic for the header and overview tooltips: counters of the LAN (and of the Wi-Fi uplink while a
 * radio runs it) every 10 s, rates from the last two samples; nothing without the permission of
 * System › LAN (the request fails, the rows stay empty) */
const hdrNet = { lan: {}, wifi: {} };
let hdrNetAt = 0;
async function sampleNet() {
  if (Date.now() - hdrNetAt < 9500) return;
  hdrNetAt = Date.now();
  for (const [k, url] of [['lan', '/api/net/traffic'], ['wifi', wifiUplink() ? '/api/net/wifi/traffic' : null]]) {
    const n = hdrNet[k];
    if (!url) { hdrNet[k] = {}; continue; }
    try {
      const t = await api(url);
      const dt = n.cur && t.uptime_ms > n.cur.uptime_ms ? (t.uptime_ms - n.cur.uptime_ms) / 1000 : 0;
      const d = (a, b) => Math.max(0, (a - b) / dt);
      n.rates = dt ? { rx: d(t.rx, n.cur.rx), tx: d(t.tx, n.cur.tx),
        svc: Object.fromEntries(Object.keys(t.services).map(x => [x, { rx: d(t.services[x].rx, n.cur.services[x].rx), tx: d(t.services[x].tx, n.cur.services[x].tx) }])) } : null;
      n.cur = t;
    } catch (e) { hdrNet[k] = {}; }
  }
}
/* tooltip rows of traffic: since start and the current rate, of all or of the listed services; via
 * names what the traffic is (LAN or Wi-Fi by default) */
function netRows(k, svcs, via) {
  const n = hdrNet[k], t = n.cur, r = n.rates;
  if (!t?.uptime_ms) return [];
  const sum = (o, f) => svcs.reduce((a, x) => a + (o[x]?.[f] || 0), 0);
  const total = svcs ? [sum(t.services, 'rx'), sum(t.services, 'tx')] : [t.rx, t.tx];
  const rate = r ? (svcs ? [sum(r.svc, 'rx'), sum(r.svc, 'tx')] : [r.rx, r.tx]) : null;
  const where = via || (k === 'wifi' ? 'Wi-Fi' : 'LAN');
  return [[L(`Traffic over ${where} since start`, `Provoz přes ${where} od startu`), `↓ ${fmtBytes(total[0])} · ↑ ${fmtBytes(total[1])}`],
    [L('Now', 'Nyní'), rate ? `↓ ${fmtRate(rate[0])} · ↑ ${fmtRate(rate[1])}` : '…']];
}

let datasetTlvs = '';
async function loadDataset(reveal) {
  const box = $('#dataset');
  if (!box) return;
  try {
    const d = await api('/api/thread/dataset' + (reveal ? '?reveal=1' : ''));
    if (d.tlvs) datasetTlvs = d.tlvs;
    box.innerHTML = dl([['Network name', esc(d.network_name)], ['Channel', d.channel], ['PAN ID', esc(d.pan_id)],
      ['Ext PAN ID', esc(d.ext_pan_id)], ['Network key', `<code>${esc(d.network_key)}</code>`],
      ['TLVs', d.tlvs ? `<code style="word-break:break-all">${esc(d.tlvs)}</code>` : '<span class="muted">hidden</span>']]);
  } catch (e) {
    box.innerHTML = `<span class="warn-text">${esc(e.message)}</span>`;
  }
}

async function runCli(cmd) {
  const out = $('#cli-out');
  out.textContent = '> ' + cmd + '\n…';
  try {
    const r = await api('/api/thread/cli', { json: { cmd, wait_ms: +$('#cli-wait').value || 800 } });
    out.textContent = '> ' + cmd + '\n' + (r.output || '(no output)');
  } catch (e) {
    out.textContent = '> ' + cmd + '\nerror: ' + e.message;
  }
}

}

function renderTree() {
  const tops = new Map();
  sndClasses.forEach(([i, name, top, group]) => {
    if (!tops.has(top)) tops.set(top, new Map());
    const g = tops.get(top);
    if (!g.has(group)) g.set(group, []);
    g.get(group).push([i, name]);
  });
  const row = ([i, name]) => `<label class="cls-row" data-name="${esc(name.toLowerCase())}" style="display:flex;gap:8px;align-items:center;padding:2px 0">
    <input type="checkbox" data-cls="${i}" ${sndExclude.has(i) ? '' : 'checked'}><span style="flex:1" data-notr>${esc(name)}</span>
    <span class="progress" style="width:80px;height:6px"><div id="cs-${i}"></div></span></label>`;
  let html = '';
  for (const [top, groups] of tops) {
    const n = [...groups.values()].reduce((a, v) => a + v.length, 0);
    html += `<details class="cls-top"><summary><b>${esc(top)}</b> <span class="muted">${n}</span> <button class="btn" data-cls-all="${esc(top)}">all</button> <button class="btn" data-cls-none="${esc(top)}">none</button></summary><div style="padding-left:16px">`;
    for (const [group, items] of groups) {
      html += group === '-' ? items.map(row).join('') : `<details><summary><span data-notr>${esc(group)}</span> <span class="muted">${items.length}</span></summary><div style="padding-left:16px">${items.map(row).join('')}</div></details>`;
    }
    html += '</div></details>';
  }
  $('#cls-tree').innerHTML = html;
  $('#cls-tree').dataset.built = '1';
  updateClsSummary();
}

function updateClsSummary() {
  if (!$('#cls-summary')) return;
  $('#cls-summary').textContent = `${521 - sndExclude.size} reported, ${sndExclude.size} ignored${sndDirty ? ' (unsaved)' : ''}`;
}

function addChip(inputId, listKey, chipId) {
  const name = $('#' + inputId).value;

}

async function loadSound() {
  if (tab !== 'sound') { clearInterval(soundTimer); soundTimer = null; return; }

  let st;
  try { st = await api('/api/sound/status'); } catch (e) { return; }
  if (!$('#snd-en')) return; /* the page changed while the request ran */
  const set = (id, fn) => { const el = $('#' + id); if (el && document.activeElement !== el) fn(el); };
  set('snd-en', el => { el.checked = st.enabled; });
  set('snd-ai', el => { el.checked = st.inference.enabled; });
  set('snd-gain', el => { el.value = st.gain_db; });

    $('#snd-levels').textContent = `level ${st.level_db} dBFS, peak ${st.peak_db}, noise floor ${st.floor_db}, ${st.read_errors} read errors`;
  }
  const p = st.spl;
  $('#snd-spl').innerHTML = p ? dl([
    ['Now (slow)', `<b>${p.las} dB(A)</b>`],
    [p.partial ? 'Average so far (LAeq)' : `Average ${p.window_s / 60} min (LAeq)`, `${p.laeq} dB(A)`],
    [p.partial ? 'Max so far' : `Max ${p.window_s / 60} min`, `${p.lamax} dB(A)${p.overload ? ' ' + pill('warn', 'overload: lower the gain') : ''}`],
    ['Calibration', p.calibrated ? pill('ok', `calibrated, offset ${p.offset} dB`) : pill('warn', 'estimate (±6 dB), not calibrated')]]) : 'Microphone is off.';
  const m = st.model, inf = st.inference;

    ['Model', m.stored_bytes ? `${fmtBytes(m.stored_bytes)} stored, ${m.loaded ? pill('ok', 'loaded') : pill('warn', 'not loaded')}` : pill('bad', 'none, upload yamnet_p4.espdl')],
    ['Load time', m.load_ms ? m.load_ms + ' ms' : ''], ['Error', esc(m.error)],
    ['Inference', inf.runs ? `${inf.avg_ms} ms avg, ${inf.max_ms} ms max, last ${inf.last_ms} ms` : ''],
    ['CPU (core 1)', inf.runs ? inf.cpu_pct + ' %' : ''],
    ['Runs / skipped quiet', `${inf.runs} / ${inf.skipped_quiet}`]]);
  $('#snd-top').innerHTML = inf.top ? `<table>${inf.top.map(t => `<tr><td data-notr>${heardName(t)}</td><td style="width:50%"><div class="progress"><div style="width:${t.score * 100}%"></div></div></td><td>${(t.score * 100).toFixed(0)} %</td></tr>`).join('')}</table>
    <p class="muted">${inf.top_age_s.toFixed(0)} s ago</p>` : 'Recognition is off or nothing above the gate yet.';
}

async function soundConfig(body) {
  const r = await api('/api/sound/config', { json: body });

document.addEventListener('change', e => {
  const id = e.target.id;
  if (e.target.dataset.cls !== undefined) {
    const i = +e.target.dataset.cls;
    if (e.target.checked) sndExclude.delete(i); else sndExclude.add(i);
    sndDirty = true; updateClsSummary(); return;
  }
  if (e.target.dataset.evToggle !== undefined) {
    const events = sndCfg.events.slice();
    events[+e.target.dataset.evToggle].enabled = e.target.checked;
    putEvents({ events }).catch(err => toast('Error: ' + err.message));
    return;
  }
  if (id === 'zb-snap-days') { api('/api/settings', { json: { zigbee_backup_days: +e.target.value } }).then(() => { status.c6.snapshot_days = +e.target.value; toast('Saved'); }).catch(err => toast('Error: ' + err.message)); return; }
  if (id === 'z2m-base') { api('/api/zigbee/net/base', { json: { base: e.target.value } }).then(() => loadZigbeeNet(true)).catch(err => toast('Error: ' + err.message)); return; }
  if (id === 'ev-add') { addChip('ev-add', 'classes', 'ev-classes'); return; }
  if (id === 'ev-add-sup') { addChip('ev-add-sup', 'suppress', 'ev-suppress'); return; }
  if (id === 'ev-thr') { $('#ev-thr-v').textContent = e.target.value; return; }
  if (id === 'set-import') {
    const f = e.target.files[0];
    e.target.value = '';
    if (f) importSettings(f).catch(err => toast('Error: ' + err.message));
    return;
  }
  if (id === 'ev-import') {
    const f = e.target.files[0];
    if (f) f.text().then(t => { const c = JSON.parse(t); sndExclude = new Set(c.exclude || []); sndDirty = false; return putEvents(c); }).then(() => renderTree()).catch(err => toast('Error: ' + err.message));
    e.target.value = '';
    return;
  }
  if (id === 'snd-en') soundConfig({ enabled: e.target.checked }).catch(err => toast('Error: ' + err.message));
  else if (id === 'snd-ai') soundConfig({ inference: e.target.checked }).catch(err => toast('Error: ' + err.message));
  else if (id === 'snd-gain') soundConfig({ gain_db: +e.target.value }).catch(err => toast('Error: ' + err.message));
  else if (id === 'snd-gate') soundConfig({ gate_db: +e.target.value }).catch(err => toast('Error: ' + err.message));
});

/* Release notes (Markdown of the CHANGELOG): paragraphs, "- " lists, **bold**, *italic*, `code`. */
function mdLite(text) {
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*([^*\s][^*]*)\*/g, '<i>$1</i>');
  const blocks = [];
  let cur = null;
  for (const line of String(text || '').split('\n')) {
    if (!line.trim()) { cur = null; continue; }
    if (/^\s*[-*] /.test(line)) blocks.push(cur = { li: true, text: line.replace(/^\s*[-*] /, '') });
    else if (cur) cur.text += ' ' + line.trim();
    else blocks.push(cur = { li: false, text: line.trim() });
  }
  let html = '', list = false;
  for (const b of blocks) {
    if (b.li !== list) { html += b.li ? '<ul>' : '</ul>'; list = b.li; }
    html += b.li ? `<li>${inline(b.text)}</li>` : `<p>${inline(b.text)}</p>`;
  }
  return html + (list ? '</ul>' : '');
}

function matterFetch(url) {

    ws.onopen = () => ws.send(JSON.stringify({ message_id: 'p4gw-nodes', command: 'get_nodes' }));
    ws.onmessage = ev => {

/* one entry per Matter node with what identifies it, and keys to find it in the map */

    const types = new Set();
    for (const [k, v] of Object.entries(a)) {
      if (!/^\d+\/29\/0$/.test(k) || k === '0/29/0' || !Array.isArray(v)) continue;
      v.forEach(t => { const id = t['0'] ?? t.deviceType; if (MATTER_TYPES[id]) types.add(L(...MATTER_TYPES[id])); });

      role: a['0/53/1'], channel: a['0/53/0'], ext: nif && nif['4'] ? b64hex(nif['4']) : '',

  return index.find(m => (dev.ext && m.ext === dev.ext) || m.ip6.some(ip => ips.has(ip))) || null;

/* ---- network maps: zoom, pan and the signal layout, the same for the Thread and the Zigbee map ---- */
let mapLayout = 'ring';

const mapView = {}; /* map -> viewBox [x, y, w, h] the user zoomed to; kept across redraws */

/* Signal layout: distances between nodes follow the link quality (a stronger link is a shorter
 * edge); nodes without a direct link end up as far apart as the best path between them. Stress
 * majorization over the weighted shortest paths, started from the ring so the result is stable. */
function signalLayout(ids, links, ring, W, H, margin) {
  const n = ids.length, ix = new Map(ids.map((id, i) => [id, i]));
  if (n < 3) return ring;
  const D = ids.map((_, i) => ids.map((__, j) => i === j ? 0 : Infinity));
  for (const { a, b, d } of links) {
    const i = ix.get(a), j = ix.get(b);
    if (i !== undefined && j !== undefined && i !== j && d < D[i][j]) D[i][j] = D[j][i] = d;
  }
  for (let k = 0; k < n; k++) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (D[i][k] + D[k][j] < D[i][j]) D[i][j] = D[i][k] + D[k][j];
  const far = Math.max(1, ...D.flat().filter(Number.isFinite)) * 1.3;
  D.forEach(row => row.forEach((v, j) => { if (!Number.isFinite(v)) row[j] = far; }));
  const rx = Math.max(1, ...ids.map(id => Math.abs(ring.get(id).x - W / 2)));
  let X = ids.map(id => [(ring.get(id).x - W / 2) / rx * far / 2, (ring.get(id).y - H / 2) / rx * far / 2]);
  for (let it = 0; it < 300; it++) {
    X = X.map((p, i) => {
      let sx = 0, sy = 0, sw = 0;
      for (let j = 0; j < n; j++) {
        if (i === j) continue;
        const w = 1 / (D[i][j] * D[i][j]), dx = p[0] - X[j][0], dy = p[1] - X[j][1], dist = Math.hypot(dx, dy) || 1e-6;
        sx += w * (X[j][0] + D[i][j] * dx / dist);
        sy += w * (X[j][1] + D[i][j] * dy / dist);
        sw += w;
      }
      return [sx / sw, sy / sw];
    });
  }
  const xs = X.map(p => p[0]), ys = X.map(p => p[1]);
  const x0 = Math.min(...xs), y0 = Math.min(...ys), k = Math.min((W - 2 * margin) / (Math.max(...xs) - x0 || 1), (H - 2 * margin) / (Math.max(...ys) - y0 || 1));
  const ox = (W - k * (Math.max(...xs) - x0)) / 2, oy = (H - k * (Math.max(...ys) - y0)) / 2;
  return new Map(ids.map((id, i) => {
    const x = ox + k * (X[i][0] - x0), y = oy + k * (X[i][1] - y0);
    return [id, { x, y, a: Math.atan2(y - H / 2, x - W / 2) }];
  }));
}

  svg.addEventListener('pointerdown', e => { if (e.button === 0) drag = { x: e.clientX, y: e.clientY, vb: svg.getAttribute('viewBox').split(' ').map(Number), moved: false }; });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;

  svg.addEventListener('pointerup', end);

/* draws the Thread map from the last answer: ring or, toggled with L, the signal layout */
function drawTopology() {
  const box = $('#topo-map');
  if (!box || !topoLast) return;
  const { routers, ids } = topoLast;
  const W = 900, H = 640, cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 110;
  let pos = new Map(ids.map((id, i) => {
    const a = -Math.PI / 2 + 2 * Math.PI * i / ids.length;
    return [id, { x: ids.length > 1 ? cx + R * Math.cos(a) : cx, y: ids.length > 1 ? cy + R * Math.sin(a) : cy, a }];
  }));
  if (mapLayout === 'signal') {
    /* LQ 3 is the shortest edge; the weaker of both directions counts */
    const links = [];
    for (const r of routers.values()) for (const l of r.links) {
      const back = routers.get(l.id)?.links.find(x => x.id === r.id);
      links.push({ a: r.id, b: l.id, d: 1 + 0.8 * (3 - Math.min(l.lq, back ? back.lq : l.lq)) });
    }
    pos = signalLayout(ids, links, pos, W, H, 110);
  }
  const lqCls = q => q >= 3 ? 'ok' : q === 2 ? 'warn' : 'bad';
  let edges = '', nodes = '', children = '';
  const seen = new Set();
  for (const r of routers.values()) for (const l of r.links) {
    const key = [Math.min(r.id, l.id), Math.max(r.id, l.id)].join('-');
    if (seen.has(key) || !pos.has(l.id)) continue;
    seen.add(key);
    const back = routers.get(l.id).links.find(x => x.id === r.id);
    const q = back ? Math.min(back.lq, l.lq) : l.lq;
    const p1 = pos.get(r.id), p2 = pos.get(l.id);
    edges += `<line class="topo-link ${lqCls(q)}" data-a="r${r.id}" data-b="r${l.id}" ${back ? '' : 'stroke-dasharray="5 5"'} x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}"><title>R${r.id} ↔ R${l.id}: ${L('link quality', 'kvalita linky')} ${back ? `${l.lq} / ${back.lq}` : l.lq}</title></line>`;
  }
  for (const r of routers.values()) {
    const p = pos.get(r.id);
    r.children.forEach((c, i) => {
      const spread = 0.22, a = p.a + (i - (r.children.length - 1) / 2) * spread, dist = ids.length > 1 ? 58 : 70 + 12 * i;
      const x = p.x + dist * Math.cos(a), y = p.y + dist * Math.sin(a);
      children += `<line class="topo-link ${lqCls(c.lq)}" data-a="r${r.id}" data-b="c${c.rloc16}" x1="${p.x}" y1="${p.y}" x2="${x}" y2="${y}"/>
        <circle class="topo-child ${c.rx_on ? '' : 'sleepy'}" cx="${x}" cy="${y}" r="7" data-node="c${c.rloc16}" tabindex="0"/>
        ${topoInfo.get('c' + c.rloc16).name ? `<text x="${x + (Math.cos(a) >= 0 ? 10 : -10)}" y="${y + 4}" text-anchor="${Math.cos(a) >= 0 ? 'start' : 'end'}">${esc(topoInfo.get('c' + c.rloc16).name.slice(0, 20))}</text>` : ''}`;
    });
    const label = topoInfo.get('r' + r.id).name.slice(0, 22);
    nodes += `<g class="topo-node ${r.this ? 'this' : ''} ${r.missing ? 'missing' : ''}" data-node="r${r.id}" tabindex="0"><circle cx="${p.x}" cy="${p.y}" r="18"/>
      <text x="${p.x}" y="${p.y + 4}" text-anchor="middle" class="id">${r.id}</text>
      ${r.leader ? `<text x="${p.x + 15}" y="${p.y - 13}" class="badge">★</text>` : ''}${r.br ? `<text x="${p.x - 26}" y="${p.y - 13}" class="badge">BR</text>` : ''}
      <text x="${p.x}" y="${p.y + 34}" text-anchor="middle">${esc(label)}</text></g>`;
  }
  box.classList.remove('muted');
  box.innerHTML = `<div class="map-wrap"><svg class="topo tmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Thread network map">${edges}${children}${nodes}</svg>${mapTools()}
    ${mapLegend([[lgLine('ok'), L('good link (LQ 3)', 'dobrá linka (LQ 3)')], [lgLine('warn'), L('medium link (LQ 2)', 'střední linka (LQ 2)')],
      [lgLine('bad'), L('weak link (LQ 0–1)', 'slabá linka (LQ 0–1)')], [lgLine('muted', true), L('reported by one side only', 'hlásí jen jedna strana')],
      [lgDot(8, 'var(--panel-2)', 'var(--accent)'), L('router, number = router ID', 'router, číslo = ID routeru')], [lgDot(8, 'var(--accent)', 'var(--accent)'), L('this gateway', 'tato brána')],
      ['<span class="warn-text"><b>★</b></span>', 'leader'], ['<span class="warn-text"><b>BR</b></span>', 'border router'],
      [lgDot(5, 'var(--muted)', 'var(--muted)'), L('end device', 'koncové zařízení')], [lgDot(5, 'var(--panel)', 'var(--muted)'), L('sleepy end device', 'spící koncové zařízení')]])}</div>
    <p class="muted">${L('Hover a device for details and its links.', 'Najetím na zařízení zobrazíte detaily a zvýrazníte jeho linky.')} ${mapHelp()}</p>`;

    <td data-notr><b>${esc(v.name || v.fallback)}</b></td><td data-notr>${esc(v.matter?.vendor || v.vendor || '')}</td><td data-notr>${esc(v.matter?.product || v.model || '')}</td>

}

/* Coordinator in the middle, routers on a ring, end devices next to their parent. Links between
 * routers in the colour of their LQI; hovering a device highlights its own links. */
function renderZMap(map, devs) {
  const box = $('#zmap');
  zmapLast = [map, devs];
  box.dataset.at = String(map.at);
  const byIeee = new Map(devs.map(x => [x.ieee, x]));
  const nodes = map.nodes.map(n => ({ ...n, dev: byIeee.get(n.ieee) }));
  const coord = nodes.find(n => n.type === 'Coordinator');
  const routers = nodes.filter(n => n.type === 'Router').sort((a, b) => a.name.localeCompare(b.name));
  const ends = nodes.filter(n => n.type === 'EndDevice');
  const W = 1000, H = 760, cx = W / 2, cy = H / 2, R = 270;
  const pos = new Map();
  if (coord) pos.set(coord.ieee, { x: cx, y: cy, a: 0 });
  routers.forEach((n, i) => { const a = -Math.PI / 2 + 2 * Math.PI * i / Math.max(1, routers.length); pos.set(n.ieee, { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a }); });
  /* parent of an end device: the link where it is the child (relationship 1) */
  const parent = new Map();
  map.links.forEach(l => { if (l.rel === 1 && !parent.has(l.s)) parent.set(l.s, l.t); });
  const perParent = new Map();
  ends.forEach(n => { const p = parent.get(n.ieee) || coord?.ieee; perParent.set(p, (perParent.get(p) || []).concat(n)); });
  if (mapLayout === 'signal') {
    /* coordinator and routers by their LQI (255 is the shortest edge); end devices stay next to their parent */
    const ids = [...pos.keys()];
    const links = map.links.filter(l => l.s !== l.t && pos.has(l.s) && pos.has(l.t)).map(l => ({ a: l.s, b: l.t, d: 1 + 3 * (255 - (l.lqi || 0)) / 255 }));
    for (const [id, p] of signalLayout(ids, links, pos, W, H, 90)) pos.set(id, p);
  }
  for (const [p, list] of perParent) {
    const pp = pos.get(p) || { x: cx, y: cy, a: 0 };
    const base = p === coord?.ieee ? Math.PI / 2 : pp.a;
    list.forEach((n, i) => {
      const a = base + (i - (list.length - 1) / 2) * 0.16, d = p === coord?.ieee ? 90 + 14 * (i % 3) : 62 + 14 * (i % 2);
      pos.set(n.ieee, { x: pp.x + d * Math.cos(a), y: pp.y + d * Math.sin(a), a });
    });
  }
  const pairs = new Map();
  map.links.forEach(l => {
    if (!pos.has(l.s) || !pos.has(l.t) || l.s === l.t) return;
    const key = [l.s, l.t].sort().join('|');
    const isChild = l.rel === 1 || l.rel === 0;
    const e = pairs.get(key) || { a: l.s, b: l.t, lqi: 0, child: false };
    e.lqi = Math.max(e.lqi, l.lqi || 0);
    e.child = e.child || isChild;
    pairs.set(key, e);
  });
  let edges = '', dots = '';
  for (const e of pairs.values()) {
    const p1 = pos.get(e.a), p2 = pos.get(e.b);
    edges += `<line class="zl ${zLqiCls(e.lqi)} ${e.child ? 'child' : ''}" data-a="${e.a}" data-b="${e.b}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}"/>`;
  }
  for (const n of nodes) {
    const p = pos.get(n.ieee);
    if (!p) continue;
    const off = n.dev?.availability === 'offline' || n.failed;
    const label = n.dev?.own ? L('this gateway', 'tato brána') : (n.dev?.name || n.name || '').slice(0, 14);
    if (n.type === 'EndDevice') {
      dots += `<g class="zn end ${off ? 'off' : ''}" data-znode="${n.ieee}" tabindex="0"><circle cx="${p.x}" cy="${p.y}" r="6"/></g>`;
    } else {
      const r = n.type === 'Coordinator' ? 20 : 12;
      const right = Math.cos(p.a) >= 0;
      dots += `<g class="zn ${n.type === 'Coordinator' ? 'coord' : 'router'} ${off ? 'off' : ''} ${n.dev?.own ? 'own' : ''}" data-znode="${n.ieee}" tabindex="0"><circle cx="${p.x}" cy="${p.y}" r="${r}"/>
        <text x="${n.type === 'Coordinator' ? p.x : p.x + (right ? 16 : -16)}" y="${n.type === 'Coordinator' ? p.y + 36 : p.y + 4}" text-anchor="${n.type === 'Coordinator' ? 'middle' : right ? 'start' : 'end'}">${esc(label)}</text></g>`;
    }
  }
  const failed = nodes.filter(n => n.failed).length;
  box.classList.remove('muted');
  box.innerHTML = `<div class="map-wrap"><svg class="topo zmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Zigbee network map">${edges}${dots}</svg>${mapTools()}
    ${mapLegend([[lgLine('ok'), 'LQI ≥ 120'], [lgLine('warn'), 'LQI 60–119'], [lgLine('bad'), 'LQI < 60'],
      [lgDot(10, 'var(--accent)', 'var(--accent)'), L('coordinator', 'koordinátor')], [lgDot(7, 'var(--accent)', 'var(--accent)'), L('this gateway', 'tato brána')], [lgDot(7, 'var(--panel-2)', 'var(--accent)'), mapLayout === 'signal' ? 'router' : L('router (on the ring)', 'router (na kruhu)')],
      [lgDot(4, 'var(--muted)', 'var(--muted)'), L('end device, next to its parent', 'koncové zařízení, u svého rodiče')], [lgDot(7, 'var(--panel)', 'var(--accent)', true), L('offline or did not answer', 'nedostupné nebo neodpovědělo')]])}</div>
    <p class="muted">${L(`${nodes.length} devices, ${pairs.size} links${failed ? `, ${failed} routers did not answer` : ''}. Hover a device for details and its links.`,
      `${nodes.length} zařízení, ${pairs.size} linek${failed ? `, ${failed} routerů neodpovědělo` : ''}. Najetím na zařízení zobrazíte detaily a zvýrazníte jeho linky.`)} ${mapHelp()}</p>`;
  initMapView(box.querySelector('svg'), 'zmap');
}
