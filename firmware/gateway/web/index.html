<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P4 Gateway</title>
<style>
:root {
  --bg: #f4f6f9; --panel: #ffffff; --panel-2: #f0f2f6; --text: #18202b; --muted: #5d6878;
  --border: #dde2ea; --accent: #2563eb; --accent-text: #ffffff; --ok: #138a4c; --warn: #b26a00;
  --bad: #c62828; --code: #eef1f6; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --panel: #171c23; --panel-2: #1e252e; --text: #e6eaf0; --muted: #96a1b0;
    --border: #2a323d; --accent: #4f8cff; --accent-text: #0b0e12; --ok: #34c77b; --warn: #f0a63a;
    --bad: #ff6b6b; --code: #10151b; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --panel: #171c23; --panel-2: #1e252e; --text: #e6eaf0; --muted: #96a1b0;
  --border: #2a323d; --accent: #4f8cff; --accent-text: #0b0e12; --ok: #34c77b; --warn: #f0a63a;
  --bad: #ff6b6b; --code: #10151b; --shadow: none; color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
.prefs select { padding: 3px 6px; font-size: 12px; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
/* Layout: header on top, section menu on the left (a drawer below 900 px), content on the right. */
header { position: sticky; top: 0; z-index: 20; height: 52px; background: var(--panel); border-bottom: 1px solid var(--border); }
/* C6 flashing: a pill with the percentage and a strip along the bottom edge of the header */
#hdr-flash .progress { width: 70px; height: 6px; }
#hdr-flash .progress > div { background: var(--warn); }
#hdr-flash { border-color: var(--warn); }
/* identify: the gateway was asked to make itself visible (UI button, Zigbee2MQTT, Home Assistant) */
#hdr-ident { border-color: var(--accent); color: var(--accent); }
#hdr-ident .mdi { animation: blink 1s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: .15; } }
#flash-strip { position: absolute; left: 0; bottom: -1px; height: 3px; width: 0; background: var(--warn); transition: width .4s; display: none; }
header.flashing #flash-strip { display: block; }
.bar { height: 100%; padding: 0 16px; display: flex; align-items: center; gap: 12px; }
.brand { font-weight: 650; font-size: 16px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand small { color: var(--muted); font-weight: 400; }
.spacer { flex: 1; }
.mdi { width: 18px; height: 18px; fill: currentColor; flex: none; vertical-align: -4px; }
#menu-btn { display: none; background: none; border: 0; color: var(--text); padding: 6px; cursor: pointer; }
.layout { display: flex; align-items: flex-start; }
#side { position: sticky; top: 52px; flex: none; width: 236px; height: calc(100vh - 52px); overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--border); padding: 12px 10px 24px; }
#side a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted);
  text-decoration: none; white-space: nowrap; }
#side a:hover { background: var(--panel-2); color: var(--text); }
#side a.on { color: var(--text); font-weight: 600; }
#side a.cur { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
#side .subs { margin: 2px 0 6px 18px; padding-left: 10px; border-left: 1px solid var(--border); }
#side .subs a { padding: 6px 10px; font-size: 13px; }
#side .subs .mdi { width: 16px; height: 16px; }
#side .off { opacity: .55; }
#side a[aria-disabled] { cursor: not-allowed; opacity: .4; }
#side a[aria-disabled]:hover { background: none; color: var(--muted); }
main { flex: 1; min-width: 0; max-width: 1640px; padding: 18px 24px 40px; }
.page-title { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-size: 20px; font-weight: 650; }
.page-title .mdi { width: 24px; height: 24px; color: var(--accent); }
.page-title small { color: var(--muted); font-weight: 400; font-size: 15px; }
#scrim { display: none; }
@media (max-width: 900px) {
  #menu-btn { display: inline-flex; }
  #side { position: fixed; top: 52px; left: 0; z-index: 30; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  body.menu-open #side { transform: none; }
  body.menu-open #scrim { display: block; position: fixed; inset: 52px 0 0; z-index: 25; background: rgba(0,0,0,.35); }
  main { padding: 14px; }
  .brand small, #hdr-uptime { display: none; }
}
@media (max-width: 560px) { #hdr-eth, #hdr-role, #hdr-peer, #hdr-flash { display: none; }
#hdr-ident span { display: none; } }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1100px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.grid > .wide { grid-column: 1 / -1; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 13px; text-transform: uppercase;
  letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.card h3 .mdi { color: var(--accent); }
/* explanation tooltips: an (i) after a label, shown on hover, focus or tap */
.tip { display: inline-flex; margin-left: 4px; color: var(--muted); cursor: help; vertical-align: middle; }
.tip .mdi { width: 14px; height: 14px; }
.tip:hover, .tip:focus { color: var(--accent); outline: none; }
#tipbox { position: fixed; z-index: 50; max-width: 340px; padding: 8px 11px; border-radius: 8px; font-size: 13px; line-height: 1.4;
  background: var(--text); color: var(--bg); box-shadow: 0 4px 16px rgba(0,0,0,.25); pointer-events: none; display: none; }
.card + .card, .grid + .card, .card + .grid, main > * + *, #thread-status > * + * { margin-top: 14px; }
.grid > .card { margin-top: 0; }
/* one label column width on every tile, so values line up across the whole UI */
:root { --label-w: 210px; }
@media (max-width: 560px) { :root { --label-w: 150px; } }
dl { display: grid; grid-template-columns: var(--label-w) minmax(0, 1fr); gap: 6px 16px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px;
  background: var(--panel-2); border: 1px solid var(--border); font-size: 12px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.ok-text { color: var(--ok); } .warn-text { color: var(--warn); } .bad-text { color: var(--bad); }
.muted { color: var(--muted); }
.alert { border-radius: 8px; padding: 10px 12px; border: 1px solid var(--warn); color: var(--text);
  background: color-mix(in srgb, var(--warn) 10%, var(--panel)); margin-bottom: 14px; }
.alert.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--panel)); }
button.btn, a.btn, label.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--text); padding: 6px 12px; border-radius: 7px; font: inherit;
  cursor: pointer; text-decoration: none; }
button.btn:hover, label.btn:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row + .row { margin-top: 8px; }
input[type=text], input[type=password], input[type=number], textarea, select {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 7px;
  padding: 6px 9px; font: inherit; min-width: 0; }
textarea { width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
label.field { display: grid; gap: 4px; margin-bottom: 10px; }
label.field span { color: var(--muted); font-size: 12px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
pre { background: var(--code); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  overflow: auto; margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
.log { height: 420px; white-space: pre; overflow: auto; }
#nodebox { position: fixed; z-index: 50; max-width: 420px; padding: 10px 12px; border-radius: 10px; font-size: 13px; display: none;
  background: var(--panel); color: var(--text); border: 1px solid var(--border); box-shadow: 0 8px 28px rgba(0,0,0,.35); pointer-events: none; }
#nodebox .nb-title { font-weight: 650; font-size: 14px; margin-bottom: 6px; }
#nodebox table { width: auto; }
#nodebox th { color: var(--muted); font-weight: 400; padding: 2px 12px 2px 0; border: 0; vertical-align: top; white-space: nowrap; }
#nodebox td { padding: 2px 0; border: 0; white-space: normal; overflow-wrap: anywhere; }
[data-node] { cursor: pointer; }
.topo { width: 100%; max-height: 640px; display: block; }
.zmap { max-height: 760px; }
td.zact { white-space: normal; min-width: 96px; }
td.zact .btn { padding: 4px 6px; margin: 1px 0; }
.zmap .zl { stroke-width: 1.2; stroke-opacity: .28; }
.zmap .zl.child { stroke-width: 1.6; stroke-opacity: .55; }
.zmap .zl.ok { stroke: var(--ok); } .zmap .zl.warn { stroke: var(--warn); } .zmap .zl.bad { stroke: var(--bad); }
.zmap.focus .zl { stroke-opacity: .05; }
.zmap.focus .zl.hi { stroke-opacity: 1; stroke-width: 2.5; }
.zmap .zn circle { fill: var(--panel-2); stroke: var(--accent); stroke-width: 2; }
.zmap .zn.coord circle, .zmap .zn.own circle { fill: var(--accent); }
.zmap .zn.end circle { stroke: var(--muted); fill: var(--muted); }
.zmap .zn.off circle { fill: var(--panel); stroke-dasharray: 3 3; }
[data-znode] { cursor: pointer; }
.map-wrap { position: relative; }
.map-wrap svg.topo { touch-action: none; cursor: grab; }
.map-wrap svg.topo.panning { cursor: grabbing; }
.map-tools { position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.map-tools .btn { padding: 6px; }
.map-legend { position: absolute; top: 12px; right: 12px; padding: 10px 12px; border-radius: 10px; font-size: 13px; pointer-events: none;
  background: var(--panel); border: 1px solid var(--border); box-shadow: 0 8px 28px rgba(0,0,0,.35); }
.map-legend .nb-title { font-weight: 650; font-size: 14px; margin-bottom: 6px; }
.map-legend table { width: auto; }
.map-legend th { padding: 2px 10px 2px 0; border: 0; text-align: center; }
.map-legend td { padding: 2px 0; border: 0; color: var(--muted); }
.map-legend svg { display: block; }
/* not enough room beside the drawing: the legend takes its own column, on a phone it goes below the map */
#topo-map, #zmap { container-type: inline-size; }
@container (max-width: 1300px) {
  .map-wrap { display: flex; align-items: flex-start; gap: 12px; }
  .map-wrap svg { flex: 1; min-width: 0; }
  .map-legend { position: static; flex: none; box-shadow: none; }
}
@container (max-width: 640px) { .map-wrap { display: block; } .map-legend { display: inline-block; margin-top: 8px; } }
.topo text { font: 11px system-ui, sans-serif; fill: var(--muted); }
.topo .topo-link { stroke-width: 2.5; stroke-opacity: .7; }
.tmap.focus .topo-link { stroke-opacity: .08; }
.tmap.focus .topo-link.hi { stroke-opacity: 1; stroke-width: 3.5; }
.topo .topo-link.ok { stroke: var(--ok); } .topo .topo-link.warn { stroke: var(--warn); } .topo .topo-link.bad { stroke: var(--bad); }
.topo .topo-node circle { fill: var(--panel-2); stroke: var(--accent); stroke-width: 2; }
.topo .topo-node.this circle { fill: var(--accent); }
.topo .topo-node.this .id { fill: var(--accent-text); }
.topo .topo-node.missing circle { stroke: var(--muted); stroke-dasharray: 3 3; }
.topo .topo-node .id { font-weight: 700; fill: var(--text); font-size: 12px; }
.topo .badge { fill: var(--warn); font-weight: 700; }
.topo .topo-child { fill: var(--muted); stroke: var(--muted); stroke-width: 1.5; }
.topo .topo-child.sleepy { fill: var(--panel); }
.spectrum { width: 100%; height: auto; display: block; }
.spectrum text { font: 11px system-ui, sans-serif; fill: var(--muted); }
.spectrum .ap { fill: var(--accent); fill-opacity: .10; stroke: var(--accent); stroke-opacity: .55; }
.spectrum .ap.strong { fill-opacity: .22; }
.spectrum .grid-line { stroke: var(--border); }
.spectrum .ch-good { fill: var(--ok); } .spectrum .ch-ok { fill: var(--warn); } .spectrum .ch-bad { fill: var(--bad); }
.spectrum .own { stroke: var(--text); stroke-width: 2; }
.reco { display: grid; gap: 10px; }
.reco > div { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
.reco b.big { font-size: 18px; }
.role-group + .role-group { margin-top: 18px; }
.role-group h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 14px; }
.role-group h4 .mdi { color: var(--accent); }
.roles { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1100px) { .roles { grid-template-columns: minmax(0, 1fr); } }
.role { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
.role.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.role h4 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 15px; }
.role h4 .mdi { color: var(--accent); }
.role p { margin: 0; color: var(--muted); flex: 1; }
.progress { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--border); }
.meter { display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.meter .progress { width: 110px; height: 7px; }
.meter .progress > span { display: block; height: 100%; background: var(--ok); }
.meter .progress > span.warn { background: var(--warn); } .meter .progress > span.bad { background: var(--bad); }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
#busy-dlg { max-width: 460px; }
#busy-dlg .progress { height: 12px; margin: 14px 0 8px; }
#busy-dlg .progress > div { transition: width .5s linear; }
#busy-dlg .progress.ind > div { width: 30%; animation: ind 1.4s ease-in-out infinite; }
@keyframes ind { from { margin-left: -30%; } to { margin-left: 100%; } }
#busy-pct { font-variant-numeric: tabular-nums; }
ol.steps { padding-left: 20px; margin: 6px 0; } ol.steps li { margin: 6px 0; }
.hidden { display: none !important; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
#toast.show { opacity: .95; }
dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text); max-width: 420px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0,0,0,.45); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <button id="menu-btn" title="Menu"></button>
    <div class="brand"><span id="brand-icon"></span>P4 Gateway <small id="hdr-host"></small></div>
    <span class="pill" id="hdr-role"><span class="dot"></span><span>…</span></span>
    <span class="pill" id="hdr-eth"><span class="dot"></span><span>Ethernet</span></span>
    <span class="pill hidden" id="hdr-peer"><span class="dot"></span><span></span></span>
    <span class="pill hidden" id="hdr-ident"></span>
    <span class="pill hidden" id="hdr-flash"><span class="dot warn"></span><span id="hdr-flash-text"></span><span class="progress"><div></div></span></span>
    <div class="spacer"></div>
    <span class="muted" id="hdr-uptime"></span>
    <span class="prefs row">
      <select id="pref-lang" title="Language / Jazyk" data-notr><option value="cs">CZ</option><option value="en">EN</option></select>
      <select id="pref-theme" title="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
    </span>
  </div>
  <div id="flash-strip"></div>
</header>
<div class="layout">
  <nav id="side"></nav>
  <div id="scrim"></div>
  <main id="main"></main>
</div>
<div id="toast"></div>
<div id="tipbox" role="tooltip"></div>
<div id="nodebox" role="tooltip"></div>
<dialog id="login">
  <form method="dialog" id="login-form">
    <h3 style="margin-top:0">Sign in</h3>
    <p class="muted">The gateway is password protected (user <code>admin</code>).</p>
    <label class="field"><span>Password</span><input type="password" id="login-pass" autocomplete="current-password"></label>
    <div class="row"><button class="btn primary" value="ok">Sign in</button></div>
  </form>
</dialog>
<dialog id="ev-dlg" style="max-width:640px">
  <form method="dialog" id="ev-form">
    <h3 style="margin-top:0" id="ev-title">Event</h3>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <label class="field"><span>ID (entity name in HA)</span><input type="text" id="ev-id" pattern="[a-z0-9_]{1,23}" required></label>
      <label class="field"><span>Name</span><input type="text" id="ev-name" maxlength="47"></label>
      <label class="field"><span>Czech name (web UI and HA attribute only)</span><input type="text" id="ev-name-cs" maxlength="47"></label>
      <label class="field"><span>Kind</span><select id="ev-kind"><option value="impulse">impulse (one event per occurrence)</option><option value="continuous">continuous (on while it lasts)</option></select></label>
      <label class="field"><span>Device class</span><select id="ev-dc"><option value="">none</option><option value="doorbell">doorbell</option></select></label>
      <label class="field"><span>Threshold <b id="ev-thr-v"></b></span><input type="range" id="ev-thr" min="0.1" max="1" step="0.05"></label>
      <label class="field"><span>Windows to start (0.48 s each)</span><input type="number" id="ev-win" min="1" max="20"></label>
      <label class="field"><span>Hold after last hit (s)</span><input type="number" id="ev-hold" min="1" max="600"></label>
      <label class="field"><span>Cooldown between events (s)</span><input type="number" id="ev-cool" min="0" max="3600"></label>
    </div>
    <p id="ev-profile" data-notr></p>
    <div id="ev-sounds"><label class="field"><span>Sounds that trigger it</span><div id="ev-classes" class="row"></div>
      <input type="text" id="ev-add" list="class-names" placeholder="add a sound (type to search)"></label>
    <label class="field"><span>Ignore while any of these is heard (e.g. Television for speech)</span><div id="ev-suppress" class="row"></div>
      <input type="text" id="ev-add-sup" list="class-names" placeholder="add a sound"></label></div>
    <datalist id="class-names"></datalist>
    <div class="row"><button class="btn primary" value="save">Save</button><button class="btn" value="cancel" formnovalidate>Cancel</button></div>
  </form>
</dialog>
<dialog id="copy-dlg" style="max-width:640px">
  <form method="dialog">
    <h3 style="margin-top:0" id="copy-title"></h3>
    <textarea id="copy-text" rows="12" readonly></textarea>
    <p class="muted" id="copy-hint"></p>
    <div class="row"><button class="btn primary" type="button" id="copy-btn">Copy</button><button class="btn" value="close">Close</button></div>
  </form>
</dialog>
<dialog id="zb-dlg">
  <form method="dialog">
    <h3 style="margin-top:0" id="zb-dlg-title"></h3>
    <p id="zb-dlg-text"></p>
    <label class="field hidden" id="zb-dlg-field"><span id="zb-dlg-label"></span><input type="text" id="zb-dlg-input"></label>
    <label class="hidden" id="zb-dlg-check"><input type="checkbox" id="zb-dlg-box"> <span id="zb-dlg-boxlabel"></span></label>
    <div class="row" style="margin-top:12px"><button class="btn primary" value="ok">OK</button><button class="btn" value="cancel" formnovalidate>Cancel</button></div>
  </form>
</dialog>
<dialog id="busy-dlg" aria-live="polite">
  <h3 style="margin-top:0" id="busy-title" data-notr></h3>
  <div class="muted" id="busy-stage" data-notr></div>
  <div class="progress" id="busy-bar"><div></div></div>
  <div class="row"><b id="busy-pct" data-notr></b><span class="spacer"></span><span class="muted" id="busy-eta" data-notr></span></div>
  <p class="muted" id="busy-note" data-notr></p>
</dialog>
<dialog id="confirm">
  <form method="dialog">
    <h3 style="margin-top:0" id="confirm-title"></h3>
    <p id="confirm-text"></p>
    <div class="row"><button class="btn primary" value="yes">Continue</button><button class="btn" value="no">Cancel</button></div>
  </form>
</dialog>
<script>
'use strict';
const $ = (sel, root = document) => root.querySelector(sel);

let lang = (navigator.language || '').toLowerCase().startsWith('cs') ? 'cs' : 'en';
try { lang = localStorage.getItem('lang') || lang; } catch (e) { /* storage blocked */ }
const original = new WeakMap();

function translateText(text) {
  const key = text.trim().replace(/\s+/g, ' ');
  if (!key) return null;
  let out = CS[key];
  if (out === undefined) {
    for (const [rx, rep] of CS_RX) {
      if (rx.test(key)) { out = key.replace(rx, rep); break; }
    }
  }
  if (out === undefined) return null;
  return text.replace(text.trim(), out);
}

function skip(el) {
  return !el || el.closest('script,style,textarea,pre,code,[data-notr]');
}

function translateTree(root) {
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    if (skip(node.parentElement)) continue;
    const base = original.has(node) && original.get(node).cs === node.nodeValue ? original.get(node).en : node.nodeValue;
    const out = lang === 'cs' ? translateText(base) : null;
    const want = out ?? base;
    if (out !== null) original.set(node, { en: base, cs: out });
    if (node.nodeValue !== want) node.nodeValue = want;
  }
  const els = root.querySelectorAll ? root.querySelectorAll('[placeholder],[title]') : [];
  for (const el of els) {
    if (skip(el)) continue;
    for (const attr of ['placeholder', 'title']) {
      if (!el.hasAttribute(attr)) continue;
      const en = el.dataset['en' + attr] ?? el.getAttribute(attr);
      el.dataset['en' + attr] = en;
      const out = lang === 'cs' ? translateText(en) : null;
      const want = out ?? en;
      if (el.getAttribute(attr) !== want) el.setAttribute(attr, want);
    }
  }
}

const i18nObserver = new MutationObserver(records => {
  for (const r of records) {
    if (r.type === 'characterData') translateTree(r.target.parentElement);
    else r.addedNodes.forEach(n => translateTree(n.nodeType === 3 ? n.parentElement : n));
  }
});

function setLang(l) {
  lang = l;
  try { localStorage.setItem('lang', l); } catch (e) { /* storage blocked */ }
  document.documentElement.lang = l;

}

function setTheme(t) {
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);

}

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (auth) headers.Authorization = 'Basic ' + auth;
  if (opts.json !== undefined) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  const res = await fetch(path, { method: opts.method || (opts.body ? 'POST' : 'GET'), headers, body: opts.body,
    signal: opts.timeout ? AbortSignal.timeout(opts.timeout) : undefined });
  if (res.status === 401) { await login(); return api(path, opts); }
  const type = res.headers.get('Content-Type') || '';
  const data = type.includes('json') ? await res.json() : await res.text();
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return opts.raw ? { data, res } : data;
}

let loginPromise = null;
function login() {
  if (loginPromise) return loginPromise;
  loginPromise = new Promise(resolve => {
    const dlg = $('#login');
    dlg.onclose = () => {
      auth = btoa('admin:' + $('#login-pass').value);
      try { sessionStorage.setItem('auth', auth); } catch (e) { /* storage blocked */ }
      loginPromise = null;
      resolve();
    };
    dlg.showModal();
  });
  return loginPromise;
}

function confirmDialog(title, text) {
  return new Promise(resolve => {
    const dlg = $('#confirm');
    $('#confirm-title').textContent = title;
    $('#confirm-text').textContent = text;
    dlg.onclose = () => resolve(dlg.returnValue === 'yes');
    dlg.returnValue = 'no';
    dlg.showModal();
  });
}

/* navigator.clipboard exists only in secure contexts (HTTPS, localhost); the gateway serves
 * plain HTTP, so fall back to selecting a textarea and execCommand('copy'). */
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back */ }
  }
  const ta = $('#copy-text');
  ta.value = text;
  ta.focus();
  ta.select();
  try { return document.execCommand('copy'); } catch (e) { return false; }
}

async function showCopy(title, text, hint) {
  $('#copy-title').textContent = title;
  $('#copy-text').value = text;
  $('#copy-hint').textContent = hint || '';
  $('#copy-dlg').showModal();
  const ok = await copyText(text);
  toast(ok ? 'Copied to the clipboard' : 'Select the text and copy it (Ctrl/Cmd+C)');
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 3500);
}

/* routes of the previous single-level tabs */
const OLD_ROUTES = { tools: 'system/diag', thread: 'thread/info', zigbee: 'zigbee/info', sound: 'sound/live', ha: 'ha/guide', system: 'system/info' };

let tab = 'overview', sub = '';
function parseRoute(route) {
  route = OLD_ROUTES[route] || route;
  const [t, s] = (route || '').split('/');
  const sec = NAV.find(n => n.id === t) || NAV[0];
  return [sec.id, sec.subs ? (sec.subs.find(x => x.id === s) || sec.subs[0]).id : ''];
}
function route() { return sub ? `${tab}/${sub}` : tab; }
function sectionActive(id) { return id === 'thread' ? isThread() : id === 'zigbee' ? isZigbee() : true; }
/* pages marked role: true open only in their role; Zigbee2MQTT over MQTT and network backups work in any role */
function pageEnabled(sec, s) {
  const p = NAV.find(n => n.id === sec)?.subs?.find(x => x.id === s);
  return !status || !p?.role || sectionActive(sec);
}
const firstPage = n => n.subs?.find(x => pageEnabled(n.id, x.id));
const needsRole = id => L(`Only with the ${id === 'thread' ? 'Thread' : 'Zigbee'} role active`, `Jen při aktivní roli ${id === 'thread' ? 'Thread' : 'Zigbee'}`);

let navRole = null;
function renderNav() {
  navRole = activeRole();
  $('#side').innerHTML = NAV.map(n => {
    const first = firstPage(n), off = status && !sectionActive(n.id) ? 'off' : '';
    const link = n.subs && !first
      ? `<a data-route="${n.id}" class="off" aria-disabled="true" title="${needsRole(n.id)}">${ic(n.icon)}<span>${n.label}</span></a>`
      : `<a href="#${n.subs ? n.id + '/' + first.id : n.id}" data-route="${n.id}" class="${n.id === tab ? (n.subs ? 'on' : 'cur') : ''} ${off}">${ic(n.icon)}<span>${n.label}</span></a>`;
    const subs = n.subs && n.id === tab ? `<div class="subs">${n.subs.map(x => pageEnabled(n.id, x.id)
      ? `<a href="#${n.id}/${x.id}" data-route="${n.id}/${x.id}" class="${x.id === sub ? 'cur' : ''}">${ic(x.icon)}<span>${x.label}</span></a>`
      : `<a data-route="${n.id}/${x.id}" class="off" aria-disabled="true" title="${needsRole(n.id)}">${ic(x.icon)}<span>${x.label}</span></a>`).join('')}</div>` : '';
    return link + subs;
  }).join('');
}

function go(r, replace) {
  [tab, sub] = parseRoute(r);
  if (location.hash.slice(1) !== route()) {
    if (replace) history.replaceState(null, '', '#' + route()); else location.hash = route();
  }
  try { localStorage.setItem('tab', route()); } catch (err) { /* storage blocked */ }
  document.body.classList.remove('menu-open');
  renderNav();
  render(true);
}
window.addEventListener('hashchange', () => { if (location.hash.slice(1) !== route()) go(location.hash.slice(1), true); });

{
  let saved = '';
  try { saved = localStorage.getItem('tab') || ''; } catch (e) { /* storage blocked */ }

}

/* tooltip box shared by all (i) icons: hover or keyboard focus shows it, a tap toggles it */
function showTip(el) {
  const t = TIPS[el.dataset.tip];
  if (!t) return;
  const box = $('#tipbox');
  box.textContent = lang === 'cs' ? t[1] : t[0];
  box.style.display = 'block';
  const r = el.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  box.style.top = (r.bottom + h + 12 < innerHeight ? r.bottom + 6 : r.top - h - 6) + 'px';
}
const hideTip = () => { $('#tipbox').style.display = 'none'; };
document.addEventListener('mouseover', e => { const el = e.target.closest('.tip'); if (el) showTip(el); });
document.addEventListener('mouseout', e => { if (e.target.closest('.tip')) hideTip(); });
document.addEventListener('focusin', e => { if (e.target.classList?.contains('tip')) showTip(e.target); });
document.addEventListener('focusout', e => { if (e.target.classList?.contains('tip')) hideTip(); });
document.addEventListener('click', e => { const el = e.target.closest('.tip'); if (el) { e.preventDefault(); e.stopPropagation(); showTip(el); } else hideTip(); }, true);
addEventListener('scroll', hideTip, true);

function ip() { return status?.eth?.ipv4 || status?.hostname + '.local'; }

function isThread() { return activeRole().startsWith('thread'); }
function isZigbee() { return activeRole().startsWith('zigbee'); }

function renderHeader() {
  if (!status) return;
  $('#hdr-host').textContent = status.hostname;
  const r = status.role, maint = r.maintenance;
  $('#hdr-role').innerHTML = `<span class="dot ${maint ? 'bad' : 'ok'}"></span><span>${esc(ROLES[r.active]?.name || 'Maintenance')}</span>`;
  const e = status.eth;
  $('#hdr-eth').innerHTML = `<span class="dot ${e.link ? 'ok' : 'bad'}"></span><span>${e.link ? (e.speed || '') + ' Mb/s' : 'link down'}</span>`;
  $('#hdr-uptime').textContent = 'up ' + fmtUptime(status.uptime_s);
  /* C6 flashing, visible on every page */
  const fl = status.c6.flash;
  $('header').classList.toggle('flashing', !!fl.busy);
  $('#hdr-flash').classList.toggle('hidden', !fl.busy);
  if (fl.busy) {
    $('#hdr-flash-text').textContent = `${L('Flashing C6', 'Flashování C6')} · ${fl.percent} %`;
    $('#hdr-flash .progress > div').style.width = fl.percent + '%';
    $('#hdr-flash').title = fl.stage;
    $('#flash-strip').style.width = fl.percent + '%';
  }
  renderBusy();
  const idl = status.identify_s || 0;
  $('#hdr-ident').classList.toggle('hidden', !idl);
  if (idl) {
    $('#hdr-ident').innerHTML = `${ic('lightbulb-on-outline')}<span>Identify · ${idl} s</span>`;
    $('#hdr-ident').title = L('The gateway was asked to identify itself', 'Brána byla požádána o identifikaci');
  }
  /* who uses the gateway: Zigbee2MQTT keeps a TCP session; Home Assistant calls the OTBR REST API
   * only now and then (start, Thread settings, dataset changes), so for Thread the last contact */
  const rs = status.role_status || {}, peer = $('#hdr-peer');
  let p = null;
  if (activeRole() === 'zigbee_coordinator') {
    p = rs.client_connected ? ['ok', 'Zigbee2MQTT', `${L('connected from', 'připojen z')} ${rs.client}`]
      : ['bad', L('no Zigbee2MQTT', 'bez Zigbee2MQTT'), L('no host connected to the TCP port', 'k TCP portu není připojen žádný hostitel')];
  } else if (activeRole() === 'thread_br') {
    const age = haAge(rs);
    if (!haFound) haDiscover().then(() => renderHeader());
    /* "Home Assistant" only when the client is the instance found over mDNS */
    const isHa = (haFound || []).some(h => h.ip === rs.rest_client);
    const name = isHa ? 'Home Assistant' : 'OTBR REST';
    p = age === null ? ['', 'Home Assistant', L('has not used the OTBR REST API yet', 'zatím nepoužil OTBR REST API')]
      : [age < 7 * 86400 ? 'ok' : 'warn', name, `OTBR REST: ${rs.rest_client} · ${age === Infinity ? '' : L('last contact ' + fmtUptime(age) + ' ago', 'naposledy před ' + fmtUptime(age))}`];
  }
  peer.classList.toggle('hidden', !p);
  if (p) {
    peer.innerHTML = `<span class="dot ${p[0]}"></span><span data-notr>${esc(p[1])}</span>`;
    peer.title = p[2];
  }
}
/* seconds since Home Assistant last called the OTBR REST API, null when never */
function haAge(rs) {
  if (rs.rest_client_age_s !== undefined) return rs.rest_client_age_s;
  if (rs.rest_client_at && status.time) return Math.max(0, status.time - rs.rest_client_at);
  return rs.rest_client ? Infinity : null;
}

  const r = status.role;

  if (!status.auth) html += `<div class="alert">No password set. Anyone on the LAN can switch roles and read the Thread network key. Set one under <b>System</b>.</div>`;
  return html;
}

    const roleCls = ['leader', 'router'].includes(role) ? 'ok' : role === 'child' ? 'warn' : 'bad';
    const typeTip = v => `${esc(v)}${tip('type:' + v)}`;
    if (sub === 'info') {
      box.innerHTML = `<div class="grid">
      <div class="card">${h3('thread', 'Thread')}${dl([

      ${br ? `<div class="card">${h3('router-network', 'Border routing')}${dl([
        ['Routing manager', pill(br.routing === 'running' ? 'ok' : 'warn', br.routing)],

        ['NAT64', pill(br.nat64 === 'active' ? 'ok' : 'warn', br.nat64)],

          <td>${n.lqi_in}</td><td>${n.age_s} s</td><td>${n.frame_error_pct.toFixed(1)} %</td></tr>`).join('') || '<tr><td colspan="8" class="muted">none</td></tr>'}
      </table></div></div>
      <div class="card wide">${h3('router-wireless', `Routers (${(t.routers || []).length})`)}<div class="table-wrap"><table>
        <tr>${['ID', 'RLOC16', 'Next hop', 'Path cost', 'LQ in / out', ['Link', 'Router link']].map(th).join('')}</tr>

async function runCli(cmd) {
  const out = $('#cli-out');
  out.textContent = '> ' + cmd + '\n…';
  try {
    const r = await api('/api/thread/cli', { json: { cmd, wait_ms: +$('#cli-wait').value || 800 } });
    out.textContent = '> ' + cmd + '\n' + (r.output || '(no output)');
  } catch (e) {
    out.textContent = '> ' + cmd + '\nerror: ' + e.message;
  }
}

  const r = learn.recording;
  $('#ln-state').innerHTML = r.active ? `${pill('warn', 'recording')} ${esc(r.kind)} ${esc(r.kind === 'sample' ? r.profile : '')}`
    : r.result ? `${pill(r.ok ? 'ok' : 'err', r.ok ? 'done' : 'error')} ${esc(r.result)} · ${learn.slots_free} / ${learn.slots_total} ${L('free slots', 'volných slotů')}`
    : `${learn.ready ? '' : pill('err', L('recognition off', 'rozpoznávání vypnuto')) + ' '}${learn.slots_free} / ${learn.slots_total} ${L('free slots', 'volných slotů')}`;

  $('#ln-bgs').innerHTML = learn.background.length ? `<div class="row">${learn.background.map(slotRow).join('')}</div>

  const events = sndCfg?.events || [];
  $('#ln-table').innerHTML = learn.profiles.length ? `<table><tr>${[['Sound', 'Learned sound ID'], ['Type', 'Learned sound type'], 'Samples', ['Samples alike', 'Samples alike'], ['Background', 'Background score'], ['Threshold', 'Suggested threshold'], ['Now', 'Learned score now']].map(th).join('')}<th></th></tr>${learn.profiles.map(p => {

}

async function learnUpload(mode) {

async function learnEvent(id) {
  const p = learn.profiles.find(x => x.id === id);
  await loadSoundConfig();
  if (sndCfg.events.some(e => e.id === id)) { toast(L('An event with this ID exists', 'Událost s tímto ID už existuje')); return; }
  const events = sndCfg.events.slice();
  events.push({ id, name: id.replace(/_/g, ' '), kind: 'impulse', enabled: true, threshold: p.threshold, windows: 1, hold_s: 3, cooldown_s: 10, classes: [], suppress: [], profile: id });
  await putEvents({ events });
  loadLearn();
}

function renderTree() {
  const tops = new Map();
  sndClasses.forEach(([i, name, top, group]) => {
    if (!tops.has(top)) tops.set(top, new Map());
    const g = tops.get(top);
    if (!g.has(group)) g.set(group, []);
    g.get(group).push([i, name]);
  });
  const row = ([i, name]) => `<label class="cls-row" data-name="${esc(name.toLowerCase())}" style="display:flex;gap:8px;align-items:center;padding:2px 0">
    <input type="checkbox" data-cls="${i}" ${sndExclude.has(i) ? '' : 'checked'}><span style="flex:1" data-notr>${esc(name)}</span>
    <span class="progress" style="width:80px;height:6px"><div id="cs-${i}"></div></span></label>`;
  let html = '';
  for (const [top, groups] of tops) {
    const n = [...groups.values()].reduce((a, v) => a + v.length, 0);
    html += `<details class="cls-top"><summary><b>${esc(top)}</b> <span class="muted">${n}</span> <button class="btn" data-cls-all="${esc(top)}">all</button> <button class="btn" data-cls-none="${esc(top)}">none</button></summary><div style="padding-left:16px">`;
    for (const [group, items] of groups) {
      html += group === '-' ? items.map(row).join('') : `<details><summary><span data-notr>${esc(group)}</span> <span class="muted">${items.length}</span></summary><div style="padding-left:16px">${items.map(row).join('')}</div></details>`;
    }
    html += '</div></details>';
  }
  $('#cls-tree').innerHTML = html;
  $('#cls-tree').dataset.built = '1';
  updateClsSummary();
}

function updateClsSummary() {

      <td>${(l.score * 100).toFixed(0)} %</td><td>${l.level_db} dB</td><td>${l.ongoing ? pill('ok', 'ongoing') : l.duration_s ? l.duration_s + ' s' : ''}</td>

  } catch (e) { /* ignore */ }

async function putEvents(cfg) {

function automationYaml(e) {
  const host = status.hostname.replace(/-/g, '_');
  const trig = e.kind === 'continuous'
    ? `  - trigger: state\n    entity_id: binary_sensor.${host}_snd_${e.id}_active\n    to: "on"\n    for: "00:00:30"`
    : `  - trigger: state\n    entity_id: event.${host}_snd_${e.id}`;
  return `alias: "Sound: ${e.name}"\ntriggers:\n${trig}\nconditions: []\nactions:\n  - action: notify.notify\n    data:\n      message: "${e.name}: {{ state_attr('event.${host}_snd_${e.id}', 'class') }}"\nmode: single\n`;
}
async function loadSound() {
  if (tab !== 'sound') { clearInterval(soundTimer); soundTimer = null; return; }
  if (!$('#snd-en')) return;
  let st;
  try { st = await api('/api/sound/status'); } catch (e) { return; }
  if (!$('#snd-en')) return; /* the page changed while the request ran */
  const set = (id, fn) => { const el = $('#' + id); if (el && document.activeElement !== el) fn(el); };
  set('snd-en', el => { el.checked = st.enabled; });
  set('snd-ai', el => { el.checked = st.inference.enabled; });
  set('snd-gain', el => { el.value = st.gain_db; });
  set('snd-gate', el => { el.value = st.gate_db; });
  $('#snd-gain-v').textContent = $('#snd-gain').value;
  $('#snd-gate-v').textContent = $('#snd-gate').value;
  $('#snd-run').innerHTML = st.running ? pill('ok', 'capturing') : st.error ? pill('bad', st.error) : pill('', st.enabled ? 'restart to start' : 'off');
  if (st.running) {
    $('#snd-meter').style.width = Math.max(0, Math.min(100, (st.level_db + 90) / 90 * 100)) + '%';
    $('#snd-levels').textContent = `level ${st.level_db} dBFS, peak ${st.peak_db}, noise floor ${st.floor_db}, ${st.read_errors} read errors`;
  }
  const m = st.model, inf = st.inference;
  $('#snd-model').innerHTML = dl([
    ['Model', m.stored_bytes ? `${fmtBytes(m.stored_bytes)} stored, ${m.loaded ? pill('ok', 'loaded') : pill('warn', 'not loaded')}` : pill('bad', 'none, upload yamnet_p4.espdl')],
    ['Load time', m.load_ms ? m.load_ms + ' ms' : ''], ['Error', esc(m.error)],
    ['Inference', inf.runs ? `${inf.avg_ms} ms avg, ${inf.max_ms} ms max, last ${inf.last_ms} ms` : ''],
    ['CPU (core 1)', inf.runs ? inf.cpu_pct + ' %' : ''],
    ['Runs / skipped quiet', `${inf.runs} / ${inf.skipped_quiet}`]]);
  $('#snd-top').innerHTML = inf.top ? `<table>${inf.top.map(t => `<tr><td data-notr>${heardName(t)}</td><td style="width:50%"><div class="progress"><div style="width:${t.score * 100}%"></div></div></td><td>${(t.score * 100).toFixed(0)} %</td></tr>`).join('')}</table>
    <p class="muted">${inf.top_age_s.toFixed(0)} s ago</p>` : 'Recognition is off or nothing above the gate yet.';
}

async function soundConfig(body) {

document.addEventListener('change', e => {
  const id = e.target.id;
  if (e.target.dataset.cls !== undefined) {
    const i = +e.target.dataset.cls;
    if (e.target.checked) sndExclude.delete(i); else sndExclude.add(i);
    sndDirty = true; updateClsSummary(); return;
  }
  if (e.target.dataset.evToggle !== undefined) {
    const events = sndCfg.events.slice();
    events[+e.target.dataset.evToggle].enabled = e.target.checked;
    putEvents({ events }).catch(err => toast('Error: ' + err.message));

/* Signal layout: distances between nodes follow the link quality (a stronger link is a shorter
 * edge); nodes without a direct link end up as far apart as the best path between them. Stress
 * majorization over the weighted shortest paths, started from the ring so the result is stable. */
function signalLayout(ids, links, ring, W, H, margin) {
  const n = ids.length, ix = new Map(ids.map((id, i) => [id, i]));
  if (n < 3) return ring;
  const D = ids.map((_, i) => ids.map((__, j) => i === j ? 0 : Infinity));
  for (const { a, b, d } of links) {
    const i = ix.get(a), j = ix.get(b);
    if (i !== undefined && j !== undefined && i !== j && d < D[i][j]) D[i][j] = D[j][i] = d;
  }
  for (let k = 0; k < n; k++) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (D[i][k] + D[k][j] < D[i][j]) D[i][j] = D[i][k] + D[k][j];
  const far = Math.max(1, ...D.flat().filter(Number.isFinite)) * 1.3;
  D.forEach(row => row.forEach((v, j) => { if (!Number.isFinite(v)) row[j] = far; }));
  const rx = Math.max(1, ...ids.map(id => Math.abs(ring.get(id).x - W / 2)));
  let X = ids.map(id => [(ring.get(id).x - W / 2) / rx * far / 2, (ring.get(id).y - H / 2) / rx * far / 2]);
  for (let it = 0; it < 300; it++) {
    X = X.map((p, i) => {
      let sx = 0, sy = 0, sw = 0;
      for (let j = 0; j < n; j++) {
        if (i === j) continue;
        const w = 1 / (D[i][j] * D[i][j]), dx = p[0] - X[j][0], dy = p[1] - X[j][1], dist = Math.hypot(dx, dy) || 1e-6;

        sw += w;
      }
      return [sx / sw, sy / sw];

  const xs = X.map(p => p[0]), ys = X.map(p => p[1]);
  const x0 = Math.min(...xs), y0 = Math.min(...ys), k = Math.min((W - 2 * margin) / (Math.max(...xs) - x0 || 1), (H - 2 * margin) / (Math.max(...ys) - y0 || 1));

  return new Map(ids.map((id, i) => {
    const x = ox + k * (X[i][0] - x0), y = oy + k * (X[i][1] - y0);
    return [id, { x, y, a: Math.atan2(y - H / 2, x - W / 2) }];
  }));
}

  <button class="btn" data-mz="out" title="${L('Zoom out', 'Oddálit')}">${ic('minus')}</button>
  <button class="btn" data-mz="home" title="${L('Default view', 'Výchozí zobrazení')}">${ic('home-outline')}</button>
  <button class="btn ${mapLayout === 'signal' ? 'primary' : ''}" data-mz="layout" title="${L('Layout by signal strength (L)', 'Rozložení podle síly signálu (L)')}">${ic('vector-polyline')}</button></div>`;
const mapHelp = () => mapLayout === 'signal'
  ? L('Layout by signal: a stronger link draws the nodes closer (L switches back to the ring). Wheel or +/− zoom, drag moves.', 'Rozložení podle signálu: silnější linka = uzly blíž u sebe (L přepne zpět na kruh). Kolečko nebo +/− přibližuje, tažení posouvá.')
  : L('L arranges the nodes by signal strength. Wheel or +/− zoom, drag moves.', 'L rozmístí uzly podle síly signálu. Kolečko nebo +/− přibližuje, tažení posouvá.');
function setView(svg, vb) {
  svg.setAttribute('viewBox', vb.map(v => +v.toFixed(2)).join(' '));
  mapView[svg.classList.contains('tmap') ? 'tmap' : 'zmap'] = vb;
}
/* zoom by factor f (< 1 closer) around the map point px, py */
function zoomMap(svg, f, px, py) {
  const [bx, by, bw] = svg.dataset.base.split(' ').map(Number), [x, y, w, h] = svg.getAttribute('viewBox').split(' ').map(Number);
  const nf = Math.min(Math.max(f, bw / 8 / w), bw / w);
  if (nf === 1) return;
  if (w * nf >= bw - 0.01) return setView(svg, svg.dataset.base.split(' ').map(Number));
  setView(svg, [px - (px - x) * nf, py - (py - y) * nf, w * nf, h * nf]);
}
function mapPoint(svg, cx, cy) {
  const m = svg.getScreenCTM().inverse();
  return [m.a * cx + m.c * cy + m.e, m.b * cx + m.d * cy + m.f];
}
function initMapView(svg, key) {
  svg.dataset.base = svg.getAttribute('viewBox');
  if (mapView[key]) svg.setAttribute('viewBox', mapView[key].join(' '));
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    zoomMap(svg, e.deltaY < 0 ? 1 / 1.2 : 1.2, ...mapPoint(svg, e.clientX, e.clientY));
  }, { passive: false });
  let drag = null;
  svg.addEventListener('pointerdown', e => { if (e.button === 0) drag = { x: e.clientX, y: e.clientY, vb: svg.getAttribute('viewBox').split(' ').map(Number), moved: false }; });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    if (!drag.moved) { drag.moved = true; svg.setPointerCapture(e.pointerId); svg.classList.add('panning'); }
    const k = 1 / svg.getScreenCTM().a;
    setView(svg, [drag.vb[0] - dx * k, drag.vb[1] - dy * k, drag.vb[2], drag.vb[3]]);
  });
  const end = () => { drag = null; svg.classList.remove('panning'); };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
}
function toggleMapLayout() {
  mapLayout = mapLayout === 'signal' ? 'ring' : 'signal';
  try { localStorage.setItem('mapLayout', mapLayout); } catch (err) { /* storage blocked */ }
  delete mapView.tmap;
  delete mapView.zmap;
  $('#nodebox').style.display = 'none';
  if ($('#topo-map svg')) drawTopology();
  if ($('#zmap svg') && zmapLast) renderZMap(...zmapLast);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-mz]');
  if (!b) return;
  const svg = b.closest('.map-wrap').querySelector('svg.topo');
  const [x, y, w, h] = svg.getAttribute('viewBox').split(' ').map(Number);
  if (b.dataset.mz === 'layout') toggleMapLayout();
  else if (b.dataset.mz === 'home') setView(svg, svg.dataset.base.split(' ').map(Number));
  else zoomMap(svg, b.dataset.mz === 'in' ? 1 / 1.4 : 1.4, x + w / 2, y + h / 2);
});
document.addEventListener('keydown', e => {
  if (e.key.toLowerCase() !== 'l' || e.ctrlKey || e.metaKey || e.altKey || e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  if ($('svg.tmap, svg.zmap')) { e.preventDefault(); toggleMapLayout(); }
});

const lgDot = (r, fill, stroke, dash) => `<svg width="26" height="22"><circle cx="13" cy="11" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2"${dash ? ' stroke-dasharray="3 3"' : ''}/></svg>`;
const mapLegend = rows => `<div class="map-legend"><div class="nb-title">${L('Legend', 'Legenda')}</div><table>${rows.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table></div>`;

async function loadTopology() {
  const box = $('#topo-map');
  if (!box) return;
  $('#topo-state').textContent = L(' discovering…', ' zjišťuji…');
  $('#topo-refresh').disabled = true;
  let d;
  const matterPromise = matterLoad();
  try { d = await api('/api/thread/topology'); } catch (e) {
    if ($('#topo-map')) { $('#topo-map').innerHTML = `<span class="warn-text">${esc(e.message)}</span>`; $('#topo-refresh').disabled = false; $('#topo-state').textContent = ''; }
    return;
  }
  if (!$('#topo-map')) return;
  $('#topo-refresh').disabled = false;
  const routers = new Map(d.routers.map(r => [r.id, r]));
  d.routers.forEach(r => r.links.forEach(l => { if (!routers.has(l.id)) routers.set(l.id, { id: l.id, links: [], children: [], missing: true }); }));
  const ids = [...routers.keys()].sort((a, b) => a - b);
  const kids = d.routers.reduce((a, r) => a + r.children.length, 0);
  const matter = await matterPromise;
  if (!$('#topo-map')) return;
  const index = matter?.nodes || null;
  topoInfo = new Map();
  let matched = 0;
  const roleText = (r) => [r.leader ? 'leader' : 'router', r.br ? 'border router' : ''].filter(Boolean).join(' · ');
  for (const r of routers.values()) {
    const m = r.missing ? null : matterMatch(index, r);
    matched += m ? 1 : 0;
    const name = r.this ? L('this gateway', 'tato brána') : m ? (m.label || m.product || '') : r.missing ? L('no answer', 'bez odpovědi') : [r.vendor, r.model].filter(x => x && x !== 'RD:' && x !== 'Default').join(' ');
    topoInfo.set('r' + r.id, { ...r, matter: m, role: r.missing ? L('router (did not answer)', 'router (neodpověděl)') : roleText(r),
      links: r.links.length ? `${r.links.length} ${L('routers', 'routerů')}, ${r.children.length} ${L('end devices', 'koncových zařízení')}` : '',
      vendor: r.vendor === 'RD:' ? '' : r.vendor, model: r.model === 'Default' ? '' : r.model, sw: r.sw === 'Default' ? '' : r.sw, name, fallback: 'R' + r.id });
    r.children.forEach(c => {
      const cm = matterMatch(index, c);
      matched += cm ? 1 : 0;
      topoInfo.set('c' + c.rloc16, { ...c, matter: cm, name: cm ? (cm.label || cm.product || '') : '', fallback: c.rloc16, parent: r.id,
        role: (c.rx_on ? L('end device, always on', 'koncové zařízení, stále zapnuté') : L('sleepy end device (battery)', 'spící koncové zařízení (baterie)')) + ` · ${L('parent', 'rodič')} R${r.id}`,
        links: `${L('link quality to the parent', 'kvalita linky k rodiči')} ${c.lq}` });
    });
  }
  $('#matter-state').innerHTML = !matter ? L('not set and no Home Assistant found: names only from Thread diagnostics', 'nenastaveno a Home Assistant nenalezen: názvy jen z diagnostiky Thread')
    : `<code>${esc(matter.url)}</code>${matter.auto ? ' ' + L('(found automatically)', '(nalezeno automaticky)') : ''} · ` +
      (matter.error ? `<span class="warn-text">${esc(matter.error)}</span>` : `${matter.nodes.length} ${L('Matter nodes', 'uzlů Matter')}, ${matched} ${L('found in the map', 'nalezeno v mapě')}`);
  $('#topo-state').textContent = ` ${ids.length} ${L('routers', 'routerů')}, ${kids} ${L('end devices', 'koncových zařízení')} · ${d.ms} ms` +
    (d.error ? ` · ${L('some routers did not answer', 'některé routery neodpověděly')}` : '');
  topoLast = { routers, ids };
  drawTopology();
}

/* draws the Thread map from the last answer: ring or, toggled with L, the signal layout */
function drawTopology() {
  const box = $('#topo-map');
  if (!box || !topoLast) return;
  const { routers, ids } = topoLast;
  const W = 900, H = 640, cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 110;
  let pos = new Map(ids.map((id, i) => {
    const a = -Math.PI / 2 + 2 * Math.PI * i / ids.length;
    return [id, { x: ids.length > 1 ? cx + R * Math.cos(a) : cx, y: ids.length > 1 ? cy + R * Math.sin(a) : cy, a }];
  }));
  if (mapLayout === 'signal') {
    /* LQ 3 is the shortest edge; the weaker of both directions counts */
    const links = [];
    for (const r of routers.values()) for (const l of r.links) {
      const back = routers.get(l.id)?.links.find(x => x.id === r.id);
      links.push({ a: r.id, b: l.id, d: 1 + 0.8 * (3 - Math.min(l.lq, back ? back.lq : l.lq)) });
    }
    pos = signalLayout(ids, links, pos, W, H, 110);
  }
  const lqCls = q => q >= 3 ? 'ok' : q === 2 ? 'warn' : 'bad';
  let edges = '', nodes = '', children = '';
  const seen = new Set();
  for (const r of routers.values()) for (const l of r.links) {
    const key = [Math.min(r.id, l.id), Math.max(r.id, l.id)].join('-');
    if (seen.has(key) || !pos.has(l.id)) continue;
    seen.add(key);
    const back = routers.get(l.id).links.find(x => x.id === r.id);
    const q = back ? Math.min(back.lq, l.lq) : l.lq;
    const p1 = pos.get(r.id), p2 = pos.get(l.id);
    edges += `<line class="topo-link ${lqCls(q)}" data-a="r${r.id}" data-b="r${l.id}" ${back ? '' : 'stroke-dasharray="5 5"'} x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}"><title>R${r.id} ↔ R${l.id}: ${L('link quality', 'kvalita linky')} ${back ? `${l.lq} / ${back.lq}` : l.lq}</title></line>`;
  }
  for (const r of routers.values()) {
    const p = pos.get(r.id);
    r.children.forEach((c, i) => {
      const spread = 0.22, a = p.a + (i - (r.children.length - 1) / 2) * spread, dist = ids.length > 1 ? 58 : 70 + 12 * i;
      const x = p.x + dist * Math.cos(a), y = p.y + dist * Math.sin(a);
      children += `<line class="topo-link ${lqCls(c.lq)}" data-a="r${r.id}" data-b="c${c.rloc16}" x1="${p.x}" y1="${p.y}" x2="${x}" y2="${y}"/>
        <circle class="topo-child ${c.rx_on ? '' : 'sleepy'}" cx="${x}" cy="${y}" r="7" data-node="c${c.rloc16}" tabindex="0"/>
        ${topoInfo.get('c' + c.rloc16).name ? `<text x="${x + (Math.cos(a) >= 0 ? 10 : -10)}" y="${y + 4}" text-anchor="${Math.cos(a) >= 0 ? 'start' : 'end'}">${esc(topoInfo.get('c' + c.rloc16).name.slice(0, 20))}</text>` : ''}`;
    });
    const label = topoInfo.get('r' + r.id).name.slice(0, 22);
    nodes += `<g class="topo-node ${r.this ? 'this' : ''} ${r.missing ? 'missing' : ''}" data-node="r${r.id}" tabindex="0"><circle cx="${p.x}" cy="${p.y}" r="18"/>
      <text x="${p.x}" y="${p.y + 4}" text-anchor="middle" class="id">${r.id}</text>
      ${r.leader ? `<text x="${p.x + 15}" y="${p.y - 13}" class="badge">★</text>` : ''}${r.br ? `<text x="${p.x - 26}" y="${p.y - 13}" class="badge">BR</text>` : ''}
      <text x="${p.x}" y="${p.y + 34}" text-anchor="middle">${esc(label)}</text></g>`;
  }
  box.classList.remove('muted');
  box.innerHTML = `<div class="map-wrap"><svg class="topo tmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Thread network map">${edges}${children}${nodes}</svg>${mapTools()}
    ${mapLegend([[lgLine('ok'), L('good link (LQ 3)', 'dobrá linka (LQ 3)')], [lgLine('warn'), L('medium link (LQ 2)', 'střední linka (LQ 2)')],
      [lgLine('bad'), L('weak link (LQ 0–1)', 'slabá linka (LQ 0–1)')], [lgLine('muted', true), L('reported by one side only', 'hlásí jen jedna strana')],
      [lgDot(8, 'var(--panel-2)', 'var(--accent)'), L('router, number = router ID', 'router, číslo = ID routeru')], [lgDot(8, 'var(--accent)', 'var(--accent)'), L('this gateway', 'tato brána')],
      ['<span class="warn-text"><b>★</b></span>', 'leader'], ['<span class="warn-text"><b>BR</b></span>', 'border router'],
      [lgDot(5, 'var(--muted)', 'var(--muted)'), L('end device', 'koncové zařízení')], [lgDot(5, 'var(--panel)', 'var(--muted)'), L('sleepy end device', 'spící koncové zařízení')]])}</div>
    <p class="muted">${L('Hover a device for details and its links.', 'Najetím na zařízení zobrazíte detaily a zvýrazníte jeho linky.')} ${mapHelp()}</p>`;
  initMapView(box.querySelector('svg'), 'tmap');
  const devs = [...topoInfo.entries()];
  $('#topo-devices').innerHTML = `<table><tr>${['Device', 'Vendor', 'Product', 'Device type', ['Thread role', 'Device Thread role'], 'RLOC16', 'Matter node', ['Firmware', 'Device firmware']].map(th).join('')}</tr>${devs.map(([key, v]) => `<tr>
    <td data-notr><b>${esc(v.name || v.fallback)}</b></td><td data-notr>${esc(v.matter?.vendor || v.vendor || '')}</td><td data-notr>${esc(v.matter?.product || v.model || '')}</td>
    <td>${esc(v.matter?.types.join(', ') || '')}</td><td>${esc(v.role)}</td><td>${esc(v.rloc16 || '')}</td><td>${v.matter ? v.matter.node : ''}</td><td data-notr>${esc(v.matter?.sw || v.sw || '')}</td></tr>`).join('')}</table>`;
}

/* ---------------- Zigbee network (through Zigbee2MQTT) ----------------
 * The gateway relays what Zigbee2MQTT publishes on the MQTT broker: instances, devices with their
 * state, the network map on request, and operations answered by Zigbee2MQTT. */
views['zigbee/network'] = () => `<div class="grid">
  <div class="card">${h3('zigbee', 'Zigbee2MQTT')}<div id="z2m-info" class="muted">Loading…</div></div>
  <div class="card">${h3('lan-pending', 'Permit join')}<div id="z2m-join" class="muted">Loading…</div></div>
  <div class="card wide">${h3('graph-outline', 'Network map')}
    <div class="row"><button class="btn" id="zmap-refresh">${ic('restart')}Request a new map</button>${tip('Zigbee map')}<span id="zmap-state" class="muted"></span></div>
    <div id="zmap" class="muted" style="margin-top:10px">Loading…</div></div>
  <div class="card wide">${h3('lan-connect', 'Zigbee devices')}
    <div class="row"><input type="text" id="zdev-filter" placeholder="filter" style="flex:1;max-width:320px"><span id="zdev-count" class="muted"></span></div>
    <div class="table-wrap" id="zdev"></div></div>
</div>`;

let z2m = null, zInfo = new Map(), zmapLast = null;
const zLqiCls = q => q >= 120 ? 'ok' : q >= 60 ? 'warn' : 'bad';
function zAgo(v, now) {
  if (v === undefined || v === null) return '';
  const t = typeof v === 'number' ? v / 1000 : Date.parse(v) / 1000;
  if (!t || !now) return '';
  return L(fmtUptime(Math.max(0, now - t)) + ' ago', 'před ' + fmtUptime(Math.max(0, now - t)));
}
function zDevice(d, st, own) {
  const s = st[d.name] || st[d.ieee] || {};
  return { ...d, lqi: s.lqi, last_seen: s.last_seen, availability: s.availability, battery: s.battery, update: s.update, own: d.ieee === own };
}
const zPower = p => !p ? '' : /^Mains/.test(p) ? L('mains', 'síť') : p === 'Battery' ? L('battery', 'baterie') : p === 'DC Source' ? 'DC' : p;
/* this gateway in the Zigbee network: our router (router role) or the coordinator Zigbee2MQTT reaches over TCP here */
function zOwnIeee(d) {
  const rs = status.role_status || {};
  if (activeRole() === 'zigbee_router' && rs.router?.ieee) return '0x' + rs.router.ieee;
  const inst = d?.instances.find(i => i.base === d.base);
  return inst?.this_gateway ? inst.coordinator_ieee : null;
}
function zTypeText(t) { return t === 'Coordinator' ? L('coordinator', 'koordinátor') : t === 'Router' ? 'router' : L('end device', 'koncové zařízení'); }

async function loadZigbeeNet(full) {
  if (route() !== 'zigbee/network') return;
  let d;
  try { d = await api('/api/zigbee/net'); } catch (e) { return; }
  if (!$('#z2m-info')) return;
  z2m = d;
  const inst = d.instances.find(i => i.base === d.base);
  $('#z2m-info').classList.remove('muted');
  $('#z2m-info').innerHTML = !d.mqtt ? `<span class="warn-text">${L('MQTT is not connected: set it up under Home Assistant › MQTT.', 'MQTT není připojené: nastavte ho v Home Assistant › MQTT.')}</span>`
    : !inst ? L('No Zigbee2MQTT found on the MQTT broker.', 'Na MQTT brokeru nenalezen žádný Zigbee2MQTT.')
    : (d.instances.length > 1 ? `<label class="field"><span>${L('Instance', 'Instance')}</span><select id="z2m-base">${d.instances.map(i => `<option ${i.base === d.base ? 'selected' : ''}>${esc(i.base)}</option>`).join('')}</select></label>` : '') +
      dl([['Base topic', `<code>${esc(inst.base)}</code>`, 'Z2M base topic'], ['Version', esc(inst.version)],
        ['Coordinator', `${esc(inst.coordinator || '')} <span class="muted">${esc(inst.coordinator_fw || '')}</span>${inst.this_gateway ? ' ' + pill('ok', L('this gateway', 'tato brána')) : ''}`, 'Z2M coordinator'],
        ['Adapter', `<code>${esc(inst.serial || '')}</code>`, 'Z2M adapter'], ['Channel', inst.channel], ['PAN ID', inst.pan_id !== undefined ? '0x' + inst.pan_id.toString(16).padStart(4, '0') : ''],
        ['Ext PAN ID', esc(inst.epid || '')], ['Devices', d.devices.length, 'Z2M devices']]);
  const end = inst?.permit_join_end ? inst.permit_join_end / 1000 : inst?.permit_join_timeout ? d.now + inst.permit_join_timeout : 0;
  const left = inst?.permit_join && end && d.now ? Math.max(0, Math.round(end - d.now)) : 0;
  $('#z2m-join').classList.remove('muted');
  $('#z2m-join').innerHTML = !inst ? '' : `<div>${inst.permit_join ? pill('warn', L('open', 'otevřeno') + (left ? ` · ${left} s` : '')) : pill('', L('closed', 'zavřeno'))}</div>
    <div class="row" style="margin-top:10px"><select id="zjoin-via"><option value="">${L('whole network', 'celá síť')}</option>${d.devices.filter(x => x.type === 'Router').sort((a, b) => a.name.localeCompare(b.name)).map(x => `<option value="${esc(x.name)}">${L('via', 'přes')} ${esc(x.name)}</option>`).join('')}</select>
      <button class="btn primary" id="zjoin-open">${ic('lan-pending')}${L('Permit join 254 s', 'Povolit připojení 254 s')}</button>
      <button class="btn" id="zjoin-close" ${inst.permit_join ? '' : 'disabled'}>${ic('close')}${L('Close', 'Zavřít')}</button></div>
    <p class="muted">${L('New devices pair through Zigbee2MQTT; they show up in the table below.', 'Nová zařízení se párují přes Zigbee2MQTT; objeví se v tabulce níže.')}</p>`;
  const st = d.states || {};
  const own = zOwnIeee(d);
  const devs = d.devices.map(x => zDevice(x, st, own));
  zInfo = new Map(devs.map(x => [x.ieee, x]));
  renderZDevices(devs, d.now);
  $('#zmap-state').textContent = d.map_running ? L(' Zigbee2MQTT is collecting the map, this can take several minutes…', ' Zigbee2MQTT sestavuje mapu, může to trvat i několik minut…')
    : d.map_error ? ' ' + d.map_error : d.map ? ` ${L('map from', 'mapa z')} ${d.map.at ? new Date(d.map.at * 1000).toLocaleString(lang === 'cs' ? 'cs-CZ' : 'en-GB') : '?'}` : '';
  $('#zmap-refresh').disabled = d.map_running || !inst;
  if (d.map && (full || $('#zmap').dataset.at !== String(d.map.at))) renderZMap(d.map, devs);
  else if (!d.map) $('#zmap').innerHTML = L('No map yet: request one (Zigbee2MQTT asks every router for its neighbours).', 'Zatím bez mapy: vyžádejte ji (Zigbee2MQTT se zeptá každého routeru na sousedy).');
  clearTimeout(loadZigbeeNet.timer);
  loadZigbeeNet.timer = setTimeout(() => loadZigbeeNet(false), d.map_running ? 5000 : 15000);
}

function renderZDevices(devs, now) {
  const q = ($('#zdev-filter')?.value || '').toLowerCase();
  const order = { Coordinator: 0, Router: 1, EndDevice: 2 };
  const list = devs.filter(x => !q || [x.name, x.vendor, x.model, x.description, x.ieee].join(' ').toLowerCase().includes(q))
    .sort((a, b) => (order[a.type] ?? 3) - (order[b.type] ?? 3) || a.name.localeCompare(b.name));

/* Coordinator in the middle, routers on a ring, end devices next to their parent. Links between
 * routers in the colour of their LQI; hovering a device highlights its own links. */
function renderZMap(map, devs) {
  const box = $('#zmap');
  zmapLast = [map, devs];
  box.dataset.at = String(map.at);
  const byIeee = new Map(devs.map(x => [x.ieee, x]));
  const nodes = map.nodes.map(n => ({ ...n, dev: byIeee.get(n.ieee) }));
  const coord = nodes.find(n => n.type === 'Coordinator');
  const routers = nodes.filter(n => n.type === 'Router').sort((a, b) => a.name.localeCompare(b.name));
  const ends = nodes.filter(n => n.type === 'EndDevice');
  const W = 1000, H = 760, cx = W / 2, cy = H / 2, R = 270;
  const pos = new Map();
  if (coord) pos.set(coord.ieee, { x: cx, y: cy, a: 0 });
  routers.forEach((n, i) => { const a = -Math.PI / 2 + 2 * Math.PI * i / Math.max(1, routers.length); pos.set(n.ieee, { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a }); });
  /* parent of an end device: the link where it is the child (relationship 1) */
  const parent = new Map();
  map.links.forEach(l => { if (l.rel === 1 && !parent.has(l.s)) parent.set(l.s, l.t); });
  const perParent = new Map();
  ends.forEach(n => { const p = parent.get(n.ieee) || coord?.ieee; perParent.set(p, (perParent.get(p) || []).concat(n)); });
  if (mapLayout === 'signal') {
    /* coordinator and routers by their LQI (255 is the shortest edge); end devices stay next to their parent */
    const ids = [...pos.keys()];
    const links = map.links.filter(l => l.s !== l.t && pos.has(l.s) && pos.has(l.t)).map(l => ({ a: l.s, b: l.t, d: 1 + 3 * (255 - (l.lqi || 0)) / 255 }));
    for (const [id, p] of signalLayout(ids, links, pos, W, H, 90)) pos.set(id, p);
  }
  for (const [p, list] of perParent) {
    const pp = pos.get(p) || { x: cx, y: cy, a: 0 };
    const base = p === coord?.ieee ? Math.PI / 2 : pp.a;
    list.forEach((n, i) => {
      const a = base + (i - (list.length - 1) / 2) * 0.16, d = p === coord?.ieee ? 90 + 14 * (i % 3) : 62 + 14 * (i % 2);
      pos.set(n.ieee, { x: pp.x + d * Math.cos(a), y: pp.y + d * Math.sin(a), a });
    });
  }
  const pairs = new Map();
  map.links.forEach(l => {
    if (!pos.has(l.s) || !pos.has(l.t) || l.s === l.t) return;
    const key = [l.s, l.t].sort().join('|');
    const isChild = l.rel === 1 || l.rel === 0;
    const e = pairs.get(key) || { a: l.s, b: l.t, lqi: 0, child: false };
    e.lqi = Math.max(e.lqi, l.lqi || 0);
    e.child = e.child || isChild;
    pairs.set(key, e);
  });
  let edges = '', dots = '';
  for (const e of pairs.values()) {
    const p1 = pos.get(e.a), p2 = pos.get(e.b);
    edges += `<line class="zl ${zLqiCls(e.lqi)} ${e.child ? 'child' : ''}" data-a="${e.a}" data-b="${e.b}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}"/>`;
  }
  for (const n of nodes) {
    const p = pos.get(n.ieee);
    if (!p) continue;
    const off = n.dev?.availability === 'offline' || n.failed;
    const label = n.dev?.own ? L('this gateway', 'tato brána') : (n.dev?.name || n.name || '').slice(0, 14);
    if (n.type === 'EndDevice') {
      dots += `<g class="zn end ${off ? 'off' : ''}" data-znode="${n.ieee}" tabindex="0"><circle cx="${p.x}" cy="${p.y}" r="6"/></g>`;
    } else {
      const r = n.type === 'Coordinator' ? 20 : 12;
      const right = Math.cos(p.a) >= 0;
      dots += `<g class="zn ${n.type === 'Coordinator' ? 'coord' : 'router'} ${off ? 'off' : ''} ${n.dev?.own ? 'own' : ''}" data-znode="${n.ieee}" tabindex="0"><circle cx="${p.x}" cy="${p.y}" r="${r}"/>
        <text x="${n.type === 'Coordinator' ? p.x : p.x + (right ? 16 : -16)}" y="${n.type === 'Coordinator' ? p.y + 36 : p.y + 4}" text-anchor="${n.type === 'Coordinator' ? 'middle' : right ? 'start' : 'end'}">${esc(label)}</text></g>`;
    }
  }
  const failed = nodes.filter(n => n.failed).length;
  box.classList.remove('muted');
  box.innerHTML = `<div class="map-wrap"><svg class="topo zmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Zigbee network map">${edges}${dots}</svg>${mapTools()}
    ${mapLegend([[lgLine('ok'), 'LQI ≥ 120'], [lgLine('warn'), 'LQI 60–119'], [lgLine('bad'), 'LQI < 60'],
      [lgDot(10, 'var(--accent)', 'var(--accent)'), L('coordinator', 'koordinátor')], [lgDot(7, 'var(--accent)', 'var(--accent)'), L('this gateway', 'tato brána')], [lgDot(7, 'var(--panel-2)', 'var(--accent)'), mapLayout === 'signal' ? 'router' : L('router (on the ring)', 'router (na kruhu)')],
      [lgDot(4, 'var(--muted)', 'var(--muted)'), L('end device, next to its parent', 'koncové zařízení, u svého rodiče')], [lgDot(7, 'var(--panel)', 'var(--accent)', true), L('offline or did not answer', 'nedostupné nebo neodpovědělo')]])}</div>
    <p class="muted">${L(`${nodes.length} devices, ${pairs.size} links${failed ? `, ${failed} routers did not answer` : ''}. Hover a device for details and its links.`,
      `${nodes.length} zařízení, ${pairs.size} linek${failed ? `, ${failed} routerů neodpovědělo` : ''}. Najetím na zařízení zobrazíte detaily a zvýrazníte jeho linky.`)} ${mapHelp()}</p>`;
  initMapView(box.querySelector('svg'), 'zmap');
}

async function zRequest(body) {

/* ---------------- network surroundings ----------------
 * The gateway stores the raw scan (quick: OpenThread scans of the Thread role; full: C6 scanner image
 * with Wi-Fi). The rating is computed here so it can be refined without new firmware. */
const L = (en, cs) => lang === 'cs' ? cs : en;
const f154 = ch => 2405 + 5 * (ch - 11);
const fWifi = ch => ch === 14 ? 2484 : 2407 + 5 * ch;
const dbmSum = list => list.length ? 10 * Math.log10(list.reduce((a, v) => a + 10 ** (v / 10), 0)) : null;
function apSpan(ap) {
  const wide = ap.ch2 === 'above' || ap.ch2 === 'below';
  const center = fWifi(ap.ch) + (ap.ch2 === 'above' ? 10 : ap.ch2 === 'below' ? -10 : 0);
  return [center - (wide ? 20 : 10), center + (wide ? 20 : 10)];
}
const apOverlaps = (ap, ch) => { const [a, b] = apSpan(ap); return f154(ch) + 1 > a && f154(ch) - 1 < b; };

function nsNetworks(last) {
  const nets = new Map();
  const add = (x, type) => {
    const key = x.ch + '/' + x.pan;
    const n = nets.get(key) || { ch: x.ch, pan: x.pan, type: 'unknown', devices: new Set(), rssi: -128, frames: 0 };
    const rank = { zigbee: 3, thread: 3, other: 2, no_payload: 1, unknown: 0 };
    if ((rank[type] ?? 0) > (rank[n.type] ?? 0)) n.type = type;
    if (x.name) n.name = x.name;
    if (x.epid) n.epid = x.epid;
    if (x.permit !== undefined) n.permit = n.permit || x.permit;
    if (x.joinable !== undefined) n.permit = n.permit || x.joinable;
    if (x.src) n.devices.add(x.src);
    if (x.frames) n.frames += x.frames;
    n.rssi = Math.max(n.rssi, x.rssi ?? -128);
    nets.set(key, n);
  };
  (last.beacons || []).forEach(x => add(x, x.type));
  (last.thread || []).forEach(x => add(x, 'thread'));
  (last.pans || []).forEach(x => add(x, 'unknown'));
  /* a PAN that answers beacon requests without payload and is not Zigbee: Thread 1.2+ */
  for (const n of nets.values()) if (n.type === 'no_payload') n.type = 'thread';
  return [...nets.values()].sort((a, b) => a.ch - b.ch || b.rssi - a.rssi);
}

/* Own networks of this gateway (Thread role) and of the Zigbee host are marked by channel and PAN. */
function nsOwn(nets) {
  const rs = status.role_status || {};
  if (!isThread() || !rs.channel) return;
  /* the full scan sees the own network often only as a PAN in traffic: on the role's channel that is it */
  nets.filter(n => n.ch === rs.channel && n.type !== 'zigbee').forEach(n => {
    n.own = true;
    n.type = 'thread';
    n.name = n.name || rs.network_name;
  });
}

function nsChannels(last, nets) {
  const wifi = last.wifi || [];
  return Array.from({ length: 16 }, (_, i) => {
    const ch = 11 + i, c = (last.channels || []).find(x => x.ch === ch) || {};
    const aps = wifi.filter(ap => apOverlaps(ap, ch));
    const wifiDbm = dbmSum(aps.map(ap => ap.rssi));
    const here = nets.filter(n => n.ch === ch);
    const noise = c.ed_max ?? null;
    let penalty = 0;
    if (wifiDbm !== null) penalty += Math.min(40, Math.max(0, wifiDbm + 90));
    if (noise !== null) penalty += 0.7 * Math.min(30, Math.max(0, noise + 92));
    penalty += here.reduce((a, n) => a + (n.rssi > -80 ? 15 : 8), 0);
    const score = Math.round(Math.max(0, 100 - penalty));
    return { ch, mhz: f154(ch), noise, noiseAvg: c.ed_avg, frames: c.frames, aps, wifiDbm, nets: here, score,
      rating: score >= 75 ? 'good' : score >= 50 ? 'ok' : 'bad' };
  });
}

const RATING = { good: ['ok', 'good', 'dobrý'], ok: ['warn', 'usable', 'použitelný'], bad: ['bad', 'poor', 'špatný'] };
const ratingPill = r => pill(RATING[r][0], L(RATING[r][1], RATING[r][2]));

function nsSpectrum(chs, last) {
  const W = 860, H = 230, x = f => 40 + (f - 2400) / 85 * (W - 60), y = rssi => 150 - (Math.min(-30, Math.max(-100, rssi)) + 100) / 70 * 130;
  let svg = `<svg class="spectrum" viewBox="0 0 ${W} ${H}" role="img" aria-label="2.4 GHz spectrum">`;
  for (const db of [-40, -60, -80, -100]) svg += `<line class="grid-line" x1="40" x2="${W - 20}" y1="${y(db)}" y2="${y(db)}"/><text x="4" y="${y(db) + 4}">${db}</text>`;
  const aps = [...(last.wifi || [])].sort((a, b) => a.rssi - b.rssi);
  for (const ap of aps) {
    const [a, b] = apSpan(ap), top = y(ap.rssi);
    svg += `<path class="ap ${ap.rssi > -65 ? 'strong' : ''}" d="M${x(a)},150 C${x(a + 4)},${top} ${x(b - 4)},${top} ${x(b)},150 Z"><title>${esc(ap.ssid || L('hidden', 'skrytá'))} · ch ${ap.ch} · ${ap.rssi} dBm</title></path>`;
  }
  /* one label per Wi-Fi channel: its SSIDs, strongest first */
  const byCh = new Map();
  for (const ap of [...aps].reverse()) {
    if (!ap.ssid || ap.rssi < -80) continue;
    const e = byCh.get(ap.ch) || { rssi: ap.rssi, names: [] };
    if (!e.names.includes(ap.ssid)) e.names.push(ap.ssid);
    byCh.set(ap.ch, e);
  }
  for (const [ch, e] of byCh) {
    const text = e.names.slice(0, 3).join(', ') + (e.names.length > 3 ? ' +' + (e.names.length - 3) : '');
    svg += `<text x="${x(fWifi(ch))}" y="${y(e.rssi) - 5}" text-anchor="middle" style="fill:var(--text)">${esc(text)}</text>`;
  }
  for (const c of chs) {
    const cx = x(c.mhz);
    svg += `<rect class="ch-${c.rating} ${c.nets.some(n => n.own) ? 'own' : ''}" x="${cx - 9}" y="160" width="18" height="26" rx="4"><title>${L('channel', 'kanál')} ${c.ch}: ${c.score}/100</title></rect>
      <text x="${cx}" y="205" text-anchor="middle">${c.ch}</text>`;
  }
  for (const w of [1, 6, 11, 13]) svg += `<text x="${x(fWifi(w))}" y="225" text-anchor="middle">Wi-Fi ${w}</text>`;
  return svg + '</svg>';
}

function nsRecommend(chs, nets, last) {
  const best = list => [...list].sort((a, b) => b.score - a.score || b.ch - a.ch);
  const thread = best(chs.filter(c => c.ch <= 25)).slice(0, 3);
  const zigbee = best(chs.filter(c => [11, 15, 20, 25].includes(c.ch)))[0];
  const own = nets.filter(n => n.own || n.type === 'zigbee');
  const wifi = last.wifi || [];
  let wifiReco = '';
  if (wifi.length) {
    const ownCh = own.map(n => n.ch);
    const cands = [1, 6, 11, 13].map(w => {
      const ap = { ch: w, ch2: 'none' };
      const near = wifi.filter(x => Math.abs(fWifi(x.ch) - fWifi(w)) < 20);
      const clash = ownCh.filter(ch => apOverlaps(ap, ch));
      return { w, load: dbmSum(near.map(x => x.rssi)) ?? -100, count: near.length, clash };
    }).sort((a, b) => (a.clash.length - b.clash.length) || (a.load - b.load));
    const c = cands[0];
    wifiReco = `<div><div class="muted">${L('Wi-Fi channel', 'Kanál Wi-Fi')}</div><b class="big">${c.w}</b>
      <div>${L(`${c.count} networks nearby`, `${c.count} sítí v okolí`)}${c.clash.length ? '' : L(', does not overlap your 802.15.4 networks', ', nepřekrývá vaše sítě 802.15.4')}</div></div>`;
  }
  const chList = list => list.map(c => `${c.ch} <span class="muted">(${c.score})</span>`).join(', ');
  const ownRows = own.map(n => {
    const c = chs.find(x => x.ch === n.ch);
    const clash = c.aps.filter(a => a.rssi > -75).map(a => a.ssid).filter(Boolean);
    return `<div><b>${n.type === 'zigbee' ? 'Zigbee' : 'Thread'} ${esc(n.name || n.pan)}</b> · ${L('channel', 'kanál')} ${n.ch} ${ratingPill(c.rating)}
      <div class="muted">${clash.length ? L(`overlaps strong Wi-Fi: ${[...new Set(clash)].slice(0, 3).map(esc).join(', ')}`, `překrývá silnou Wi-Fi: ${[...new Set(clash)].slice(0, 3).map(esc).join(', ')}`) : L('no strong Wi-Fi overlap', 'bez překryvu se silnou Wi-Fi')}</div></div>`;
  }).join('');
  return `<div class="reco">
    <div><div class="muted">${L('New Thread network', 'Nová Thread síť')}</div><b class="big">${thread[0].ch}</b><div>${L('also', 'také')} ${chList(thread.slice(1))}</div></div>
    <div><div class="muted">${L('New Zigbee network (11/15/20/25)', 'Nová Zigbee síť (11/15/20/25)')}</div><b class="big">${zigbee.ch}</b> <span class="muted">(${zigbee.score})</span></div>
    ${wifiReco}${ownRows}</div>`;
}
