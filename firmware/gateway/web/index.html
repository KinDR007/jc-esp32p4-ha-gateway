    <td>${x.availability === 'offline' ? pill('bad', L('offline', 'nedostupné')) : x.availability === 'online' ? pill('ok', 'online') : ''}${x.update === 'available' ? ' ' + pill('warn', L('update', 'aktualizace')) : ''}${x.interview && x.interview !== 'SUCCESSFUL' ? ' ' + pill('warn', x.interview.toLowerCase()) : ''}</td>
    <td class="zact">${x.type === 'Coordinator' ? '' : `<button class="btn" data-zact="identify" data-zdev="${esc(x.name)}" title="Identify">${ic('lightbulb-on-outline')}</button>
      ${x.own && activeRole() === 'zigbee_router' ? `<button class="btn" data-zact="txpower" data-zdev="${esc(x.name)}" title="${L('Transmit power', 'Vysílací výkon')}">${ic('signal')}</button>` : ''}
      <button class="btn" data-zact="rename" data-zdev="${esc(x.name)}" title="${L('Rename', 'Přejmenovat')}">${ic('pencil-outline')}</button>
      <button class="btn" data-zact="interview" data-zdev="${esc(x.name)}" title="${L('Interview again', 'Znovu načíst zařízení')}">${ic('restart')}</button>
      ${x.ota ? `<button class="btn" data-zact="${x.update === 'available' ? 'ota_update' : 'ota_check'}" data-zdev="${esc(x.name)}" title="${x.update === 'available' ? L('Install the update', 'Nainstalovat aktualizaci') : L('Check for an update', 'Zkontrolovat aktualizaci')}">${ic('download')}</button>` : ''}
      <button class="btn danger" data-zact="remove" data-zdev="${esc(x.name)}" title="${L('Remove', 'Odebrat')}">${ic('delete-outline')}</button>`}</td></tr>`).join('')}</table>`;
}

/* Coordinator in the middle, routers on a ring, end devices next to their parent. Links between
 * routers in the colour of their LQI; hovering a device highlights its own links. */
function renderZMap(map, devs) {
  const box = $('#zmap');
  zmapLast = [map, devs];
  box.dataset.at = String(map.at);
  const byIeee = new Map(devs.map(x => [x.ieee, x]));
  const nodes = map.nodes.map(n => ({ ...n, dev: byIeee.get(n.ieee) }));
  const coord = nodes.find(n => n.type === 'Coordinator');
  const routers = nodes.filter(n => n.type === 'Router').sort((a, b) => a.name.localeCompare(b.name));
  const ends = nodes.filter(n => n.type === 'EndDevice');
  const W = 1000, H = 760, cx = W / 2, cy = H / 2, R = 270;
  const pos = new Map();
  if (coord) pos.set(coord.ieee, { x: cx, y: cy, a: 0 });
  routers.forEach((n, i) => { const a = -Math.PI / 2 + 2 * Math.PI * i / Math.max(1, routers.length); pos.set(n.ieee, { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a }); });
  /* parent of an end device: the link where it is the child (relationship 1) */
  const parent = new Map();
  map.links.forEach(l => { if (l.rel === 1 && !parent.has(l.s)) parent.set(l.s, l.t); });
  const perParent = new Map();
  ends.forEach(n => { const p = parent.get(n.ieee) || coord?.ieee; perParent.set(p, (perParent.get(p) || []).concat(n)); });
  if (mapLayout === 'signal') {
    /* coordinator and routers by their LQI (255 is the shortest edge); end devices stay next to their parent */
    const ids = [...pos.keys()];
    const links = map.links.filter(l => l.s !== l.t && pos.has(l.s) && pos.has(l.t)).map(l => ({ a: l.s, b: l.t, d: 1 + 3 * (255 - (l.lqi || 0)) / 255 }));
    for (const [id, p] of signalLayout(ids, links, pos, W, H, 90)) pos.set(id, p);
  }
  for (const [p, list] of perParent) {
    const pp = pos.get(p) || { x: cx, y: cy, a: 0 };
    const base = p === coord?.ieee ? Math.PI / 2 : pp.a;
    list.forEach((n, i) => {
      const a = base + (i - (list.length - 1) / 2) * 0.16, d = p === coord?.ieee ? 90 + 14 * (i % 3) : 62 + 14 * (i % 2);
      pos.set(n.ieee, { x: pp.x + d * Math.cos(a), y: pp.y + d * Math.sin(a), a });
    });
  }
  const pairs = new Map();
  map.links.forEach(l => {
    if (!pos.has(l.s) || !pos.has(l.t) || l.s === l.t) return;
    const key = [l.s, l.t].sort().join('|');
    const isChild = l.rel === 1 || l.rel === 0;
    const e = pairs.get(key) || { a: l.s, b: l.t, lqi: 0, child: false };
    e.lqi = Math.max(e.lqi, l.lqi || 0);
    e.child = e.child || isChild;
    pairs.set(key, e);
  });
  let edges = '', dots = '';
  for (const e of pairs.values()) {
    const p1 = pos.get(e.a), p2 = pos.get(e.b);
    edges += `<line class="zl ${zLqiCls(e.lqi)} ${e.child ? 'child' : ''}" data-a="${e.a}" data-b="${e.b}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}"/>`;
  }
  for (const n of nodes) {
    const p = pos.get(n.ieee);
    if (!p) continue;
    const off = n.dev?.availability === 'offline' || n.failed;
    const label = n.dev?.own ? L('this gateway', 'tato brána') : (n.dev?.name || n.name || '').slice(0, 14);
    if (n.type === 'EndDevice') {
      dots += `<g class="zn end ${off ? 'off' : ''}" data-znode="${n.ieee}" tabindex="0"><circle cx="${p.x}" cy="${p.y}" r="6"/></g>`;
    } else {
      const r = n.type === 'Coordinator' ? 20 : 12;
      const right = Math.cos(p.a) >= 0;
      dots += `<g class="zn ${n.type === 'Coordinator' ? 'coord' : 'router'} ${off ? 'off' : ''} ${n.dev?.own ? 'own' : ''}" data-znode="${n.ieee}" tabindex="0"><circle cx="${p.x}" cy="${p.y}" r="${r}"/>
        <text x="${n.type === 'Coordinator' ? p.x : p.x + (right ? 16 : -16)}" y="${n.type === 'Coordinator' ? p.y + 36 : p.y + 4}" text-anchor="${n.type === 'Coordinator' ? 'middle' : right ? 'start' : 'end'}">${esc(label)}</text></g>`;
    }
  }
  const failed = nodes.filter(n => n.failed).length;
  box.classList.remove('muted');
  box.innerHTML = `<div class="map-wrap"><svg class="topo zmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Zigbee network map">${edges}${dots}</svg>${mapTools()}
    ${mapLegend([[lgLine('ok'), 'LQI ≥ 120'], [lgLine('warn'), 'LQI 60–119'], [lgLine('bad'), 'LQI < 60'],
      [lgDot(10, 'var(--accent)', 'var(--accent)'), L('coordinator', 'koordinátor')], [lgDot(7, 'var(--accent)', 'var(--accent)'), L('this gateway', 'tato brána')], [lgDot(7, 'var(--panel-2)', 'var(--accent)'), mapLayout === 'signal' ? 'router' : L('router (on the ring)', 'router (na kruhu)')],
      [lgDot(4, 'var(--muted)', 'var(--muted)'), L('end device, next to its parent', 'koncové zařízení, u svého rodiče')], [lgDot(7, 'var(--panel)', 'var(--accent)', true), L('offline or did not answer', 'nedostupné nebo neodpovědělo')]])}</div>
    <p class="muted">${L(`${nodes.length} devices, ${pairs.size} links${failed ? `, ${failed} routers did not answer` : ''}. Hover a device for details and its links.`,
      `${nodes.length} zařízení, ${pairs.size} linek${failed ? `, ${failed} routerů neodpovědělo` : ''}. Najetím na zařízení zobrazíte detaily a zvýrazníte jeho linky.`)} ${mapHelp()}</p>`;
  initMapView(box.querySelector('svg'), 'zmap');
}

/* details box of a Zigbee device (map or table) */
function zBox(ieee) {
  const x = zInfo.get(ieee);
  if (!x) return '';
  const rows = [];
  const add = (k, v) => { if (v !== undefined && v !== null && v !== '') rows.push(`<tr><th>${k}</th><td>${v}</td></tr>`); };
  add(L('Vendor', 'Výrobce'), esc(x.vendor || x.manufacturer || ''));
  add(L('Model', 'Model'), esc([x.model, x.model_id && x.model_id !== x.model ? `(${x.model_id})` : ''].filter(Boolean).join(' ')));
  add(L('Description', 'Popis'), esc(x.description || ''));
  add(L('Type', 'Typ'), esc(zTypeText(x.type)));
  add(L('Gateway', 'Brána'), x.own ? L('this gateway', 'tato brána') : '');
  add(L('Transmit power', 'Vysílací výkon'), x.own && status.role_status?.router?.tx_power !== undefined ? status.role_status.router.tx_power + ' dBm'
    : x.tx_power !== undefined ? x.tx_power + ' dBm' : '');
  add(L('Power', 'Napájení'), esc((x.power || '') + (x.battery !== undefined ? ` · ${x.battery} %` : '')));
  add('LQI', x.lqi !== undefined ? `<span class="${zLqiCls(x.lqi)}-text">${x.lqi}</span>` : '');
  add(L('Last seen', 'Naposledy viděno'), zAgo(x.last_seen, z2m?.now));
  add(L('State', 'Stav'), esc(x.availability || ''));
  add('IEEE', `<code>${esc(x.ieee)}</code>`);
  add(L('Network address', 'Síťová adresa'), x.nwk !== undefined ? '0x' + x.nwk.toString(16).padStart(4, '0') : '');
  add(L('Firmware', 'Firmware'), esc([x.sw, x.date_code].filter(Boolean).join(' · ')));
  add(L('Interview', 'Načtení zařízení'), esc(x.interview || ''));
  add('OTA', x.ota ? (x.update === 'available' ? L('update available', 'k dispozici aktualizace') : L('supported', 'podporováno')) : '');
  return `<div class="nb-title">${esc(x.name)}</div><table>${rows.join('')}</table>`;
}
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-znode]');
  if (!el) return;
  const box = $('#nodebox');
  box.innerHTML = zBox(el.dataset.znode);
  if (!box.innerHTML) return;
  box.style.display = 'block';
  mapFocus(el, el.dataset.znode);
  placeNodeBox(el, e.clientX, e.clientY);
});
document.addEventListener('mouseout', e => {
  const el = e.target.closest('[data-znode]');
  if (!el) return;
  $('#nodebox').style.display = 'none';
  el.closest('svg.zmap')?.classList.remove('focus');
});

/* small form dialog: resolves with {input, check} or null */
function zDialog(title, text, input, check) {
  return new Promise(resolve => {
    const dlg = $('#zb-dlg');
    $('#zb-dlg-title').textContent = title;
    $('#zb-dlg-text').textContent = text;
    $('#zb-dlg-field').classList.toggle('hidden', input === undefined);
    $('#zb-dlg-input').value = input || '';
    $('#zb-dlg-check').classList.toggle('hidden', !check);
    $('#zb-dlg-box').checked = false;
    $('#zb-dlg-boxlabel').textContent = check || '';
    dlg.returnValue = 'cancel';
    dlg.onclose = () => resolve(dlg.returnValue === 'ok' ? { input: $('#zb-dlg-input').value.trim(), check: $('#zb-dlg-box').checked } : null);
    dlg.showModal();
  });
}
async function zRequest(body) {
  const r = await api('/api/zigbee/net/request', { json: body });
  if (r.status === 'error') throw new Error(r.error || 'Zigbee2MQTT error');
  return r;
}

/* ---------------- network surroundings ----------------
 * The gateway stores the raw scan (quick: OpenThread scans of the Thread role; full: C6 scanner image
 * with Wi-Fi). The rating is computed here so it can be refined without new firmware. */
const L = (en, cs) => lang === 'cs' ? cs : en;
const f154 = ch => 2405 + 5 * (ch - 11);
const fWifi = ch => ch === 14 ? 2484 : 2407 + 5 * ch;
const dbmSum = list => list.length ? 10 * Math.log10(list.reduce((a, v) => a + 10 ** (v / 10), 0)) : null;
function apSpan(ap) {
  const wide = ap.ch2 === 'above' || ap.ch2 === 'below';
  const center = fWifi(ap.ch) + (ap.ch2 === 'above' ? 10 : ap.ch2 === 'below' ? -10 : 0);
  return [center - (wide ? 20 : 10), center + (wide ? 20 : 10)];
}
const apOverlaps = (ap, ch) => { const [a, b] = apSpan(ap); return f154(ch) + 1 > a && f154(ch) - 1 < b; };

function nsNetworks(last) {
  const nets = new Map();
  const add = (x, type) => {
    const key = x.ch + '/' + x.pan;
    const n = nets.get(key) || { ch: x.ch, pan: x.pan, type: 'unknown', devices: new Set(), rssi: -128, frames: 0 };
    const rank = { zigbee: 3, thread: 3, other: 2, no_payload: 1, unknown: 0 };
    if ((rank[type] ?? 0) > (rank[n.type] ?? 0)) n.type = type;
    if (x.name) n.name = x.name;
    if (x.epid) n.epid = x.epid;
    if (x.permit !== undefined) n.permit = n.permit || x.permit;
    if (x.joinable !== undefined) n.permit = n.permit || x.joinable;
    if (x.src) n.devices.add(x.src);
    if (x.frames) n.frames += x.frames;
    n.rssi = Math.max(n.rssi, x.rssi ?? -128);
    nets.set(key, n);
  };
  (last.beacons || []).forEach(x => add(x, x.type));
  (last.thread || []).forEach(x => add(x, 'thread'));
  (last.pans || []).forEach(x => add(x, 'unknown'));
  /* a PAN that answers beacon requests without payload and is not Zigbee: Thread 1.2+ */
  for (const n of nets.values()) if (n.type === 'no_payload') n.type = 'thread';
  return [...nets.values()].sort((a, b) => a.ch - b.ch || b.rssi - a.rssi);
}

/* Own networks of this gateway (Thread role) and of the Zigbee host are marked by channel and PAN. */
function nsOwn(nets) {
  const rs = status.role_status || {};
  if (!isThread() || !rs.channel) return;
  /* the full scan sees the own network often only as a PAN in traffic: on the role's channel that is it */
  nets.filter(n => n.ch === rs.channel && n.type !== 'zigbee').forEach(n => {
    n.own = true;
    n.type = 'thread';
    n.name = n.name || rs.network_name;
  });
}

function nsChannels(last, nets) {
  const wifi = last.wifi || [];
  return Array.from({ length: 16 }, (_, i) => {
    const ch = 11 + i, c = (last.channels || []).find(x => x.ch === ch) || {};
    const aps = wifi.filter(ap => apOverlaps(ap, ch));
    const wifiDbm = dbmSum(aps.map(ap => ap.rssi));
    const here = nets.filter(n => n.ch === ch);
    const noise = c.ed_max ?? null;
    let penalty = 0;
    if (wifiDbm !== null) penalty += Math.min(40, Math.max(0, wifiDbm + 90));
    if (noise !== null) penalty += 0.7 * Math.min(30, Math.max(0, noise + 92));
    penalty += here.reduce((a, n) => a + (n.rssi > -80 ? 15 : 8), 0);
    const score = Math.round(Math.max(0, 100 - penalty));
    return { ch, mhz: f154(ch), noise, noiseAvg: c.ed_avg, frames: c.frames, aps, wifiDbm, nets: here, score,
      rating: score >= 75 ? 'good' : score >= 50 ? 'ok' : 'bad' };
  });
}

const RATING = { good: ['ok', 'good', 'dobrý'], ok: ['warn', 'usable', 'použitelný'], bad: ['bad', 'poor', 'špatný'] };
const ratingPill = r => pill(RATING[r][0], L(RATING[r][1], RATING[r][2]));

function nsSpectrum(chs, last) {
  const W = 860, H = 230, x = f => 40 + (f - 2400) / 85 * (W - 60), y = rssi => 150 - (Math.min(-30, Math.max(-100, rssi)) + 100) / 70 * 130;
  let svg = `<svg class="spectrum" viewBox="0 0 ${W} ${H}" role="img" aria-label="2.4 GHz spectrum">`;
  for (const db of [-40, -60, -80, -100]) svg += `<line class="grid-line" x1="40" x2="${W - 20}" y1="${y(db)}" y2="${y(db)}"/><text x="4" y="${y(db) + 4}">${db}</text>`;
  const aps = [...(last.wifi || [])].sort((a, b) => a.rssi - b.rssi);
  for (const ap of aps) {
    const [a, b] = apSpan(ap), top = y(ap.rssi);
    svg += `<path class="ap ${ap.rssi > -65 ? 'strong' : ''}" d="M${x(a)},150 C${x(a + 4)},${top} ${x(b - 4)},${top} ${x(b)},150 Z"><title>${esc(ap.ssid || L('hidden', 'skrytá'))} · ch ${ap.ch} · ${ap.rssi} dBm</title></path>`;
  }
  /* one label per Wi-Fi channel: its SSIDs, strongest first */
  const byCh = new Map();
  for (const ap of [...aps].reverse()) {
    if (!ap.ssid || ap.rssi < -80) continue;
    const e = byCh.get(ap.ch) || { rssi: ap.rssi, names: [] };
    if (!e.names.includes(ap.ssid)) e.names.push(ap.ssid);
    byCh.set(ap.ch, e);
  }
  for (const [ch, e] of byCh) {
    const text = e.names.slice(0, 3).join(', ') + (e.names.length > 3 ? ' +' + (e.names.length - 3) : '');
    svg += `<text x="${x(fWifi(ch))}" y="${y(e.rssi) - 5}" text-anchor="middle" style="fill:var(--text)">${esc(text)}</text>`;
  }
  for (const c of chs) {
    const cx = x(c.mhz);
    svg += `<rect class="ch-${c.rating} ${c.nets.some(n => n.own) ? 'own' : ''}" x="${cx - 9}" y="160" width="18" height="26" rx="4"><title>${L('channel', 'kanál')} ${c.ch}: ${c.score}/100</title></rect>
      <text x="${cx}" y="205" text-anchor="middle">${c.ch}</text>`;
  }
  for (const w of [1, 6, 11, 13]) svg += `<text x="${x(fWifi(w))}" y="225" text-anchor="middle">Wi-Fi ${w}</text>`;
  return svg + '</svg>';
}

function nsRecommend(chs, nets, last) {
  const best = list => [...list].sort((a, b) => b.score - a.score || b.ch - a.ch);
  const thread = best(chs.filter(c => c.ch <= 25)).slice(0, 3);
  const zigbee = best(chs.filter(c => [11, 15, 20, 25].includes(c.ch)))[0];
  const own = nets.filter(n => n.own || n.type === 'zigbee');
  const wifi = last.wifi || [];
  let wifiReco = '';
  if (wifi.length) {
    const ownCh = own.map(n => n.ch);
    const cands = [1, 6, 11, 13].map(w => {
      const ap = { ch: w, ch2: 'none' };
      const near = wifi.filter(x => Math.abs(fWifi(x.ch) - fWifi(w)) < 20);
      const clash = ownCh.filter(ch => apOverlaps(ap, ch));
      return { w, load: dbmSum(near.map(x => x.rssi)) ?? -100, count: near.length, clash };
    }).sort((a, b) => (a.clash.length - b.clash.length) || (a.load - b.load));
    const c = cands[0];
    wifiReco = `<div><div class="muted">${L('Wi-Fi channel', 'Kanál Wi-Fi')}</div><b class="big">${c.w}</b>
      <div>${L(`${c.count} networks nearby`, `${c.count} sítí v okolí`)}${c.clash.length ? '' : L(', does not overlap your 802.15.4 networks', ', nepřekrývá vaše sítě 802.15.4')}</div></div>`;
  }
  const chList = list => list.map(c => `${c.ch} <span class="muted">(${c.score})</span>`).join(', ');
  const ownRows = own.map(n => {
    const c = chs.find(x => x.ch === n.ch);
    const clash = c.aps.filter(a => a.rssi > -75).map(a => a.ssid).filter(Boolean);
    return `<div><b>${n.type === 'zigbee' ? 'Zigbee' : 'Thread'} ${esc(n.name || n.pan)}</b> · ${L('channel', 'kanál')} ${n.ch} ${ratingPill(c.rating)}
      <div class="muted">${clash.length ? L(`overlaps strong Wi-Fi: ${[...new Set(clash)].slice(0, 3).map(esc).join(', ')}`, `překrývá silnou Wi-Fi: ${[...new Set(clash)].slice(0, 3).map(esc).join(', ')}`) : L('no strong Wi-Fi overlap', 'bez překryvu se silnou Wi-Fi')}</div></div>`;
  }).join('');
  return `<div class="reco">
    <div><div class="muted">${L('New Thread network', 'Nová Thread síť')}</div><b class="big">${thread[0].ch}</b><div>${L('also', 'také')} ${chList(thread.slice(1))}</div></div>
    <div><div class="muted">${L('New Zigbee network (11/15/20/25)', 'Nová Zigbee síť (11/15/20/25)')}</div><b class="big">${zigbee.ch}</b> <span class="muted">(${zigbee.score})</span></div>
    ${wifiReco}${ownRows}</div>`;
}

let nsTimer = null;
async function loadNetscan() {
  if (route() !== 'system/netscan') { clearInterval(nsTimer); nsTimer = null; return; }
  let d;
  try { d = await api('/api/net/scan'); } catch (e) { return; }
  if (!$('#ns-state')) return;
  const busy = d.state !== 'idle';
  $('#ns-quick').disabled = busy || !d.quick_available;
  $('#ns-full').disabled = busy;
  const last = d.last;
  const when = last && last.at ? new Date(last.at * 1000).toLocaleString(lang === 'cs' ? 'cs-CZ' : 'en-GB') : '';
  $('#ns-state').innerHTML = busy ? pill('warn', L('scanning…', 'skenuji…'))
    : last ? `${L('Last scan', 'Poslední sken')}: ${esc(when)} · ${last.mode === 'full' ? L('full', 'úplný') : L('quick', 'rychlý')} · ${(last.duration_ms / 1000).toFixed(0)} s${(last.errors || []).map(e => `<div class="warn-text">${esc(e)}</div>`).join('')}`
    : L('No scan yet.', 'Zatím bez skenu.');
  if (busy && !nsTimer) nsTimer = setInterval(loadNetscan, 2000);
  if (!busy && nsTimer) { clearInterval(nsTimer); nsTimer = null; }
  if (!last || $('#ns-state').dataset.at === String(last.at) + last.mode + last.duration_ms) return;
  $('#ns-state').dataset.at = String(last.at) + last.mode + last.duration_ms;
  const nets = nsNetworks(last);
  nsOwn(nets);
  const chs = nsChannels(last, nets);
  $('#ns-reco').classList.remove('muted');
  $('#ns-reco').innerHTML = nsRecommend(chs, nets, last);
  $('#ns-spectrum').classList.remove('muted');
  $('#ns-spectrum').innerHTML = last.wifi ? nsSpectrum(chs, last) + `<p class="muted">${L('Wi-Fi networks as arcs (height = signal), 802.15.4 channels below coloured by rating, your networks outlined.', 'Wi-Fi sítě jako oblouky (výška = signál), pod nimi kanály 802.15.4 barevně podle hodnocení, vaše sítě orámované.')}</p>`
    : nsSpectrum(chs, last) + `<p class="muted">${L('Quick scan: no Wi-Fi data, run a full scan for it.', 'Rychlý sken: bez Wi-Fi, pro ni spusťte úplný sken.')}</p>`;
  $('#ns-channels').innerHTML = `<table><tr>${['Channel', 'MHz', 'Noise', 'Wi-Fi overlap', 'Networks', 'Score'].map(th).join('')}</tr>${chs.map(c => `<tr>
    <td><b>${c.ch}</b></td><td>${c.mhz}</td>

/* traffic: counters since boot from the gateway, rates from the difference of two samples taken
 * every 2 s while the page is open */
let trafficTimer = null, trafficPrev = null, trafficRates = null, trafficHist = [];
const TRAFFIC_HIST = 150;
const fmtRate = b => { const v = b * 8; return v >= 1e6 ? (v / 1e6).toFixed(2) + ' Mb/s' : v >= 1e3 ? (v / 1e3).toFixed(1) + ' kb/s' : Math.round(v) + ' b/s'; };
async function loadTraffic() {
  if (route() !== 'system/lan') { clearInterval(trafficTimer); trafficTimer = null; return; }
  let t;
  try { t = await api('/api/net/traffic'); } catch (e) { return; }
  if (trafficPrev && t.uptime_ms > trafficPrev.uptime_ms) {
    const dt = (t.uptime_ms - trafficPrev.uptime_ms) / 1000, d = (a, b) => Math.max(0, (a - b) / dt);
    trafficRates = { rx: d(t.rx, trafficPrev.rx), tx: d(t.tx, trafficPrev.tx), svc: {} };
    for (const k in t.services) trafficRates.svc[k] = { rx: d(t.services[k].rx, trafficPrev.services[k].rx), tx: d(t.services[k].tx, trafficPrev.services[k].tx) };
    trafficHist.push([trafficRates.rx, trafficRates.tx]);
    if (trafficHist.length > TRAFFIC_HIST) trafficHist.shift();
  } else if (trafficPrev) {
    trafficHist = []; /* the gateway restarted */
  }
  trafficPrev = t;
  renderTraffic(t);
  renderLanState();
}
function spark(hist) {
  const W = 600, H = 120, max = Math.max(1250, ...hist.flat()) * 1.1;
  const path = i => hist.map((h, j) => `${j ? 'L' : 'M'}${(W * (j + TRAFFIC_HIST - hist.length) / (TRAFFIC_HIST - 1)).toFixed(1)},${(H - H * h[i] / max).toFixed(1)}`).join('');
  return { max: max / 1.1, svg: `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="RX/TX">
    ${[0.25, 0.5, 0.75].map(f => `<line class="grid-l" x1="0" x2="${W}" y1="${H * f}" y2="${H * f}"/>`).join('')}
    ${hist.length > 1 ? `<path class="rx" d="${path(0)}"/><path class="tx" d="${path(1)}"/>` : ''}</svg>` };
}
function renderTraffic(t) {
  const box = $('#traffic-box');
  if (!box) return;
  const r = trafficRates, sp = spark(trafficHist);
  const NAMES = { web: [L('Web UI, API, HA integration', 'Web UI, API, integrace HA'), '80'], otbr_rest: ['OTBR REST', '8081'],
    zigbee: ['Zigbee2MQTT (TCP)', '6638'], mqtt: ['MQTT', '1883, 8883'], mdns: ['mDNS', '5353'], dns_ntp: ['DNS, NTP', '53, 123'],
    https: [L('HTTPS (updates, internet test)', 'HTTPS (aktualizace, test internetu)'), '443'],
    thread: [L('Thread, routed by the border router', 'Thread, směrováno border routerem'), 'IPv6'], other: [L('Other (ARP, ICMP, …)', 'Ostatní (ARP, ICMP, …)'), ''] };
  const svcs = Object.entries(t.services).sort((a, b) => (b[1].rx + b[1].tx) - (a[1].rx + a[1].tx));
  box.classList.remove('muted');
  box.innerHTML = `<div class="row" style="gap:32px">
      <div><div class="muted">RX ↓</div><div class="rate ok-text">${r ? fmtRate(r.rx) : '…'}</div></div>
      <div><div class="muted">TX ↑</div><div class="rate" style="color:var(--accent)">${r ? fmtRate(r.tx) : '…'}</div></div>
      <div><div class="muted">${L('Received since start', 'Přijato od startu')}</div><div class="rate">${fmtBytes(t.rx)} <small>${t.rx_packets} ${L('packets', 'paketů')}</small></div></div>
      <div><div class="muted">${L('Sent since start', 'Odesláno od startu')}</div><div class="rate">${fmtBytes(t.tx)} <small>${t.tx_packets} ${L('packets', 'paketů')}</small></div></div></div>
    <div style="margin-top:12px">${sp.svg}</div>
    <div class="muted" style="font-size:12px;margin:4px 0 14px">${L('Last 5 minutes while this page is open, sampled every 2 s; top line', 'Posledních 5 minut, dokud je stránka otevřená, vzorek každé 2 s; horní linka')} ${fmtRate(sp.max)}</div>
    <div class="table-wrap"><table><thead><tr><th>${L('Service', 'Služba')}</th><th>Port</th><th>RX</th><th>TX</th>
      <th>${L('RX total', 'RX celkem')}</th><th>${L('TX total', 'TX celkem')}</th><th>${L('Packets RX / TX', 'Pakety RX / TX')}</th></tr></thead><tbody>
      ${svcs.map(([k, v]) => `<tr><td>${esc(NAMES[k]?.[0] || k)}</td><td class="muted">${NAMES[k]?.[1] || ''}</td>
        <td>${r ? fmtRate(r.svc[k].rx) : ''}</td><td>${r ? fmtRate(r.svc[k].tx) : ''}</td>
        <td>${fmtBytes(v.rx)}</td><td>${fmtBytes(v.tx)}</td><td class="muted">${v.rx_packets} / ${v.tx_packets}</td></tr>`).join('')}</tbody></table></div>

    <label class="field"><span>${L('Role', 'Role')}</span><select name="role">${Object.entries(ROLE_NAMES()).map(([k, n]) => `<option value="${k}" ${u.role === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <label><input type="checkbox" name="disabled" ${u.disabled ? 'checked' : ''}> ${L('Account disabled', 'Účet zablokován')}</label>
    <label class="field" style="margin-top:10px"><span>${L('New password (empty: unchanged)', 'Nové heslo (prázdné: beze změny)')}</span><input type="text" name="password" autocomplete="off" placeholder="${genPassword()}"></label>
    <label><input type="checkbox" name="must_change" checked> ${L('Must change the new password at the next sign-in', 'Nové heslo musí při dalším přihlášení změnit')}</label><br>
    ${u.totp ? `<label><input type="checkbox" name="totp_reset"> ${L('Turn off two-factor sign-in (lost phone)', 'Vypnout dvoufázové přihlášení (ztracený telefon)')}</label><br>` : ''}
    ${u.locked ? `<label><input type="checkbox" name="unlock" checked> ${L('Unlock the account', 'Odemknout účet')}</label><br>` : ''}
    <details style="margin-top:10px" ${Object.keys(u.levels).length ? 'open' : ''}><summary>${L('Own permissions (instead of the role)', 'Vlastní oprávnění (místo role)')}</summary>
      <div class="table-wrap" style="max-height:320px;overflow:auto"><table class="perm-table"><tbody>
      ${pages.map(pg => `<tr><td>${esc(pageLabel(pg))}</td><td><select name="lv:${pg}"><option value="-1">${L('as the role', 'podle role')}</option>
        ${LEVELS().map((t, i) => `<option value="${i}" ${u.levels[pg] === i ? 'selected' : ''}>${t}</option>`).join('')}</select></td></tr>`).join('')}
      </tbody></table></div></details>`,
    v => {
      const body = { name, role: v.role, disabled: v.disabled, levels: {} };
      if (v.password) { body.password = v.password; body.must_change = v.must_change; }
      if (v.totp_reset) body.totp_reset = true;
      if (v.unlock) body.unlock = true;
      for (const pg of pages) body.levels[pg] = +v['lv:' + pg];
      return api('/api/users', { json: body });
    });
  if (v) { toast(L('Saved', 'Uloženo')); loadUsersPage(); }
}

    <p>${L('1. Scan the code with Google Authenticator (or Microsoft Authenticator, 1Password, Aegis…).', '1. Naskenujte kód aplikací Google Authenticator (nebo Microsoft Authenticator, 1Password, Aegis…).')}</p>
    <div class="row" style="align-items:flex-start;gap:18px"><div class="qr">${d.qr_svg || ''}</div>
      <div><p class="muted" style="margin-top:0">${L('Or enter the key by hand:', 'Nebo zadejte klíč ručně:')}</p><code style="word-break:break-all">${esc(d.secret.replace(/(.{4})/g, '$1 ').trim())}</code></div></div>
    ${d.clock_set ? '' : `<p class="bad-text">${L('The gateway clock is not set (no internet for SNTP): codes cannot be checked now.', 'Hodiny brány nejsou nastavené (bez internetu pro SNTP): kódy teď nejde ověřit.')}</p>`}
    <label class="field" style="margin-top:12px"><span>${L('2. Enter the 6-digit code from the app', '2. Zadejte 6místný kód z aplikace')}</span>
      <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>`,
    val => api('/api/auth/totp/enable', { json: { code: val.code.trim() }, noLogin: required }), { ok: L('Turn on', 'Zapnout'), required });
  if (!v) return;
  const codes = v.recovery_codes || [];
  await formDialog(L('Recovery codes', 'Záložní kódy'), `<p>${L('Keep these codes safe. Each one signs you in once instead of the app code, for example after losing the phone. They are shown only now.',
    'Uložte si tyto kódy. Každý vás jednou přihlásí místo kódu z aplikace, třeba po ztrátě telefonu. Zobrazují se jen teď.')}</p>

}

/* actions of the user pages */
document.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  try {
    if (b.id === 'usr-new') await userNew();
    else if (b.dataset.usrEdit) await userEdit(b.dataset.usrEdit);
    else if (b.dataset.usrDel) {
      if (!await confirmDialog(L('Delete the user?', 'Smazat uživatele?'), b.dataset.usrDel)) return;
      await api('/api/users/delete', { json: { name: b.dataset.usrDel } });
      loadUsersPage();
    } else if (b.id === 'roles-save') {
      const body = { user: {}, viewer: {} };
      document.querySelectorAll('[data-role-lv]').forEach(sel => { const [r, pg] = sel.dataset.roleLv.split(':'); body[r][pg] = +sel.value; });
      renderRoles(await api('/api/auth/roles', { json: body }));
      toast(L('Saved', 'Uloženo'));
    } else if (b.id === 'roles-reset') {
      if (!await confirmDialog(L('Default permissions?', 'Výchozí oprávnění?'), L('The user and viewer roles get their default levels.', 'Role uživatel a divák dostanou výchozí úrovně.'))) return;
      renderRoles(await api('/api/auth/roles', { json: { reset: true } }));
    } else if (b.id === 'tok-new') {
      const v = await formDialog(L('New API token', 'Nový API token'), `
        <label class="field"><span>${L('Name (for example home-assistant)', 'Název (například home-assistant)')}</span><input type="text" name="name" maxlength="31" required></label>
        <label class="field"><span>${L('Role', 'Role')}</span><select name="role">${Object.entries(ROLE_NAMES()).map(([k, n]) => `<option value="${k}">${n}</option>`).join('')}</select></label>`,
        val => api('/api/tokens', { json: { name: val.name.trim(), role: val.role } }), { ok: L('Create', 'Vytvořit') });
      if (!v) return;
      await formDialog(L('API token', 'API token'), `<p>${L('Copy the token now, it is not shown again:', 'Zkopírujte si token teď, znovu se nezobrazí:')}</p>
        <textarea rows="2" readonly style="width:100%;font-family:ui-monospace,monospace" data-notr>${esc(v.token)}</textarea>`,
        () => copyText(v.token).then(() => toast(L('Copied', 'Zkopírováno'))), { ok: L('Copy and close', 'Zkopírovat a zavřít') });
      loadUsersPage();
    } else if (b.dataset.tokDel) {
      if (!await confirmDialog(L('Revoke the token?', 'Zneplatnit token?'), L('Clients using it lose access at once.', 'Klienti, kteří ho používají, ihned ztratí přístup.'))) return;
      renderTokens(await api('/api/tokens/delete', { json: { name: b.dataset.tokDel } }));
    } else if (b.dataset.reqSet) {
      const name = b.dataset.reqSet;
      const v = await formDialog(L('Set a password for', 'Nastavit heslo pro') + ' ' + esc(name), `
        <label class="field"><span>${L('Temporary password (tell it to the user)', 'Dočasné heslo (sdělte ho uživateli)')}</span><input type="text" name="password" value="${genPassword()}" required></label>
        <label><input type="checkbox" name="must_change" checked> ${L('Must change it at the next sign-in', 'Při dalším přihlášení ho musí změnit')}</label>`,
        val => api('/api/users', { json: { name, password: val.password, must_change: val.must_change } }));
      if (v) { toast(L('Password set', 'Heslo nastaveno')); loadUsersPage(); loadMe(); }
    } else if (b.dataset.reqDismiss) {
      renderRequests(await api('/api/auth/requests/dismiss', { json: { name: b.dataset.reqDismiss } }));
      loadMe();
    } else if (b.id === 'pol-save') {
      const body = { totp_required: [...document.querySelectorAll('[data-pol-totp]:checked')].map(x => x.dataset.polTotp) };
      for (const k of ['idle_h', 'remember_d', 'password_min', 'lock_attempts', 'lock_min']) body[k] = +$('#pol-' + k).value;
      renderPolicy(await api('/api/auth/policy', { json: body }));
      toast(L('Saved', 'Uloženo'));
    } else if (b.id === 'prof-pass') {
      const v = await formDialog(L('Change password', 'Změnit heslo'), `
        <label class="field"><span>${L('Current password', 'Současné heslo')}</span><input type="password" name="old" autocomplete="current-password" required></label>
        <label class="field"><span>${L('New password', 'Nové heslo')}</span><input type="password" name="new" autocomplete="new-password" required></label>
        <label class="field"><span>${L('New password again', 'Nové heslo znovu')}</span><input type="password" name="new2" autocomplete="new-password" required></label>`,
        async val => { if (val.new !== val.new2) throw new Error(L('The passwords differ', 'Hesla se liší')); return api('/api/auth/password', { json: { old: val.old, new: val.new } }); });
      if (v) toast(L('Password changed; other sessions were signed out', 'Heslo změněno; ostatní relace byly odhlášeny'));
    } else if (b.id === 'prof-revoke') {
      await api('/api/auth/sessions/revoke', { method: 'POST' });
      toast(L('Other sessions signed out', 'Ostatní relace odhlášeny'));
      loadProfile();
    } else if (b.id === 'totp-on') {
      await totpSetup(false);
      loadProfile();
    } else if (b.id === 'tg-save') {
      const body = { enabled: $('#tg-on').checked, tz: $('#tg-tz').value };
      if ($('#tg-token').value.trim()) body.token = $('#tg-token').value.trim();
      await api('/api/telegram', { json: body });
      toast(L('Saved', 'Uloženo'));
      setTimeout(loadNotifyAdmin, 4000);
      loadNotifyAdmin();
    } else if (b.id === 'tg-prefs') {
      const levels = {};
      document.querySelectorAll('[data-tg-level]').forEach(x => { levels[x.dataset.tgLevel] = +x.value; });
      await api('/api/auth/telegram', { json: { levels, quiet_from: +$('#tg-qf').value, quiet_to: +$('#tg-qt').value, lang: $('#tg-lang').value } });
      toast(L('Saved', 'Uloženo'));
    } else if (b.id === 'tg-pair') {
      const p = await api('/api/auth/telegram/pair', { method: 'POST' });
      formDialog(L('Pair Telegram', 'Spárovat Telegram'), `<p>${L('Open the link on the phone or computer with Telegram and press Start:', 'Otevřete odkaz v telefonu nebo počítači s Telegramem a stiskněte Start:')}</p>
        <p><a href="${esc(p.link)}" target="_blank" rel="noopener" class="btn primary">${ic('send')}@${esc(p.bot)}</a></p>
        <p class="muted">${L('Or send the bot this message:', 'Nebo botovi pošlete zprávu:')} <code>/start ${p.code}</code> ${L('(valid 10 minutes)', '(platí 10 minut)')}</p>`,
        () => true, { ok: L('Done', 'Hotovo') }).then(loadProfileTelegram);
    } else if (b.id === 'tg-unpair') {
      if (!await confirmDialog(L('Unpair Telegram?', 'Zrušit spárování Telegramu?'), L('Notifications and commands stop for this chat.', 'Notifikace a příkazy pro tento chat skončí.'))) return;
      await api('/api/auth/telegram/unpair', { method: 'POST' });
      loadProfileTelegram();
    } else if (b.id === 'tg-test') {
      await api('/api/auth/telegram/test', { method: 'POST' });
      toast(L('Sent; it arrives within a few seconds', 'Odesláno; dorazí do několika sekund'));
    } else if (b.id === 'totp-off') {
      const v = await formDialog(L('Turn off two-factor sign-in', 'Vypnout dvoufázové přihlášení'), `
        <label class="field"><span>${L('Current password', 'Současné heslo')}</span><input type="password" name="password" autocomplete="current-password" required></label>`,
        val => api('/api/auth/totp/disable', { json: { password: val.password } }), { ok: L('Turn off', 'Vypnout') });
      if (v) loadProfile();
    }
  } catch (err) { toast(err.message); }
});

views['system/maint'] = () => maintenanceBanner() + `<div class="grid"><div class="card">${h3('wrench-outline', 'Maintenance')}
    <div class="row"><button class="btn" id="sys-reboot">${ic('restart')}Restart</button>${tip('Restart')}</div>
    <div class="row"><button class="btn danger" id="sys-reflash">${ic('chip')}Reflash C6 now</button>${tip('Reflash C6 now')}</div>
    <div class="row"><button class="btn" id="c6-backup" ${activeRole() === 'none' ? '' : 'disabled'}>${ic('backup-restore')}Back up C6 flash</button>${tip('Back up C6 flash')}</div>
    <p class="muted">Reflash rewrites the C6 with the image of the current role on the next start (use after an RCP or NCP failure).
    The C6 backup reads its whole flash over JP1 (about 2 minutes) and works only in maintenance mode. Keep the first backup:
    it is the only copy of the factory esp-hosted firmware.</p></div></div>`;

/* ---------------- actions ---------------- */

document.addEventListener('click', async e => {
  const t = e.target.closest('button');
  if (!t) return;
  try {
    if (t.dataset.role) {
      const r = ROLES[t.dataset.role];
      if (!await confirmDialog('Switch to ' + r.name + '?', 'The gateway restarts and may reflash the C6. Devices on the current network go offline until you switch back.')) return;
      try {
        await api('/api/role', { json: { role: t.dataset.role } });
      } catch (err) {
        if (err.message !== 'c6_backup_required') throw err;
        if (!await confirmDialog('No C6 backup yet', 'This role overwrites the factory firmware of the C6, which cannot be downloaded again. Cancel and use System → Back up C6 flash first (needs the JP1 jumpers), or continue without a backup.')) {
          go('system/maint');
          return;
        }
        await api('/api/role', { json: { role: t.dataset.role, skip_backup: true } });
      }
      toast('Switching, the page reconnects automatically');
      /* ESPHome replaces this firmware: nothing to wait for */
      waitForRestart(t.dataset.role !== 'esphome');
    } else if (t.dataset.cli) {
      runCli(t.dataset.cli);
    } else if (t.id === 'cli-run') {
      const cmd = $('#cli-cmd').value.trim();
      if (cmd) runCli(cmd);
    } else if (t.id === 'ds-reveal') {
      loadDataset(true);
    } else if (t.id === 'ds-copy') {
      if (!datasetTlvs) await loadDataset(true);
      await showCopy('Thread dataset TLVs', datasetTlvs, 'Contains the network key, keep it private.');
    } else if (t.id === 'ds-apply') {
      const tlvs = $('#ds-tlvs').value.replace(/\s+/g, '');
      if (!tlvs || !await confirmDialog('Apply dataset?', 'The gateway leaves its current Thread network and joins the one in the dataset.')) return;
      const r = await api('/api/thread/dataset', { json: { tlvs } });
      toast('Joining ' + r.network_name);
      loadDataset(false);
    } else if (t.id === 'zb-reset') {
      if (!await confirmDialog('Reset the C6?', 'The Zigbee host loses its connection and has to reinitialise the coordinator.')) return;
      await api('/api/zigbee/reset', { method: 'POST' });
      toast('C6 reset');
    } else if (t.id === 'identify-btn') {
      await api('/api/identify', { json: { seconds: 10 } });
      status = await api('/api/status');
      renderHeader();
    } else if (t.id === 'thr-txp-set' || t.id === 'zr-txp-set') {
      const thr = t.id === 'thr-txp-set', v = +$(thr ? '#thr-txp' : '#zr-txp').value;
      if (!Number.isInteger(v) || v < -15 || v > 20) return toast(L('Transmit power: -15 to 20 dBm', 'Vysílací výkon: -15 až 20 dBm'));
      if (thr) { await api('/api/thread/txpower', { json: { dbm: v } }); loadThreadTxPower(); }
      else await api('/api/zigbee/command', { json: { cmd: 'txpower', value: v } });
      t.blur();
      toast(L(`Transmit power ${v} dBm`, `Vysílací výkon ${v} dBm`));
    } else if (t.dataset.zr) {
      const cmd = t.dataset.zr;
      if (['leave', 'factory_reset'].includes(cmd) && !await confirmDialog('Run ' + cmd + '?', 'The router leaves its Zigbee network.')) return;
      await api('/api/zigbee/command', { json: { cmd } });
      toast('Sent ' + cmd);
    } else if (t.dataset.snap) {
      download('/api/c6/zigbee-snapshot?bundle=' + encodeURIComponent(t.dataset.snap), t.dataset.snap + '_nvram.bin');
    } else if (t.id === 'mq-save') {
      const body = { uri: $('#mq-uri').value.trim(), user: $('#mq-user').value, prefix: $('#mq-prefix').value.trim(), enabled: $('#mq-en').checked,
        tls: $('#mq-tls').value, ca: $('#mq-ca').value.trim(), skip_cn_check: $('#mq-nocn').checked, client_id: $('#mq-cid').value.trim(),
        keepalive: +$('#mq-ka').value, base: $('#mq-base').value.trim(), interval: +$('#mq-int').value, discovery: $('#mq-disc').checked };
      if ($('#mq-pass').value) body.password = $('#mq-pass').value;
      await api('/api/mqtt', { json: body });
      toast('MQTT saved');
      setTimeout(loadMqtt, 1500);
    } else if (t.id === 'ping-run') {
      $('#ping-out').textContent = '…';
      const r = await api('/api/tools/ping', { json: { host: $('#ping-host').value.trim(), count: +$('#ping-count').value } });
      $('#ping-out').textContent = `PING ${r.target}\n` + r.replies.map(x => x.timeout ? `seq ${x.seq}: timeout` : `seq ${x.seq}: ${x.ms} ms`).join('\n') + `\n${r.received}/${r.sent} received`;
    } else if (t.id === 'c6-backup') {
      toast('Reading the C6 flash, about 2 minutes…');
      t.disabled = true;
      try { await download('/api/c6/backup', status.hostname + '_c6_flash.bin'); toast('C6 backup saved'); } finally { t.disabled = false; }
    } else if (t.id === 'copy-btn') {
      toast(await copyText($('#copy-text').value) ? 'Copied to the clipboard' : 'Select the text and copy it (Ctrl/Cmd+C)');
    } else if (t.id === 'ev-preset-apply') {
      if (!await confirmDialog('Apply preset?', 'Replaces all events and the sound selection. Removed events disappear from Home Assistant.')) return;
      sndCfg = await api('/api/sound/events/preset', { json: { preset: $('#ev-preset').value } });
      sndExclude = new Set(sndCfg.exclude); sndDirty = false; renderEvents(); renderTree(); toast('Preset applied');
    } else if (t.id === 'ev-new') {
      openEditor(-1, { id: '', name: '', kind: 'impulse', threshold: 0.5, windows: 1, hold_s: 3, cooldown_s: 30, classes: [], suppress: [], enabled: true });
    } else if (t.dataset.evEdit !== undefined) {
      openEditor(+t.dataset.evEdit);
    } else if (t.dataset.evDel !== undefined) {
      const ev = sndCfg.events[+t.dataset.evDel];
      if (!await confirmDialog('Delete ' + ev.name + '?', 'Its entities disappear from Home Assistant; automations using them stop working.')) return;
      await putEvents({ events: sndCfg.events.filter((_, i) => i !== +t.dataset.evDel) });
    } else if (t.dataset.evYaml !== undefined) {
      const ev = sndCfg.events[+t.dataset.evYaml];
      await showCopy('Automation: ' + ev.name, automationYaml(ev),
        'Home Assistant: Settings → Automations & scenes → Create automation → ⋮ → Edit in YAML, paste, save.');
    } else if (t.id === 'ev-export') {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify({ exclude: [...sndExclude], events: sndCfg.events.map(({ active, count, last_ago_s, ...e }) => e) }, null, 2)], { type: 'application/json' }));
      a.download = status.hostname + '_sound_events.json';
      a.click();
    } else if (t.id === 'cls-save') {
      await putEvents(sndCfg);
    } else if (t.dataset.clsAll || t.dataset.clsNone) {
      e.preventDefault();
      const top = t.dataset.clsAll || t.dataset.clsNone;
      sndClasses.filter(c => c[2] === top).forEach(c => { if (t.dataset.clsAll) sndExclude.delete(c[0]); else sndExclude.add(c[0]); });
      document.querySelectorAll('[data-cls]').forEach(cb => { cb.checked = !sndExclude.has(+cb.dataset.cls); });
      sndDirty = true; updateClsSummary();
    } else if (t.dataset.logIgnore !== undefined) {
      sndExclude.add(+t.dataset.logIgnore);
      await putEvents(sndCfg);
      const cb = document.querySelector(`[data-cls="${t.dataset.logIgnore}"]`); if (cb) cb.checked = false;
    } else if (t.dataset.logRaise) {
      const events = sndCfg.events.slice();
      const ev = events.find(x => x.id === t.dataset.logRaise);
      if (ev) { ev.threshold = Math.min(1, Math.round((ev.threshold + 0.1) * 100) / 100); await putEvents({ events }); }
    } else if (t.dataset.logNew !== undefined) {
      const c = +t.dataset.logNew;
      openEditor(-1, { id: clsName(c).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 23), name: clsName(c), kind: 'impulse', threshold: 0.5, windows: 1, hold_s: 3, cooldown_s: 30, classes: [c], suppress: [], enabled: true });
    } else if (t.id === 'snd-spl-cal') {
      const ref = parseFloat($('#snd-spl-ref').value);
      if (!(ref >= 20 && ref <= 130)) throw new Error(L('enter the reading, 20-130 dB(A)', 'zadejte údaj hlukoměru, 20-130 dB(A)'));
      await api('/api/sound/config', { json: { spl_reference: ref } });
      toast(L('Calibrated', 'Zkalibrováno'));
      loadSound();
    } else if (t.id === 'snd-spl-reset') {
      await api('/api/sound/config', { json: { spl_reset: true } });
      toast(L('Default calibration', 'Výchozí kalibrace'));
      loadSound();
    } else if (t.id === 'snd-clip') {
      const res = await fetch('/api/sound/clip?seconds=5');
      if (!res.ok) throw new Error((await res.json()).error || res.statusText);
      const audio = $('#snd-audio');
      audio.src = URL.createObjectURL(await res.blob());
      audio.classList.remove('hidden');
      audio.play().catch(() => {});
    } else if (t.id === 'zmap-refresh') {
      await api('/api/zigbee/net/map', { method: 'POST' });
      toast(L('Map requested: Zigbee2MQTT needs up to a few minutes', 'Mapa vyžádána: Zigbee2MQTT potřebuje až několik minut'));
      loadZigbeeNet(false);
    } else if (t.id === 'zjoin-open' || t.id === 'zjoin-close') {
      const via = $('#zjoin-via').value;
      await zRequest({ action: 'permit_join', time: t.id === 'zjoin-open' ? 254 : 0, ...(via ? { device: via } : {}) });
      toast(t.id === 'zjoin-open' ? L('Joining open for 254 s', 'Připojování otevřeno na 254 s') : L('Joining closed', 'Připojování zavřeno'));
      setTimeout(() => loadZigbeeNet(false), 1500);
    } else if (t.dataset.zact) {
      const dev = t.dataset.zdev, act = t.dataset.zact;
      if (act === 'rename') {
        const r = await zDialog(L('Rename', 'Přejmenovat'), L('New name in Zigbee2MQTT (Home Assistant entities are renamed too).', 'Nový název v Zigbee2MQTT (přejmenují se i entity v Home Assistant).'), dev);
        if (!r || !r.input || r.input === dev) return;
        await zRequest({ action: 'rename', device: dev, to: r.input });
        toast(L('Renamed', 'Přejmenováno'));
      } else if (act === 'remove') {
        const r = await zDialog(L(`Remove ${dev}?`, `Odebrat ${dev}?`), L('The device leaves the network and disappears from Zigbee2MQTT and Home Assistant.', 'Zařízení opustí síť a zmizí ze Zigbee2MQTT i z Home Assistant.'), undefined,
          L('Force (the device does not answer; it may stay joined)', 'Vynutit (zařízení neodpovídá; může zůstat v síti)'));
        if (!r) return;
        await zRequest({ action: 'remove', device: dev, force: r.check });
        toast(L('Removed', 'Odebráno'));
      } else if (act === 'interview') {
        toast(L('Interviewing, wake a battery device up now', 'Načítám zařízení, bateriové teď probuďte'));
        const r = await zRequest({ action: 'interview', device: dev });
        toast(r.status === 'ok' ? L('Interview done', 'Načtení dokončeno') : L('Sent, no answer yet', 'Odesláno, zatím bez odpovědi'));
      } else if (act === 'identify') {
        await zRequest({ action: 'identify', device: dev });
        toast(L('Identify sent', 'Identifikace odeslána'));
        return;
      } else if (act === 'txpower') {
        const r = await zDialog(L('Transmit power', 'Vysílací výkon'), L('C6 router transmit power, -15 to 20 dBm.', 'Vysílací výkon C6 routeru, -15 až 20 dBm.'), String(status.role_status?.router?.tx_power ?? 20));
        const v = r ? +r.input : NaN;
        if (!r) return;
        if (!Number.isInteger(v) || v < -15 || v > 20) return toast(L('Transmit power: -15 to 20 dBm', 'Vysílací výkon: -15 až 20 dBm'));
        await api('/api/zigbee/command', { json: { cmd: 'txpower', value: v } });
        toast(L(`Transmit power ${v} dBm`, `Vysílací výkon ${v} dBm`));
      } else if (act === 'ota_check') {
        const r = await zRequest({ action: 'ota_check', device: dev });
        toast(r.data?.update_available || r.data?.updateAvailable ? L('Update available', 'Aktualizace je k dispozici') : r.status === 'ok' ? L('No update', 'Bez aktualizace') : L('Sent, no answer yet', 'Odesláno, zatím bez odpovědi'));
      } else if (act === 'ota_update') {
        if (!await confirmDialog(L(`Update ${dev}?`, `Aktualizovat ${dev}?`), L('The update takes several minutes; the device may restart.', 'Aktualizace trvá několik minut; zařízení se může restartovat.'))) return;
        await zRequest({ action: 'ota_update', device: dev });
        toast(L('Update started', 'Aktualizace spuštěna'));
      }
      setTimeout(() => loadZigbeeNet(false), 1500);
    } else if (t.id === 'topo-refresh') {
      matterCache.at = 0;
      loadTopology();
    } else if (t.id === 'matter-save') {
      await api('/api/settings', { json: { matter_url: $('#matter-url').value.trim() } });
      status.matter_url = $('#matter-url').value.trim();
      matterCache.at = 0;
      toast(L('Saved', 'Uloženo'));
    } else if (t.dataset.haIp) {
      $('#matter-url').value = `ws://${t.dataset.haIp}:5580/ws`;
    } else if (t.id === 'matter-test') {
      const url = $('#matter-url').value.trim() || (await matterUrl()).url;
      $('#matter-test-out').textContent = '…';
      try {
        const nodes = await matterFetch(url);
        $('#matter-test-out').innerHTML = `<span class="ok-text">${L('OK', 'OK')}: ${nodes.length} ${L('Matter nodes', 'uzlů Matter')}</span> <code>${esc(url)}</code>`;
      } catch (err) {
        $('#matter-test-out').innerHTML = `<span class="warn-text">${esc(err.message)}</span>`;
      }
    } else if (t.id === 'ns-quick') {
      await api('/api/net/scan', { json: { mode: 'quick' } });
      toast(L('Quick scan running (about 15 s)', 'Rychlý sken běží (asi 15 s)'));
      loadNetscan();
    } else if (t.id === 'ns-full') {
      if (!await confirmDialog('Run a full scan?', 'The gateway restarts, the C6 runs the scanner firmware and then the role firmware again. The active role is off for about a minute.')) return;
      await api('/api/net/scan', { json: { mode: 'full' } });
      toast('Full scan: the gateway restarts');
      waitForRestart();
    } else if (t.id === 'cd-get') {
      download('/api/coredump', 'coredump.elf');
    } else if (t.id === 'set-export') {
      await download('/api/settings/export' + ($('#set-secrets').checked ? '?secrets=1' : ''), status.hostname + '-settings.json');
    } else if (t.id === 'zb-snap-now') {
      if (!await confirmDialog('Back up the Zigbee network now?', activeRole() === 'zigbee_coordinator'
        ? L('The gateway restarts and reads the network data from the C6 (about 20 s). Zigbee2MQTT loses the adapter meanwhile and may have to be restarted.', 'Brána se restartuje a přečte data sítě z C6 (asi 20 s). Zigbee2MQTT mezitím ztratí adaptér a může být nutné ho restartovat.')
        : L('The gateway restarts and reads the network data from the C6 (about 20 s); the router rejoins its network afterwards.', 'Brána se restartuje a přečte data sítě z C6 (asi 20 s); router se pak vrátí do své sítě.'))) return;
      await api('/api/c6/zigbee-snapshot', { method: 'POST' });
      toast('Zigbee backup: the gateway restarts');
      waitForRestart();
    } else if (t.id === 'upd-save') {
      await api('/api/settings', { json: { update_url: $('#upd-url').value.trim() } });
      toast('Saved');
      for (let i = 0; i < 40 && (status.update = (await api('/api/status')).update).checking; i++) await new Promise(r => setTimeout(r, 500));
      render(true);
    } else if (t.id === 'upd-check') {
      await api('/api/update/check', { method: 'POST' });
      for (let i = 0; i < 40 && (status.update = (await api('/api/status')).update).checking; i++) await new Promise(r => setTimeout(r, 500));
      render(true);
    } else if (t.id === 'upd-install') {
      await installUpdate();
    } else if (t.id === 'upd-install-c6') {
      await installC6();
    } else if (t.dataset.relGw) {
      e.preventDefault(); // the button sits in the summary of an expandable row
      await installUpdate(t.dataset.relGw);
    } else if (t.dataset.relC6) {
      e.preventDefault();
      await installC6(t.dataset.relC6);
    } else if (t.id === 'upd-github') {
      $('#upd-url').value = GITHUB_MANIFEST;
      toast(L('Save to use it. The repository must be public for the gateway to download releases.', 'Uložte pro použití. Repozitář musí být veřejný, aby brána mohla vydání stahovat.'));
    } else if (t.id === 'ln-sample' || t.id === 'ln-bg') {
      await learnRecord(t.id === 'ln-sample' ? 'sample' : 'background');
    } else if (t.id === 'ln-up-sample' || t.id === 'ln-up-bg' || t.id === 'ln-up-test') {
      await learnUpload({ 'ln-up-sample': 'sample', 'ln-up-bg': 'background', 'ln-up-test': 'test' }[t.id]);
    } else if (t.dataset.lnEvent) {
      await learnEvent(t.dataset.lnEvent);
    } else if (t.dataset.lnDelprof) {
      if (!await confirmDialog('Delete the samples?', t.dataset.lnDelprof === '_background' ? L('All background recordings are deleted.', 'Smažou se všechny nahrávky pozadí.') : L(`All samples of ${t.dataset.lnDelprof} are deleted. An event using it stops detecting.`, `Smažou se všechny vzorky ${t.dataset.lnDelprof}. Událost, která ho používá, přestane detekovat.`))) return;
      await api('/api/sound/learn?profile=' + encodeURIComponent(t.dataset.lnDelprof), { method: 'DELETE' });
      loadLearn();
    } else if (t.id === 'log-prev') {
      /* formatted like the live log: the same parser on a separate buffer */
      const keep = [logLines, logTags, logRest];
      logLines = []; logTags = new Map(); logRest = '';
      try {
        logParse(await api('/api/logs/previous') + '\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([logFileText(logLines)], { type: 'text/plain' }));
        a.download = status.hostname + '-previous.log';
        a.click();
      } finally { [logLines, logTags, logRest] = keep; }
    } else if (t.id === 'cd-del') {
      await api('/api/coredump', { method: 'DELETE' });
      toast('Core dump erased');
    } else if (t.id === 'log-pause') {
      logPaused = !logPaused;
      t.textContent = logPaused ? 'Resume' : 'Pause';
    } else if (t.id === 'log-clear') {
      logLines = []; logTags = new Map();
      renderLog();
    } else if (t.id === 'log-save') {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([logFileText(logFilter())], { type: 'text/plain' }));
      a.download = status.hostname + '.log';
      a.click();
    } else if (t.dataset.upload) {
      await upload(t.dataset.upload);
    } else if (t.id === 'set-save') {
      const body = {};
      if ($('#set-host').value.trim() !== status.hostname) body.hostname = $('#set-host').value.trim();
      await api('/api/settings', { json: body });
      toast(body.hostname ? 'Saved, restart to apply the hostname' : 'Saved');
    } else if (t.id === 'side-logout') {
      await api('/api/auth/logout', { method: 'POST' });
      me = null;
      location.reload();
    } else if (t.id === 'side-reboot') {
      if (!await confirmDialog(L('Restart the gateway?', 'Restartovat bránu?'), L('The C6 radio and right after it the P4 restart. Thread or Zigbee is back in about 15 s; devices reconnect on their own.',
        'Restartuje se rádio C6 a hned po něm P4. Thread nebo Zigbee naběhne asi za 15 s, zařízení se připojí sama.'))) return;
      await api('/api/reboot', { json: { full: true } });
      waitForRestart();
    } else if (t.id === 'lan-confirm') {
      await api('/api/net/lan/confirm', { method: 'POST' });
      toast(L('LAN settings saved', 'Nastavení LAN uloženo'));
      status = await api('/api/status');
      renderHeader();
    } else if (t.id === 'lan-save') {
      const mode = $('#lan-mode').value, body = { mode, link: $('#lan-link').value }, e0 = status.eth;
      if (mode === 'static') for (const k of ['ip', 'mask', 'gw', 'dns1', 'dns2']) body[k] = $('#lan-' + k).value.trim();
      const host = mode === 'static' ? body.ip : status.hostname + '.local';
      const moves = mode === 'static' ? body.ip !== e0.ipv4 : e0.mode === 'static';
      if (!await confirmDialog(L('Apply LAN settings?', 'Použít nastavení LAN?'), moves
        ? L(`The gateway moves to ${host}. This page opens there; confirm the settings within 120 s, otherwise the previous ones come back.`,
          `Brána přejde na ${host}. Tato stránka se tam otevře; nastavení potvrďte do 120 s, jinak se vrátí předchozí.`)
        : L('Confirm the settings within 120 s, otherwise the previous ones come back. A new link mode restarts the link for a few seconds.',
          'Nastavení potvrďte do 120 s, jinak se vrátí předchozí. Nový režim linky restartuje linku na několik sekund.'))) return;
      await api('/api/net/lan', { json: body });
      if (moves) {
        toast(L(`Moving to ${host}…`, `Přecházím na ${host}…`));
        setTimeout(() => { location.href = `http://${host}/#system/lan`; }, 3000);
      } else {
        status = await api('/api/status');
        renderHeader();
      }
    } else if (t.id === 'sys-reboot') {
      if (!await confirmDialog('Restart?', 'The active role stops for about 10 s.')) return;
      await api('/api/reboot', { method: 'POST' });
      waitForRestart();
    } else if (t.id === 'sys-reflash') {
      if (!await confirmDialog('Reflash the C6?', 'The gateway restarts and rewrites the C6 firmware of the current role.')) return;
      await api('/api/c6/reflash', { method: 'POST' });
      waitForRestart();
    }
  } catch (err) {
    toast('Error: ' + err.message);
  }
});

document.addEventListener('click', e => {
  const lt = e.target.closest('a[data-log-tag]');
  if (lt) {
    e.preventDefault();
    logView.tag = logView.tag === lt.dataset.logTag ? '' : lt.dataset.logTag;
    logView.src = 'all';
    if ($('#log-src')) $('#log-src').value = 'all';
    renderLog();
    return;
  }
  const ln = e.target.closest('a[data-ln-play], a[data-ln-del]');
  if (ln) {
    e.preventDefault();
    if (ln.dataset.lnPlay) {
      fetch('/api/sound/learn/sample?slot=' + ln.dataset.lnPlay)
        .then(r => r.ok ? r.blob() : Promise.reject(new Error(r.statusText))).then(b => new Audio(URL.createObjectURL(b)).play())
        .catch(err => toast('Error: ' + err.message));
    } else {
      api('/api/sound/learn?slot=' + ln.dataset.lnDel, { method: 'DELETE' }).then(loadLearn).catch(err => toast('Error: ' + err.message));
    }
    return;
  }
  const a = e.target.closest('a[data-chip-del]');
  if (!a) return;
  e.preventDefault();
  const [id, i] = a.dataset.chipDel.split(':');
  const key = id === 'ev-classes' ? 'classes' : 'suppress';
  editEv[key] = editEv[key].filter(x => x !== +i);
  chips(id, editEv[key]);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'cli-cmd') $('#cli-run').click();
});

async function download(path, name) {
  const res = await fetch(path);
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).error || msg; } catch (e) { /* not JSON */ }
    throw new Error(msg);
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await res.blob());
  a.download = name;
  a.click();
}

function upload(kind) {
  const file = $(`#${kind}-file`).files[0];
  if (!file) { toast('Choose a file'); return; }
  const prog = $(`#${kind}-prog`);
  prog.classList.remove('hidden');
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/ota/' + kind);
    xhr.upload.onprogress = e => { prog.firstElementChild.style.width = (e.loaded / e.total * 100) + '%'; };
    xhr.onload = () => {
      let r = {};
      try { r = JSON.parse(xhr.responseText); } catch (e) { /* not JSON */ }
      if (xhr.status !== 200) { reject(new Error(r.error || xhr.statusText)); return; }
      toast(r.restarting ? 'Uploaded, restarting into the new firmware' : 'Uploaded ' + (r.version || ''));
      if (r.restarting) waitForRestart();
      resolve();
    };
    xhr.onerror = () => reject(new Error('upload failed'));
    xhr.send(file);
  });
}

let restarting = false;
/* modal: the restart and what follows it (C6 flashing, role start) blocks the UI until done */
async function importSettings(file) {
  const c = JSON.parse(await file.text());
  if (c.format !== 'p4gw-settings') throw new Error(L('not a settings file of this gateway', 'není to soubor nastavení této brány'));
  const when = c.exported ? new Date(c.exported * 1000).toLocaleString() : '?';
  if (!await confirmDialog('Import settings?', L(`Settings of ${c.hostname} from ${when} (${Object.keys(c.keys || {}).length} items${c.secrets ? ', with passwords' : ''}) overwrite the current ones and the gateway restarts.`,
    `Nastavení ${c.hostname} z ${when} (${Object.keys(c.keys || {}).length} položek${c.secrets ? ', s hesly' : ''}) přepíše současné a brána se restartuje.`))) return;
  await api('/api/settings/import', { json: c });
  toast('Settings imported: the gateway restarts');
  waitForRestart();
}
async function waitForRestart(modal = true) {
  restarting = true;
  Object.assign(busy, { expect: modal, since: Date.now(), eta: null });
  renderBusy();
  await new Promise(r => setTimeout(r, 3000));
  for (let i = 0; i < 240; i++) {
    /* short timeout: a request sent while the board is down hangs in TCP retries and would see it back late */
    try { status = await api('/api/status', { timeout: 1500 }); restarting = false; render(true); toast('Gateway is back'); return; } catch (e) { /* still down */ }
    renderBusy();
    await new Promise(r => setTimeout(r, 1000));
  }
  restarting = false;
  busy.expect = false;
  renderBusy();
}

/* Blocking progress dialog while the gateway restarts, the C6 is flashed (also a C6 backup) or the
 * new role starts. The bar moves in 0.5 s steps; the estimate comes from the elapsed time. */
const busy = { expect: false, since: 0, eta: null, at: 0 };
function flashStage(st) {
  const m = /^writing 0x([0-9a-f]+) \((\d+) kB\)$/.exec(st);
  if (m) return L(`writing ${m[2]} kB at 0x${m[1]}`, `zápis ${m[2]} kB na 0x${m[1]}`);
  return L(st, { 'verifying image': 'kontrola image', 'connecting to C6 bootloader': 'připojení k zavaděči C6',
    'saving Zigbee network data': 'záloha dat Zigbee sítě', 'erasing settings area': 'mazání oblasti nastavení',
    'restoring Zigbee network data': 'obnova dat Zigbee sítě', 'reading C6 flash': 'čtení flash C6', done: 'hotovo', failed: 'selhalo' }[st] || st);
}
function renderBusy() {
  const dlg = $('#busy-dlg'), fl = status?.c6?.flash, r = status?.role;
  const phase = restarting ? (busy.expect ? 'restart' : '') : fl?.busy ? 'flash'
    : busy.expect && r && !r.maintenance && r.active !== r.desired ? 'start' : '';
  if (!phase) {
    busy.expect = false;
    busy.eta = null;
    if (dlg.open) dlg.close();
    return;
  }
  const bar = $('#busy-bar'), secs = Math.round((Date.now() - busy.since) / 1000);
  bar.classList.toggle('ind', phase !== 'flash');
  if (phase === 'flash') {
    $('#busy-title').textContent = fl.stage === 'reading C6 flash' ? L('Backing up the C6 flash', 'Záloha flash C6') : L('Flashing the C6', 'Flashování C6');
    $('#busy-stage').textContent = flashStage(fl.stage);
    bar.firstElementChild.style.width = fl.percent + '%';
    $('#busy-pct').textContent = fl.percent + ' %';
    /* remaining time at the average pace so far, smoothed and counted down between samples */
    if (fl.elapsed_s && fl.percent >= 12 && fl.percent < 100) {
      const e = fl.elapsed_s * (100 - fl.percent) / fl.percent, now = Date.now();
      busy.eta = busy.eta === null ? e : Math.max(0, busy.eta - (now - busy.at) / 1000) * 0.6 + e * 0.4;
      busy.at = now;
    }
    $('#busy-eta').textContent = busy.eta === null ? L('estimating…', 'odhaduji…') : L(`about ${Math.ceil(busy.eta)} s left`, `zbývá asi ${Math.ceil(busy.eta)} s`);
  } else {
    $('#busy-title').textContent = phase === 'restart' ? L('The gateway is restarting', 'Brána se restartuje') : L('Starting the role', 'Spouštím roli');
    $('#busy-stage').textContent = phase === 'start' ? (ROLES[r.desired]?.name || r.desired) : '';
    bar.firstElementChild.style.width = '';
    $('#busy-pct').textContent = '';
    $('#busy-eta').textContent = phase === 'restart' ? L(`${secs} s`, `${secs} s`) : '';
  }
  $('#busy-note').textContent = L('The page is locked until the gateway is done. Do not unplug the board.',
    'Stránka je zamčená, dokud brána neskončí. Desku neodpojujte od napájení.');
  if (!dlg.open) dlg.showModal();
}
$('#busy-dlg').addEventListener('cancel', e => e.preventDefault());

/* ---------------- log ---------------- */

/* Lines from the gateway start with the time they were logged ("<unix ms> " or "+<ms since boot> ");
 * ESP-IDF's own time in the line is dropped, the local time of the browser is shown instead. */
const LOG_SOURCES = {
  all: { label: 'all sources' },
  system: { label: 'system', tags: /^(main|gw_boot|gw_config|gw_api|gw_update|gw_log|cpu_start|heap_init|spi_flash|esp_image|boot|app_init|efuse|esp_psram|esp_core_dump.*|ota|esp_ota_ops|esp_https_ota|pp|phy|temperature_sensor)$/i },
  network: { label: 'network, MQTT, web', tags: /^(gw_eth|gw_http|gw_mqtt|esp_eth.*|eth_.*|mdns.*|esp-tls.*|transport.*|mqtt_client|httpd.*|netscan|esp_netif.*|sntp|ping_sock|lwip)$/i },
  thread: { label: 'Thread', tags: /^(OPENTHREAD|OT_.*|obtr_web|esp_ot.*|role_thread|ot_.*|esp_br.*|thread_.*)$/i },
  zigbee: { label: 'Zigbee', tags: /^(role_zigbee|zigbee_net|zb_.*)$/i },
  sound: { label: 'sound', tags: /^(sound.*|I2S_IF|ES8311|Adev_Codec|FbsLoader|i2s_.*|dl_.*|esp-dl)$/i },
  c6: { label: 'C6 flashing', tags: /^(c6_flasher|esp_loader.*|serial_flasher.*)$/i },
};
let logSeq = 0, logPaused = false, logRest = '', logLines = [], logTags = new Map();
const logView = { src: 'all', lvl: 'IWED', tag: '', q: '' };
const LOG_MAX = 6000;

/* Parses complete lines; a partial last line waits for its end. */
function logParse(text) {
  const lines = (logRest + text).split('\n');
  logRest = lines.pop();
  for (const raw of lines) {
    const m = raw.match(/^(\d{13}|\+\d+) (.*)$/);
    const at = m ? (m[1][0] === '+' ? null : +m[1]) : null, body = (m ? m[2] : raw).replace(/\r$/, '');
    if (!body.trim()) continue;
    /* "I (11:18:23.116) tag: msg", OpenThread "W(12831) OPENTHREAD:[W] ..." */
    const p = body.match(/^([IWEDV]) ?\(([\d:.]+)\) ([^:\s]+): ?(.*)$/);
    const prev = logLines[logLines.length - 1];
    const line = p ? { at, lvl: p[1], tag: p[3], msg: p[4] } : { at, lvl: prev?.lvl || 'I', tag: prev?.tag || '', msg: body };
    if (!p && !m) line.at = prev?.at ?? null;
    logLines.push(line);
    if (line.tag) logTags.set(line.tag, (logTags.get(line.tag) || 0) + 1);
  }
  if (logLines.length > LOG_MAX) logLines.splice(0, logLines.length - LOG_MAX);
}

const pad = (n, w = 2) => String(n).padStart(w, '0');
function logTime(at, full) {
  if (at == null) return full ? '????-??-?? ??:??:??.???' : '??:??:??.???';
  const d = new Date(at);
  const t = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`;
  return full ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${t}`
    : (new Date().toDateString() === d.toDateString() ? t : `${d.getDate()}.${d.getMonth() + 1}. ${t}`);
}

function logMatcher() {
  const q = logView.q.trim();
  if (!q) return null;
  const re = q.match(/^\/(.+)\/$/);
  try { return new RegExp(re ? re[1] : q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); } catch (e) { return null; }
}

function logFilter() {
  const src = LOG_SOURCES[logView.src], m = logMatcher();
  return logLines.filter(l => logView.lvl.includes(l.lvl) && (!src.tags || src.tags.test(l.tag)) && (!logView.tag || l.tag === logView.tag)
    && (!m || (m.lastIndex = 0, m.test(l.tag + ': ' + l.msg))));
}

function renderLog() {
  const box = $('#log');
  if (!box) return;
  const sel = $('#log-tag');
  const tags = [...logTags.keys()].filter(t => !LOG_SOURCES[logView.src].tags || LOG_SOURCES[logView.src].tags.test(t)).sort((a, b) => a.localeCompare(b));
  const opts = `<option value="">${L('all tags', 'všechny tagy')}</option>` + tags.map(t => `<option value="${esc(t)}" ${t === logView.tag ? 'selected' : ''}>${esc(t)} (${logTags.get(t)})</option>`).join('');
  if (sel.dataset.opts !== opts) { sel.innerHTML = opts; sel.dataset.opts = opts; }
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  const shown = logFilter(), m = logMatcher(), last = shown.slice(-2000);
  const hl = t => {
    if (!m) return esc(t);
    let out = '', i = 0;
    for (const x of t.matchAll(m)) {
      if (!x[0]) break;
      out += esc(t.slice(i, x.index)) + `<mark>${esc(x[0])}</mark>`;
      i = x.index + x[0].length;
    }
    return out + esc(t.slice(i));
  };
  box.innerHTML = last.map(l => `<span class="muted">${logTime(l.at)}</span> <span class="lv-${l.lvl}">${l.lvl}</span> ${l.tag ? `<a href="#" class="log-tag" data-log-tag="${esc(l.tag)}">${hl(l.tag)}</a>: ` : ''}<span class="lv-${l.lvl}m">${hl(l.msg)}</span>`).join('\n');
  $('#log-count').textContent = `${shown.length} / ${logLines.length} ${L('lines', 'řádků')}` + (shown.length > last.length ? ` (${L('showing the last 2000', 'zobrazeno posledních 2000')})` : '');
  if (stick) box.scrollTop = box.scrollHeight;
}

/* Text for a file: full local date and time, level, tag. */
const logFileText = lines => lines.map(l => `${logTime(l.at, true)} ${l.lvl} ${l.tag ? l.tag + ': ' : ''}${l.msg}`).join('\n') + '\n';

async function pollLog() {
  if (route() !== 'system/diag' || logPaused || restarting) return;
  try {
    const { data, res } = await api('/api/logs?since=' + logSeq, { raw: true });
    logSeq = +res.headers.get('X-Log-Seq') || logSeq;
    if (data) {
      logParse(data.replace(/\x1b\[[0-9;]*m/g, ''));
      renderLog();
    }
  } catch (e) { /* retry next tick */ }
}
document.addEventListener('input', e => {
  if (e.target.id === 'log-filter') { logView.q = e.target.value; renderLog(); }
  if (e.target.id === 'zdev-filter' && z2m) renderZDevices([...zInfo.values()], z2m.now);
  if (e.target.id === 'cls-search') {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.cls-row').forEach(r => { r.style.display = !q || r.dataset.name.includes(q) ? 'flex' : 'none'; });
    document.querySelectorAll('#cls-tree details').forEach(d => { d.open = !!q && [...d.querySelectorAll('.cls-row')].some(r => r.style.display !== 'none'); });
  }
});

/* ---------------- loop ---------------- */

/* pages without form input, redrawn on every status poll */
const PASSIVE = ['overview', 'role', 'zigbee/info', 'zigbee/diag', 'zigbee/backups', 'system/info'];

function pageTitle() {
  const [s1, s2] = (sub || '').split('/');
  const sec = NAV.find(n => n.id === tab), s = sec.subs?.find(x => x.id === s1), t = s?.subs?.find(x => x.id === s2);
  const ro = perm(route()) === 1 ? `<div class="alert readonly-note" data-notr>${ic('eye-outline')}${L('Read only: your account cannot change this page.', 'Jen ke čtení: váš účet tuto stránku nemůže měnit.')}</div>` : '';
  return `<h2 class="page-title">${ic(t?.icon || s?.icon || sec.icon)}<span>${sec.label}</span>${s ? `<small>›</small><small>${s.label}</small>` : ''}${t ? `<small>›</small><small>${t.label}</small>` : ''}</h2>${ro}`;
}

function render(full) {
  if (!status) return;
  /* a page of a role that is not active (bookmark, role switched meanwhile): the first page that works */
  if (!pageEnabled(tab, sub)) {
    const fp = firstPage(NAV.find(n => n.id === tab));
    const any = NAV.find(n => !n.hidden && (n.subs ? firstPage(n) : perm(n.id) > 0));
    return go(fp ? `${tab}/${fp.id}` : any ? (any.subs ? `${any.id}/${firstPage(any).id}` : any.id) : 'profile', true);
  }
  if (navRole !== activeRole()) renderNav();
  renderHeader();
  const main = $('#main');
  /* Forms keep their input: only redraw passive pages on every poll. */
  const editing = document.activeElement?.matches?.('#main input, #main select');
  if (full || (PASSIVE.includes(route()) && !editing)) {
    if (full) renderNav();
    main.innerHTML = pageTitle() + views[route()]();
    if (perm(route()) === 1) main.querySelectorAll('button.primary, button.danger').forEach(b => { b.disabled = true; });
    if (tab === 'thread') { loadThread(); if (sub === 'settings') { loadDataset(false); loadThreadTxPower(); } if (sub === 'topology') loadTopology(); }
    if (route() === 'ha/mqtt') loadMqtt();
    if (route() === 'system/diag') renderLog();
    if (route() === 'system/netscan') loadNetscan();
    if (route() === 'system/lan') {
      loadLan();
      renderLanState();
      loadTraffic();
      if (!trafficTimer) trafficTimer = setInterval(loadTraffic, 2000);
    }
    if (route() === 'system/settings') loadHaFound();
    if (route().startsWith('system/users/')) loadUsersPage();
    if (route() === 'profile') loadProfile();
    if (route() === 'system/notify') loadNotifyAdmin();
    if (route() === 'zigbee/network') loadZigbeeNet(true);
    if (tab === 'sound') {
      loadSound(); loadSoundConfig().catch(err => toast('Error: ' + err.message));
      if (route() === 'sound/learn') loadLearn();
      if (!soundTimer) soundTimer = setInterval(() => { loadSound(); loadScoresAndLog(); loadLearn(); if (sndTick % 10 === 0 && sndCfg && !$('#ev-dlg').open) api('/api/sound/events').then(c => { sndCfg = c; renderEvents(); }).catch(() => {}); }, 1000);
    }
  } else if (tab === 'thread') {
    loadThread();
  }
}

let meTick = 0;
async function poll() {
  /* admins see new reset requests within half a minute */
  if (me && !me.open && me.role === 'admin' && ++meTick % 6 === 0) {
    api('/api/auth/me').then(m => { if (m.requests !== me.requests) { me = m; renderUser(); renderNav(); } else me = m; }).catch(() => {});
  }
  if (!restarting) {
    try { status = await api('/api/status'); render(false); } catch (e) { setTag('#hdr-role', 'bad', ic('close'), 'offline', L('Gateway', 'Brána'), [[L('State', 'Stav'), L('does not answer', 'neodpovídá')]]); }
  }
  setTimeout(poll, $('#busy-dlg').open ? 500 : status?.c6?.flash?.busy || status?.identify_s || status?.eth?.confirm_s ? 1000 : 5000);
}

uiReady = true;
renderPrefs();
async function loadMe() {
  try { me = await api('/api/auth/me'); } catch (e) { me = null; }
  renderPrefs();
  renderNav();
}
history.replaceState(null, '', '#' + route());
loadMe().then(poll).then(() => render(true));
setInterval(pollLog, 1500);
</script>
