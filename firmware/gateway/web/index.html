<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P4 Gateway</title>
<style>
:root {
  --bg: #f4f6f9; --panel: #ffffff; --panel-2: #f0f2f6; --text: #18202b; --muted: #5d6878;
  --border: #dde2ea; --accent: #2563eb; --accent-text: #ffffff; --ok: #138a4c; --warn: #b26a00;
  --bad: #c62828; --code: #eef1f6; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --panel: #171c23; --panel-2: #1e252e; --text: #e6eaf0; --muted: #96a1b0;
    --border: #2a323d; --accent: #4f8cff; --accent-text: #0b0e12; --ok: #34c77b; --warn: #f0a63a;
    --bad: #ff6b6b; --code: #10151b; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --panel: #171c23; --panel-2: #1e252e; --text: #e6eaf0; --muted: #96a1b0;
  --border: #2a323d; --accent: #4f8cff; --accent-text: #0b0e12; --ok: #34c77b; --warn: #f0a63a;
  --bad: #ff6b6b; --code: #10151b; --shadow: none; color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
.prefs select { padding: 3px 6px; font-size: 12px; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
/* Layout: header on top, section menu on the left (a drawer below 900 px), content on the right. */
header { position: sticky; top: 0; z-index: 20; height: 52px; background: var(--panel); border-bottom: 1px solid var(--border); }
.bar { height: 100%; padding: 0 16px; display: flex; align-items: center; gap: 12px; }
.brand { font-weight: 650; font-size: 16px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand small { color: var(--muted); font-weight: 400; }
.spacer { flex: 1; }
.mdi { width: 18px; height: 18px; fill: currentColor; flex: none; vertical-align: -4px; }
#menu-btn { display: none; background: none; border: 0; color: var(--text); padding: 6px; cursor: pointer; }
.layout { display: flex; align-items: flex-start; }
#side { position: sticky; top: 52px; flex: none; width: 236px; height: calc(100vh - 52px); overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--border); padding: 12px 10px 24px; }
#side a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted);
  text-decoration: none; white-space: nowrap; }
#side a:hover { background: var(--panel-2); color: var(--text); }
#side a.on { color: var(--text); font-weight: 600; }
#side a.cur { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
#side .subs { margin: 2px 0 6px 18px; padding-left: 10px; border-left: 1px solid var(--border); }
#side .subs a { padding: 6px 10px; font-size: 13px; }
#side .subs .mdi { width: 16px; height: 16px; }
#side .off { opacity: .55; }
main { flex: 1; min-width: 0; max-width: 1640px; padding: 18px 24px 40px; }
.page-title { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-size: 20px; font-weight: 650; }
.page-title .mdi { width: 24px; height: 24px; color: var(--accent); }
.page-title small { color: var(--muted); font-weight: 400; font-size: 15px; }
#scrim { display: none; }
@media (max-width: 900px) {
  #menu-btn { display: inline-flex; }
  #side { position: fixed; top: 52px; left: 0; z-index: 30; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  body.menu-open #side { transform: none; }
  body.menu-open #scrim { display: block; position: fixed; inset: 52px 0 0; z-index: 25; background: rgba(0,0,0,.35); }
  main { padding: 14px; }
  .brand small, #hdr-uptime { display: none; }
}
@media (max-width: 560px) { #hdr-eth, #hdr-role { display: none; } }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.grid > .wide { grid-column: 1 / -1; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 13px; text-transform: uppercase;
  letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.card h3 .mdi { color: var(--accent); }
/* explanation tooltips: an (i) after a label, shown on hover, focus or tap */
.tip { display: inline-flex; margin-left: 4px; color: var(--muted); cursor: help; vertical-align: middle; }
.tip .mdi { width: 14px; height: 14px; }
.tip:hover, .tip:focus { color: var(--accent); outline: none; }
#tipbox { position: fixed; z-index: 50; max-width: 340px; padding: 8px 11px; border-radius: 8px; font-size: 13px; line-height: 1.4;
  background: var(--text); color: var(--bg); box-shadow: 0 4px 16px rgba(0,0,0,.25); pointer-events: none; display: none; }
.card + .card, .grid + .card, .card + .grid, main > * + *, #thread-status > * + * { margin-top: 14px; }
.grid > .card { margin-top: 0; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 5px 16px; margin: 0; }
dt { color: var(--muted); white-space: nowrap; }
dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px;
  background: var(--panel-2); border: 1px solid var(--border); font-size: 12px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.ok-text { color: var(--ok); } .warn-text { color: var(--warn); } .bad-text { color: var(--bad); }
.muted { color: var(--muted); }
.alert { border-radius: 8px; padding: 10px 12px; border: 1px solid var(--warn); color: var(--text);
  background: color-mix(in srgb, var(--warn) 10%, var(--panel)); margin-bottom: 14px; }
.alert.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--panel)); }
button.btn, a.btn, label.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--text); padding: 6px 12px; border-radius: 7px; font: inherit;
  cursor: pointer; text-decoration: none; }
button.btn:hover, label.btn:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row + .row { margin-top: 8px; }
input[type=text], input[type=password], input[type=number], textarea, select {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 7px;
  padding: 6px 9px; font: inherit; min-width: 0; }
textarea { width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
label.field { display: grid; gap: 4px; margin-bottom: 10px; }
label.field span { color: var(--muted); font-size: 12px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
pre { background: var(--code); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  overflow: auto; margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
.log { height: 420px; white-space: pre; overflow: auto; }
.roles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.role { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
.role.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.role h4 { margin: 0; font-size: 15px; }
.role p { margin: 0; color: var(--muted); flex: 1; }
.progress { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--border); }
.meter { display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.meter .progress { width: 110px; height: 7px; }
.meter .progress > span { display: block; height: 100%; background: var(--ok); }
.meter .progress > span.warn { background: var(--warn); } .meter .progress > span.bad { background: var(--bad); }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
ol.steps { padding-left: 20px; margin: 6px 0; } ol.steps li { margin: 6px 0; }
.hidden { display: none !important; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
#toast.show { opacity: .95; }
dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text); max-width: 420px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0,0,0,.45); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <button id="menu-btn" title="Menu"></button>
    <div class="brand"><span id="brand-icon"></span>P4 Gateway <small id="hdr-host"></small></div>
    <span class="pill" id="hdr-role"><span class="dot"></span><span>…</span></span>
    <span class="pill" id="hdr-eth"><span class="dot"></span><span>Ethernet</span></span>
    <div class="spacer"></div>
    <span class="muted" id="hdr-uptime"></span>
    <span class="prefs row">
      <select id="pref-lang" title="Language / Jazyk" data-notr><option value="cs">CZ</option><option value="en">EN</option></select>
      <select id="pref-theme" title="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
    </span>
  </div>
</header>
<div class="layout">
  <nav id="side"></nav>
  <div id="scrim"></div>
  <main id="main"></main>
</div>
<div id="toast"></div>
<div id="tipbox" role="tooltip"></div>
<dialog id="login">
  <form method="dialog" id="login-form">
    <h3 style="margin-top:0">Sign in</h3>
    <p class="muted">The gateway is password protected (user <code>admin</code>).</p>
    <label class="field"><span>Password</span><input type="password" id="login-pass" autocomplete="current-password"></label>
    <div class="row"><button class="btn primary" value="ok">Sign in</button></div>
  </form>
</dialog>
<dialog id="ev-dlg" style="max-width:640px">
  <form method="dialog" id="ev-form">
    <h3 style="margin-top:0" id="ev-title">Event</h3>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <label class="field"><span>ID (entity name in HA)</span><input type="text" id="ev-id" pattern="[a-z0-9_]{1,23}" required></label>
      <label class="field"><span>Name</span><input type="text" id="ev-name" maxlength="47"></label>
      <label class="field"><span>Czech name (web UI and HA attribute only)</span><input type="text" id="ev-name-cs" maxlength="47"></label>
      <label class="field"><span>Kind</span><select id="ev-kind"><option value="impulse">impulse (one event per occurrence)</option><option value="continuous">continuous (on while it lasts)</option></select></label>
      <label class="field"><span>Device class</span><select id="ev-dc"><option value="">none</option><option value="doorbell">doorbell</option></select></label>
      <label class="field"><span>Threshold <b id="ev-thr-v"></b></span><input type="range" id="ev-thr" min="0.1" max="1" step="0.05"></label>
      <label class="field"><span>Windows to start (0.48 s each)</span><input type="number" id="ev-win" min="1" max="20"></label>
      <label class="field"><span>Hold after last hit (s)</span><input type="number" id="ev-hold" min="1" max="600"></label>
      <label class="field"><span>Cooldown between events (s)</span><input type="number" id="ev-cool" min="0" max="3600"></label>
    </div>
    <label class="field"><span>Sounds that trigger it</span><div id="ev-classes" class="row"></div>
      <input type="text" id="ev-add" list="class-names" placeholder="add a sound (type to search)"></label>
    <label class="field"><span>Ignore while any of these is heard (e.g. Television for speech)</span><div id="ev-suppress" class="row"></div>
      <input type="text" id="ev-add-sup" list="class-names" placeholder="add a sound"></label>
    <datalist id="class-names"></datalist>
    <div class="row"><button class="btn primary" value="save">Save</button><button class="btn" value="cancel" formnovalidate>Cancel</button></div>
  </form>
</dialog>
<dialog id="copy-dlg" style="max-width:640px">
  <form method="dialog">
    <h3 style="margin-top:0" id="copy-title"></h3>
    <textarea id="copy-text" rows="12" readonly></textarea>
    <p class="muted" id="copy-hint"></p>
    <div class="row"><button class="btn primary" type="button" id="copy-btn">Copy</button><button class="btn" value="close">Close</button></div>
  </form>
</dialog>
<dialog id="confirm">
  <form method="dialog">
    <h3 style="margin-top:0" id="confirm-title"></h3>
    <p id="confirm-text"></p>
    <div class="row"><button class="btn primary" value="yes">Continue</button><button class="btn" value="no">Cancel</button></div>
  </form>
</dialog>

  [/^(.+) stored,$/, '$1 uloženo,'], [/^(.+) ms avg, (.+) ms max, last (.+) ms$/, 'průměr $1 ms, max $2 ms, poslední $3 ms'],
  [/^(.+) free, min (.+)$/, '$1 volné, min $2'], [/^(.+) \/ (.+), min (.+)$/, '$1 / $2, min $3'], [/^Run only above (.+) dBFS$/, 'Spouštět jen nad $1 dBFS'],
];
let lang = (navigator.language || '').toLowerCase().startsWith('cs') ? 'cs' : 'en';
try { lang = localStorage.getItem('lang') || lang; } catch (e) { /* storage blocked */ }
const original = new WeakMap();

function translateText(text) {
  const key = text.trim().replace(/\s+/g, ' ');
  if (!key) return null;
  let out = CS[key];
  if (out === undefined) {
    for (const [rx, rep] of CS_RX) {
      if (rx.test(key)) { out = key.replace(rx, rep); break; }
    }
  }
  if (out === undefined) return null;
  return text.replace(text.trim(), out);
}

function skip(el) {
  return !el || el.closest('script,style,textarea,pre,code,[data-notr]');
}

function translateTree(root) {
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    if (skip(node.parentElement)) continue;
    const base = original.has(node) && original.get(node).cs === node.nodeValue ? original.get(node).en : node.nodeValue;
    const out = lang === 'cs' ? translateText(base) : null;
    const want = out ?? base;
    if (out !== null) original.set(node, { en: base, cs: out });
    if (node.nodeValue !== want) node.nodeValue = want;
  }
  const els = root.querySelectorAll ? root.querySelectorAll('[placeholder],[title]') : [];
  for (const el of els) {
    if (skip(el)) continue;
    for (const attr of ['placeholder', 'title']) {
      if (!el.hasAttribute(attr)) continue;
      const en = el.dataset['en' + attr] ?? el.getAttribute(attr);
      el.dataset['en' + attr] = en;
      const out = lang === 'cs' ? translateText(en) : null;
      const want = out ?? en;
      if (el.getAttribute(attr) !== want) el.setAttribute(attr, want);
    }
  }
}

const i18nObserver = new MutationObserver(records => {
  for (const r of records) {
    if (r.type === 'characterData') translateTree(r.target.parentElement);
    else r.addedNodes.forEach(n => translateTree(n.nodeType === 3 ? n.parentElement : n));
  }
});

function setLang(l) {
  lang = l;
  try { localStorage.setItem('lang', l); } catch (e) { /* storage blocked */ }
  document.documentElement.lang = l;
  $('#pref-lang').value = l;
  translateTree(document.body);
}

function setTheme(t) {
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('theme', t); } catch (e) { /* storage blocked */ }
  $('#pref-theme').value = t;
}

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (auth) headers.Authorization = 'Basic ' + auth;
  if (opts.json !== undefined) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  const res = await fetch(path, { method: opts.method || (opts.body ? 'POST' : 'GET'), headers, body: opts.body });
  if (res.status === 401) { await login(); return api(path, opts); }
  const type = res.headers.get('Content-Type') || '';
  const data = type.includes('json') ? await res.json() : await res.text();
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return opts.raw ? { data, res } : data;
}

let loginPromise = null;
function login() {
  if (loginPromise) return loginPromise;
  loginPromise = new Promise(resolve => {
    const dlg = $('#login');
    dlg.onclose = () => {
      auth = btoa('admin:' + $('#login-pass').value);
      try { sessionStorage.setItem('auth', auth); } catch (e) { /* storage blocked */ }
      loginPromise = null;
      resolve();
    };
    dlg.showModal();
  });
  return loginPromise;
}

function confirmDialog(title, text) {
  return new Promise(resolve => {
    const dlg = $('#confirm');
    $('#confirm-title').textContent = title;
    $('#confirm-text').textContent = text;
    dlg.onclose = () => resolve(dlg.returnValue === 'yes');
    dlg.returnValue = 'no';
    dlg.showModal();
  });
}

/* navigator.clipboard exists only in secure contexts (HTTPS, localhost); the gateway serves
 * plain HTTP, so fall back to selecting a textarea and execCommand('copy'). */
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back */ }
  }
  const ta = $('#copy-text');
  ta.value = text;
  ta.focus();
  ta.select();
  try { return document.execCommand('copy'); } catch (e) { return false; }
}

async function showCopy(title, text, hint) {
  $('#copy-title').textContent = title;
  $('#copy-text').value = text;
  $('#copy-hint').textContent = hint || '';
  $('#copy-dlg').showModal();
  const ok = await copyText(text);
  toast(ok ? 'Copied to the clipboard' : 'Select the text and copy it (Ctrl/Cmd+C)');
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 3500);
}

const OLD_ROUTES = { tools: 'system/diag', thread: 'thread/info', zigbee: 'zigbee/info', sound: 'sound/live', ha: 'ha/guide', system: 'system/info' };

let tab = 'overview', sub = '';
function parseRoute(route) {
  route = OLD_ROUTES[route] || route;
  const [t, s] = (route || '').split('/');
  const sec = NAV.find(n => n.id === t) || NAV[0];
  return [sec.id, sec.subs ? (sec.subs.find(x => x.id === s) || sec.subs[0]).id : ''];
}
function route() { return sub ? `${tab}/${sub}` : tab; }
function sectionActive(id) { return id === 'thread' ? isThread() : id === 'zigbee' ? isZigbee() : true; }

function renderNav() {
  $('#side').innerHTML = NAV.map(n => {

    const subs = n.subs && n.id === tab ? `<div class="subs">${n.subs.map(x =>
      `<a href="#${n.id}/${x.id}" data-route="${n.id}/${x.id}" class="${x.id === sub ? 'cur' : ''}">${ic(x.icon)}<span>${x.label}</span></a>`).join('')}</div>` : '';
    return link + subs;
  }).join('');
}

function go(r, replace) {
  [tab, sub] = parseRoute(r);
  if (location.hash.slice(1) !== route()) {
    if (replace) history.replaceState(null, '', '#' + route()); else location.hash = route();
  }
  try { localStorage.setItem('tab', route()); } catch (err) { /* storage blocked */ }
  document.body.classList.remove('menu-open');
  renderNav();
  render(true);
}

{

/* tooltip box shared by all (i) icons: hover or keyboard focus shows it, a tap toggles it */
function showTip(el) {
  const t = TIPS[el.dataset.tip];
  if (!t) return;
  const box = $('#tipbox');
  box.textContent = lang === 'cs' ? t[1] : t[0];
  box.style.display = 'block';
  const r = el.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';

}
const hideTip = () => { $('#tipbox').style.display = 'none'; };
document.addEventListener('mouseover', e => { const el = e.target.closest('.tip'); if (el) showTip(el); });

function renderHeader() {
  if (!status) return;
  $('#hdr-host').textContent = status.hostname;
  const r = status.role, maint = r.maintenance;
  $('#hdr-role').innerHTML = `<span class="dot ${maint ? 'bad' : 'ok'}"></span><span>${esc(ROLES[r.active]?.name || 'Maintenance')}</span>`;
  const e = status.eth;
  $('#hdr-eth').innerHTML = `<span class="dot ${e.link ? 'ok' : 'bad'}"></span><span>${e.link ? (e.speed || '') + ' Mb/s' : 'link down'}</span>`;
  $('#hdr-uptime').textContent = 'up ' + fmtUptime(status.uptime_s);
}

function maintenanceBanner() {
  const r = status.role;
  const flash = status.c6.flash;
  let html = '';
  if (flash.busy) {
    html += `<div class="alert"><b>Flashing the C6:</b> ${esc(flash.stage)}<div class="progress" style="margin-top:8px"><div style="width:${flash.percent}%"></div></div></div>`;
  }
  if (r.maintenance) html += `<div class="alert bad"><b>Maintenance mode:</b> ${esc(r.maintenance)}</div>`;
  if (!status.auth) html += `<div class="alert">No password set. Anyone on the LAN can switch roles and read the Thread network key. Set one under <b>System</b>.</div>`;
  return html;
}

views.role = () => {
  const active = activeRole(), desired = status.role.desired;
  const esphome = status.slots.find(x => x.label === 'esphome');
  const cards = Object.entries(ROLES).map(([id, r]) => {
    const disabled = id === 'esphome' && !esphome?.version;
    return `<div class="role ${id === active ? 'active' : ''}">
      <div class="row"><span class="pill">${ic(r.icon)}${r.group}</span>${id === active ? pill('ok', 'active') : id === desired ? pill('warn', 'selected') : ''}</div>

};

async function loadThread() {
  const box = $('#thread-status');
  if (!box) return;
  try {
    const t = await api('/api/thread/status');
    const br = t.border_router;
    const role = t.role || 'disabled';
    const roleCls = ['leader', 'router'].includes(role) ? 'ok' : role === 'child' ? 'warn' : 'bad';
    const typeTip = v => `${esc(v)}${tip('type:' + v)}`;
    if (sub === 'info') {
      box.innerHTML = `<div class="grid">
      <div class="card">${h3('access-point-network', 'Thread')}${dl([
        ['Mode', esc(t.mode === 'border_router' ? 'Border router' : 'Router'), 'Thread mode'], ['Phase', esc(t.phase)],
        ['Device role', pill(roleCls, role) + tip('type:' + role)], ['Network', esc(t.network_name)], ['Channel', t.channel],
        ['PAN ID', esc(t.pan_id)], ['Ext PAN ID', esc(t.ext_pan_id)], ['RLOC16', esc(t.rloc16)],
        ['Partition', t.partition_id], ['Leader router', t.leader_router_id], ['Mesh-local prefix', esc(t.mesh_local_prefix)]])}</div>
      ${br ? `<div class="card">${h3('router-network', 'Border routing')}${dl([
        ['Routing manager', pill(br.routing === 'running' ? 'ok' : 'warn', br.routing)],
        ['OMR prefix', esc(br.omr_prefix)], ['On-link prefix', esc(br.on_link_prefix)],
        ['NAT64', pill(br.nat64 === 'active' ? 'ok' : 'warn', br.nat64)],
        ['Border agent', br.border_agent ? pill('ok', 'active') : pill('warn', 'inactive')],
        ['SRP server', pill(br.srp_server === 'running' ? 'ok' : 'warn', br.srp_server)],
        ['SRP hosts / services', `${br.srp_hosts} / ${br.srp_services}`], ['REST API', `http://${esc(ip())}:${t.rest_port}`]])}</div>` : ''}
      </div>`;
    } else if (sub === 'topology') {
      box.innerHTML = `<div class="grid">
      <div class="card wide">${h3('lan-connect', `Neighbors (${(t.neighbors || []).length})`)}<div class="table-wrap"><table>
        <tr>${['Type', 'RLOC16', 'Ext address', 'Avg RSSI', 'Last RSSI', 'LQI in', 'Age', 'Frame err'].map(th).join('')}</tr>
        ${(t.neighbors || []).map(n => `<tr><td>${typeTip(n.type)}</td><td>${esc(n.rloc16)}</td><td><code>${esc(n.ext_address)}</code></td>
          <td class="${n.avg_rssi < -85 ? 'bad-text' : n.avg_rssi < -75 ? 'warn-text' : ''}">${n.avg_rssi} dBm</td><td>${n.last_rssi} dBm</td>
          <td>${n.lqi_in}</td><td>${n.age_s} s</td><td>${n.frame_error_pct.toFixed(1)} %</td></tr>`).join('') || '<tr><td colspan="8" class="muted">none</td></tr>'}
      </table></div></div>
      <div class="card wide">${h3('router-wireless', `Routers (${(t.routers || []).length})`)}<div class="table-wrap"><table>
        <tr>${['ID', 'RLOC16', 'Next hop', 'Path cost', 'LQ in / out', 'Link'].map(th).join('')}</tr>
        ${(t.routers || []).map(r => `<tr><td>${r.id}</td><td>${esc(r.rloc16)}</td><td>${r.next_hop}</td><td>${r.path_cost}</td>
          <td>${r.lq_in} / ${r.lq_out}</td><td>${r.link ? pill('ok', 'yes') : '—'}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">none</td></tr>'}
      </table></div></div></div>`;
    } else if (sub === 'diag') {
      box.innerHTML = `<div class="grid">
      <div class="card">${h3('chip', 'Radio co-processor (RCP)')}${dl([['RCP', esc(t.rcp_version)], ['RCP failures', t.rcp_failures], ['Phase', esc(t.phase)]])}</div>

  } catch (e) {
    box.innerHTML = `<div class="alert">${esc(e.message)}</div>`;

let datasetTlvs = '';
async function loadDataset(reveal) {
  const box = $('#dataset');
  if (!box) return;
  try {
    const d = await api('/api/thread/dataset' + (reveal ? '?reveal=1' : ''));
    if (d.tlvs) datasetTlvs = d.tlvs;
    box.innerHTML = dl([['Network name', esc(d.network_name)], ['Channel', d.channel], ['PAN ID', esc(d.pan_id)],
      ['Ext PAN ID', esc(d.ext_pan_id)], ['Network key', `<code>${esc(d.network_key)}</code>`],
      ['TLVs', d.tlvs ? `<code style="word-break:break-all">${esc(d.tlvs)}</code>` : '<span class="muted">hidden</span>']]);
  } catch (e) {
    box.innerHTML = `<span class="warn-text">${esc(e.message)}</span>`;
  }
}

async function runCli(cmd) {
  const out = $('#cli-out');
  out.textContent = '> ' + cmd + '\n…';
  try {
    const r = await api('/api/thread/cli', { json: { cmd, wait_ms: +$('#cli-wait').value || 800 } });
    out.textContent = '> ' + cmd + '\n' + (r.output || '(no output)');
  } catch (e) {
    out.textContent = '> ' + cmd + '\nerror: ' + e.message;
  }
}

/* Czech name only for display; ids, HA entities and automations keep the English name. */
const evName = e => (lang === 'cs' && e.name_cs) || e.name;

/* "Heard now": in Czech, a class that belongs to an event is labelled with the event's Czech name. */
function heardName(t) {
  const names = [...new Set((sndCfg?.events || []).filter(e => e.enabled && e.name_cs && e.classes.includes(t.index)).map(evName))];
  return lang === 'cs' && names.length ? `${esc(names.join(', '))} <span class="muted">${esc(t.name)}</span>` : esc(t.name);

function renderEvents() {
  if (!$('#ev-table')) return;
  const rows = sndCfg.events.map((e, i) => `<tr>
    <td><input type="checkbox" data-ev-toggle="${i}" ${e.enabled ? 'checked' : ''}></td>
    <td data-notr><b>${esc(evName(e))}</b><br><span class="muted">${evName(e) !== e.name ? esc(e.name) + ' · ' : ''}${esc(e.id)}</span></td>
    <td>${e.kind}</td><td>${e.threshold}</td>
    <td data-notr title="${esc(e.classes.map(clsName).join(', '))}">${e.classes.length}</td>
    <td>${e.active ? pill('ok', 'now') : ''}</td><td>${e.count || 0}</td>

    <td><button class="btn" data-ev-edit="${i}">${ic('pencil-outline')}Edit</button> <button class="btn" data-ev-yaml="${i}">${ic('home-assistant')}HA automation</button> <button class="btn danger" data-ev-del="${i}">${ic('delete-outline')}Delete</button></td></tr>`).join('');

}

function renderTree() {
  const tops = new Map();
  sndClasses.forEach(([i, name, top, group]) => {
    if (!tops.has(top)) tops.set(top, new Map());
    const g = tops.get(top);
    if (!g.has(group)) g.set(group, []);
    g.get(group).push([i, name]);
  });
  const row = ([i, name]) => `<label class="cls-row" data-name="${esc(name.toLowerCase())}" style="display:flex;gap:8px;align-items:center;padding:2px 0">
    <input type="checkbox" data-cls="${i}" ${sndExclude.has(i) ? '' : 'checked'}><span style="flex:1" data-notr>${esc(name)}</span>
    <span class="progress" style="width:80px;height:6px"><div id="cs-${i}"></div></span></label>`;
  let html = '';
  for (const [top, groups] of tops) {
    const n = [...groups.values()].reduce((a, v) => a + v.length, 0);
    html += `<details class="cls-top"><summary><b>${esc(top)}</b> <span class="muted">${n}</span> <button class="btn" data-cls-all="${esc(top)}">all</button> <button class="btn" data-cls-none="${esc(top)}">none</button></summary><div style="padding-left:16px">`;
    for (const [group, items] of groups) {
      html += group === '-' ? items.map(row).join('') : `<details><summary><span data-notr>${esc(group)}</span> <span class="muted">${items.length}</span></summary><div style="padding-left:16px">${items.map(row).join('')}</div></details>`;
    }
    html += '</div></details>';
  }
  $('#cls-tree').innerHTML = html;
  $('#cls-tree').dataset.built = '1';
  updateClsSummary();
}

function updateClsSummary() {
  if (!$('#cls-summary')) return;
  $('#cls-summary').textContent = `${521 - sndExclude.size} reported, ${sndExclude.size} ignored${sndDirty ? ' (unsaved)' : ''}`;
}

  } catch (e) { /* ignore */ }

async function putEvents(cfg) {
  sndCfg = await api('/api/sound/events', { method: 'PUT', body: JSON.stringify({ preset: 'custom', exclude: [...sndExclude], events: cfg.events.map(({ active, count, last_ago_s, ...e }) => e) }), headers: { 'Content-Type': 'application/json' } });
  sndDirty = false;
  sndExclude = new Set(sndCfg.exclude);
  renderEvents();
  updateClsSummary();
  toast('Saved, Home Assistant entities updated');
}

function chips(id, list) {
  $('#' + id).innerHTML = list.map(i => `<span class="pill" data-notr>${esc(clsName(i))} <a href="#" data-chip-del="${id}:${i}">×</a></span>`).join('') || '<span class="muted">none</span>';
}

function openEditor(idx, template) {
  editIdx = idx;

  $('#ev-title').textContent = idx >= 0 ? 'Edit event' : 'New event';
  $('#ev-id').value = editEv.id; $('#ev-id').readOnly = idx >= 0;
  $('#ev-name').value = editEv.name; $('#ev-name-cs').value = editEv.name_cs || ''; $('#ev-kind').value = editEv.kind; $('#ev-dc').value = editEv.device_class || '';
  $('#ev-thr').value = editEv.threshold; $('#ev-thr-v').textContent = editEv.threshold;
  $('#ev-win').value = editEv.windows; $('#ev-hold').value = editEv.hold_s; $('#ev-cool').value = editEv.cooldown_s;

$('#ev-dlg').addEventListener('close', async () => {
  if ($('#ev-dlg').returnValue !== 'save') return;
  Object.assign(editEv, { id: $('#ev-id').value.trim(), name: $('#ev-name').value.trim(), name_cs: $('#ev-name-cs').value.trim(), kind: $('#ev-kind').value,
    device_class: $('#ev-dc').value, threshold: +$('#ev-thr').value, windows: +$('#ev-win').value,
    hold_s: +$('#ev-hold').value, cooldown_s: +$('#ev-cool').value });
  if (!editEv.device_class) delete editEv.device_class;
  const events = sndCfg.events.slice();
  if (editIdx >= 0) events[editIdx] = editEv; else events.push(editEv);
  try { await putEvents({ events }); } catch (err) { toast('Error: ' + err.message); }
});

function addChip(inputId, listKey, chipId) {
  const name = $('#' + inputId).value;
  const c = sndClasses.find(x => x[1] === name);
  if (!c) return;
  if (!editEv[listKey].includes(c[0])) editEv[listKey].push(c[0]);
  $('#' + inputId).value = '';
  chips(chipId, editEv[listKey]);
}

function automationYaml(e) {
  const host = status.hostname.replace(/-/g, '_');
  const trig = e.kind === 'continuous'
    ? `  - trigger: state\n    entity_id: binary_sensor.${host}_snd_${e.id}_active\n    to: "on"\n    for: "00:00:30"`
    : `  - trigger: state\n    entity_id: event.${host}_snd_${e.id}`;
  return `alias: "Sound: ${e.name}"\ntriggers:\n${trig}\nconditions: []\nactions:\n  - action: notify.notify\n    data:\n      message: "${e.name}: {{ state_attr('event.${host}_snd_${e.id}', 'class') }}"\nmode: single\n`;
}
async function loadSound() {
  if (tab !== 'sound') { clearInterval(soundTimer); soundTimer = null; return; }
  if (!$('#snd-en')) return;
  let st;
  try { st = await api('/api/sound/status'); } catch (e) { return; }
  const set = (id, fn) => { const el = $('#' + id); if (el && document.activeElement !== el) fn(el); };
  set('snd-en', el => { el.checked = st.enabled; });
  set('snd-ai', el => { el.checked = st.inference.enabled; });
  set('snd-gain', el => { el.value = st.gain_db; });
  set('snd-gate', el => { el.value = st.gate_db; });
  $('#snd-gain-v').textContent = $('#snd-gain').value;
  $('#snd-gate-v').textContent = $('#snd-gate').value;
  $('#snd-run').innerHTML = st.running ? pill('ok', 'capturing') : st.error ? pill('bad', st.error) : pill('', st.enabled ? 'restart to start' : 'off');
  if (st.running) {
    $('#snd-meter').style.width = Math.max(0, Math.min(100, (st.level_db + 90) / 90 * 100)) + '%';
    $('#snd-levels').textContent = `level ${st.level_db} dBFS, peak ${st.peak_db}, noise floor ${st.floor_db}, ${st.read_errors} read errors`;
  }
  const m = st.model, inf = st.inference;
  $('#snd-model').innerHTML = dl([
    ['Model', m.stored_bytes ? `${fmtBytes(m.stored_bytes)} stored, ${m.loaded ? pill('ok', 'loaded') : pill('warn', 'not loaded')}` : pill('bad', 'none, upload yamnet_p4.espdl')],
    ['Load time', m.load_ms ? m.load_ms + ' ms' : ''], ['Error', esc(m.error)],
    ['Inference', inf.runs ? `${inf.avg_ms} ms avg, ${inf.max_ms} ms max, last ${inf.last_ms} ms` : ''],
    ['CPU (core 1)', inf.runs ? inf.cpu_pct + ' %' : ''],
    ['Runs / skipped quiet', `${inf.runs} / ${inf.skipped_quiet}`]]);
  $('#snd-top').innerHTML = inf.top ? `<table>${inf.top.map(t => `<tr><td data-notr>${heardName(t)}</td><td style="width:50%"><div class="progress"><div style="width:${t.score * 100}%"></div></div></td><td>${(t.score * 100).toFixed(0)} %</td></tr>`).join('')}</table>
    <p class="muted">${inf.top_age_s.toFixed(0)} s ago</p>` : 'Recognition is off or nothing above the gate yet.';
}

async function soundConfig(body) {
  const r = await api('/api/sound/config', { json: body });
  if (r.restart_required && await confirmDialog('Restart now?', 'The microphone setting takes effect after a restart.')) {
    await api('/api/reboot', { method: 'POST' });
    waitForRestart();
  }
  loadSound();
}

document.addEventListener('change', e => {
  const id = e.target.id;
  if (e.target.dataset.cls !== undefined) {
    const i = +e.target.dataset.cls;
    if (e.target.checked) sndExclude.delete(i); else sndExclude.add(i);
    sndDirty = true; updateClsSummary(); return;
  }
  if (e.target.dataset.evToggle !== undefined) {
    const events = sndCfg.events.slice();
    events[+e.target.dataset.evToggle].enabled = e.target.checked;
    putEvents({ events }).catch(err => toast('Error: ' + err.message));
    return;
  }
  if (id === 'ev-add') { addChip('ev-add', 'classes', 'ev-classes'); return; }
  if (id === 'ev-add-sup') { addChip('ev-add-sup', 'suppress', 'ev-suppress'); return; }
  if (id === 'ev-thr') { $('#ev-thr-v').textContent = e.target.value; return; }
  if (id === 'ev-import') {
    const f = e.target.files[0];
    if (f) f.text().then(t => { const c = JSON.parse(t); sndExclude = new Set(c.exclude || []); sndDirty = false; return putEvents(c); }).then(() => renderTree()).catch(err => toast('Error: ' + err.message));
    e.target.value = '';
    return;
  }
  if (id === 'snd-en') soundConfig({ enabled: e.target.checked }).catch(err => toast('Error: ' + err.message));
  else if (id === 'snd-ai') soundConfig({ inference: e.target.checked }).catch(err => toast('Error: ' + err.message));
  else if (id === 'snd-gain') soundConfig({ gain_db: +e.target.value }).catch(err => toast('Error: ' + err.message));
  else if (id === 'snd-gate') soundConfig({ gate_db: +e.target.value }).catch(err => toast('Error: ' + err.message));
});

    <div class="card">${h3('developer-board', 'ESP32-P4')}${dl([
      ['Chip revision', rev(s.chip_revision)], ['CPU', hw.cores ? `${hw.cores} × ${hw.cpu_mhz} MHz` : ''], ['CPU load', cpuLoad(hw)],
      ['Tasks', hw.tasks], ['Temperature', temp(s)], ['Flash', hw.flash_size ? fmtBytes(hw.flash_size) : ''],
      ['Base MAC', esc(hw.mac_base)], ['Uptime', fmtUptime(s.uptime_s)], ['Last reset', esc(s.reset_reason)]])}</div>
    <div class="card">${h3('memory', 'Memory')}${dl([
      ['Heap (internal)', `${fmtBytes(h.internal_free)} free, min ${fmtBytes(h.internal_min)}`],
      ['Internal used', hw.internal_total ? meter(used(h.internal_free, hw.internal_total), 80, 92) : ''],
      ['Largest block', fmtBytes(h.internal_largest)],
      ['PSRAM free', hw.psram_size ? `${fmtBytes(h.psram_free)} / ${fmtBytes(hw.psram_size)}, min ${fmtBytes(hw.psram_min)}` : fmtBytes(h.psram_free)],
      ['PSRAM used', hw.psram_size ? meter(used(h.psram_free, hw.psram_size), 80, 92) : ''],
      ['NVS', hw.nvs ? `${hw.nvs.used} / ${hw.nvs.total} entries, ${hw.nvs.namespaces} namespaces` : '']])}</div>
    <div class="card">${h3('package-variant', 'Firmware')}${dl([
      ['Firmware', esc(s.version)], ['Built', esc(`${s.built} ${s.built_time || ''}`), 'Build date'], ['ESP-IDF', esc(s.idf)],
      ['App slot', esc(hw.app_slot)], ['ELF SHA-256', hw.elf_sha256 ? `<code>${esc(hw.elf_sha256)}</code>` : '']])}</div>
    <div class="card">${h3('chip', 'ESP32-C6 radio')}${dl(c6Rows(s, true))}</div>
  </div>`;
};

views['system/firmware'] = () => {
  const upload = (id, title, hint) => `<div class="card">${title}<p class="muted">${hint}</p>
    <div class="row"><input type="file" id="${id}-file"><button class="btn primary" data-upload="${id}">${ic('upload')}Upload</button></div>
    <div class="progress hidden" id="${id}-prog" style="margin-top:10px"><div></div></div></div>`;
  return maintenanceBanner() + `<div class="grid">
    ${upload('gateway', h3('developer-board', 'Gateway firmware'), 'p4gw.bin, written to the inactive slot; rolls back automatically if it does not start.')}
    ${upload('esphome', h3('bluetooth', 'ESPHome image'), 'firmware.ota.bin of the ESPHome BLE proxy build for this board.')}
    ${upload('c6fw', h3('chip', 'C6 firmware bundle'), 'c6fw.bin from scripts/build_all.sh. The C6 is reflashed on the next start if its image changed.')}
  </div>`;
};

views['system/settings'] = () => `<div class="grid"><div class="card">${h3('cog-outline', 'Settings')}
    <label class="field"><span>Hostname (restart to apply)</span><input type="text" id="set-host" value="${esc(status.hostname)}"></label>
    <label class="field"><span>New web UI password (user admin)</span><input type="password" id="set-pass" autocomplete="new-password"></label>
    <div class="row"><button class="btn primary" id="set-save">${ic('check')}Save</button>
      <button class="btn danger" id="set-nopass" ${status.auth ? '' : 'disabled'}>${ic('lock-outline')}Remove password</button></div></div></div>`;

views['system/maint'] = () => maintenanceBanner() + `<div class="grid"><div class="card">${h3('wrench-outline', 'Maintenance')}
    <div class="row"><button class="btn" id="sys-reboot">${ic('restart')}Restart</button>${tip('Restart')}</div>
    <div class="row"><button class="btn danger" id="sys-reflash">${ic('chip')}Reflash C6 now</button>${tip('Reflash C6 now')}</div>
    <div class="row"><button class="btn" id="c6-backup" ${activeRole() === 'none' ? '' : 'disabled'}>${ic('backup-restore')}Back up C6 flash</button>${tip('Back up C6 flash')}</div>
    <p class="muted">Reflash rewrites the C6 with the image of the current role on the next start (use after an RCP or NCP failure).
    The C6 backup reads its whole flash over JP1 (about 2 minutes) and works only in maintenance mode. Keep the first backup:
    it is the only copy of the factory esp-hosted firmware.</p></div></div>`;

/* ---------------- actions ---------------- */

document.addEventListener('click', async e => {
  const t = e.target.closest('button');
  if (!t) return;
  try {
    if (t.dataset.role) {
      const r = ROLES[t.dataset.role];
      if (!await confirmDialog('Switch to ' + r.name + '?', 'The gateway restarts and may reflash the C6. Devices on the current network go offline until you switch back.')) return;
      try {
        await api('/api/role', { json: { role: t.dataset.role } });
      } catch (err) {
        if (err.message !== 'c6_backup_required') throw err;
        if (!await confirmDialog('No C6 backup yet', 'This role overwrites the factory firmware of the C6, which cannot be downloaded again. Cancel and use System → Back up C6 flash first (needs the JP1 jumpers), or continue without a backup.')) {
          go('system/maint');
          return;
        }
        await api('/api/role', { json: { role: t.dataset.role, skip_backup: true } });
      }
      toast('Switching, the page reconnects automatically');
      waitForRestart();
    } else if (t.dataset.cli) {
      runCli(t.dataset.cli);
    } else if (t.id === 'cli-run') {
      const cmd = $('#cli-cmd').value.trim();
      if (cmd) runCli(cmd);
    } else if (t.id === 'ds-reveal') {
      loadDataset(true);
    } else if (t.id === 'ds-copy') {
      if (!datasetTlvs) await loadDataset(true);
      await showCopy('Thread dataset TLVs', datasetTlvs, 'Contains the network key, keep it private.');
    } else if (t.id === 'ds-apply') {
      const tlvs = $('#ds-tlvs').value.replace(/\s+/g, '');
      if (!tlvs || !await confirmDialog('Apply dataset?', 'The gateway leaves its current Thread network and joins the one in the dataset.')) return;
      const r = await api('/api/thread/dataset', { json: { tlvs } });
      toast('Joining ' + r.network_name);
      loadDataset(false);
    } else if (t.id === 'zb-reset') {
      if (!await confirmDialog('Reset the C6?', 'The Zigbee host loses its connection and has to reinitialise the coordinator.')) return;
      await api('/api/zigbee/reset', { method: 'POST' });
      toast('C6 reset');
    } else if (t.dataset.zr) {
      const cmd = t.dataset.zr;
      if (['leave', 'factory_reset'].includes(cmd) && !await confirmDialog('Run ' + cmd + '?', 'The router leaves its Zigbee network.')) return;
      await api('/api/zigbee/command', { json: { cmd } });
      toast('Sent ' + cmd);
    } else if (t.dataset.snap) {
      download('/api/c6/zigbee-snapshot?bundle=' + encodeURIComponent(t.dataset.snap), t.dataset.snap + '_nvram.bin');
    } else if (t.id === 'mq-save') {
      const body = { uri: $('#mq-uri').value.trim(), user: $('#mq-user').value, prefix: $('#mq-prefix').value.trim(), enabled: $('#mq-en').checked };
      if ($('#mq-pass').value) body.password = $('#mq-pass').value;
      await api('/api/mqtt', { json: body });
      toast('MQTT saved');
      setTimeout(loadMqtt, 1500);
    } else if (t.id === 'ping-run') {
      $('#ping-out').textContent = '…';
      const r = await api('/api/tools/ping', { json: { host: $('#ping-host').value.trim(), count: +$('#ping-count').value } });
      $('#ping-out').textContent = `PING ${r.target}\n` + r.replies.map(x => x.timeout ? `seq ${x.seq}: timeout` : `seq ${x.seq}: ${x.ms} ms`).join('\n') + `\n${r.received}/${r.sent} received`;
    } else if (t.id === 'c6-backup') {
      toast('Reading the C6 flash, about 2 minutes…');
      t.disabled = true;
      try { await download('/api/c6/backup', status.hostname + '_c6_flash.bin'); toast('C6 backup saved'); } finally { t.disabled = false; }
    } else if (t.id === 'copy-btn') {
      toast(await copyText($('#copy-text').value) ? 'Copied to the clipboard' : 'Select the text and copy it (Ctrl/Cmd+C)');
    } else if (t.id === 'ev-preset-apply') {
      if (!await confirmDialog('Apply preset?', 'Replaces all events and the sound selection. Removed events disappear from Home Assistant.')) return;
      sndCfg = await api('/api/sound/events/preset', { json: { preset: $('#ev-preset').value } });
      sndExclude = new Set(sndCfg.exclude); sndDirty = false; renderEvents(); renderTree(); toast('Preset applied');
    } else if (t.id === 'ev-new') {
      openEditor(-1, { id: '', name: '', kind: 'impulse', threshold: 0.5, windows: 1, hold_s: 3, cooldown_s: 30, classes: [], suppress: [], enabled: true });
    } else if (t.dataset.evEdit !== undefined) {
      openEditor(+t.dataset.evEdit);
    } else if (t.dataset.evDel !== undefined) {
      const ev = sndCfg.events[+t.dataset.evDel];
      if (!await confirmDialog('Delete ' + ev.name + '?', 'Its entities disappear from Home Assistant; automations using them stop working.')) return;
      await putEvents({ events: sndCfg.events.filter((_, i) => i !== +t.dataset.evDel) });
    } else if (t.dataset.evYaml !== undefined) {
      const ev = sndCfg.events[+t.dataset.evYaml];
      await showCopy('Automation: ' + ev.name, automationYaml(ev),
        'Home Assistant: Settings → Automations & scenes → Create automation → ⋮ → Edit in YAML, paste, save.');
    } else if (t.id === 'ev-export') {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify({ exclude: [...sndExclude], events: sndCfg.events.map(({ active, count, last_ago_s, ...e }) => e) }, null, 2)], { type: 'application/json' }));
      a.download = status.hostname + '_sound_events.json';
      a.click();
    } else if (t.id === 'cls-save') {
      await putEvents(sndCfg);
    } else if (t.dataset.clsAll || t.dataset.clsNone) {
      e.preventDefault();
      const top = t.dataset.clsAll || t.dataset.clsNone;
      sndClasses.filter(c => c[2] === top).forEach(c => { if (t.dataset.clsAll) sndExclude.delete(c[0]); else sndExclude.add(c[0]); });
      document.querySelectorAll('[data-cls]').forEach(cb => { cb.checked = !sndExclude.has(+cb.dataset.cls); });
      sndDirty = true; updateClsSummary();
    } else if (t.dataset.logIgnore !== undefined) {
      sndExclude.add(+t.dataset.logIgnore);
      await putEvents(sndCfg);
      const cb = document.querySelector(`[data-cls="${t.dataset.logIgnore}"]`); if (cb) cb.checked = false;
    } else if (t.dataset.logRaise) {
      const events = sndCfg.events.slice();
      const ev = events.find(x => x.id === t.dataset.logRaise);
      if (ev) { ev.threshold = Math.min(1, Math.round((ev.threshold + 0.1) * 100) / 100); await putEvents({ events }); }
    } else if (t.dataset.logNew !== undefined) {
      const c = +t.dataset.logNew;
      openEditor(-1, { id: clsName(c).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 23), name: clsName(c), kind: 'impulse', threshold: 0.5, windows: 1, hold_s: 3, cooldown_s: 30, classes: [c], suppress: [], enabled: true });
    } else if (t.id === 'snd-clip') {
      const res = await fetch('/api/sound/clip?seconds=5', { headers: auth ? { Authorization: 'Basic ' + auth } : {} });
      if (!res.ok) throw new Error((await res.json()).error || res.statusText);
      const audio = $('#snd-audio');
      audio.src = URL.createObjectURL(await res.blob());
      audio.classList.remove('hidden');
      audio.play().catch(() => {});
    } else if (t.id === 'cd-get') {
      download('/api/coredump', 'coredump.elf');
    } else if (t.id === 'cd-del') {
      await api('/api/coredump', { method: 'DELETE' });
      toast('Core dump erased');
    } else if (t.id === 'log-pause') {
      logPaused = !logPaused;
      t.textContent = logPaused ? 'Resume' : 'Pause';
    } else if (t.id === 'log-clear') {
      logText = '';
      renderLog();
    } else if (t.id === 'log-save') {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([logText], { type: 'text/plain' }));
      a.download = status.hostname + '.log';
      a.click();
    } else if (t.dataset.upload) {
      await upload(t.dataset.upload);
    } else if (t.id === 'set-save') {
      const body = {};
      if ($('#set-host').value.trim() !== status.hostname) body.hostname = $('#set-host').value.trim();
      if ($('#set-pass').value) body.password = $('#set-pass').value;
      await api('/api/settings', { json: body });
      if (body.password) {
        auth = btoa('admin:' + body.password);
        try { sessionStorage.setItem('auth', auth); } catch (err) { /* storage blocked */ }
      }
      toast(body.hostname ? 'Saved, restart to apply the hostname' : 'Saved');
    } else if (t.id === 'set-nopass') {
      if (!await confirmDialog('Remove the password?', 'Anyone on the LAN can then switch roles and read the Thread network key.')) return;
      await api('/api/settings', { json: { password: '' } });
      auth = null;
      try { sessionStorage.removeItem('auth'); } catch (err) { /* storage blocked */ }
      toast('Password removed');
    } else if (t.id === 'sys-reboot') {
      if (!await confirmDialog('Restart?', 'The active role stops for about 10 s.')) return;
      await api('/api/reboot', { method: 'POST' });
      waitForRestart();
    } else if (t.id === 'sys-reflash') {
      if (!await confirmDialog('Reflash the C6?', 'The gateway restarts and rewrites the C6 firmware of the current role.')) return;
      await api('/api/c6/reflash', { method: 'POST' });
      waitForRestart();
    }
  } catch (err) {
    toast('Error: ' + err.message);
  }
});

document.addEventListener('click', e => {
  const a = e.target.closest('a[data-chip-del]');
  if (!a) return;
  e.preventDefault();
  const [id, i] = a.dataset.chipDel.split(':');
  const key = id === 'ev-classes' ? 'classes' : 'suppress';
  editEv[key] = editEv[key].filter(x => x !== +i);
  chips(id, editEv[key]);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'cli-cmd') $('#cli-run').click();
});

async function download(path, name) {
  const res = await fetch(path, { headers: auth ? { Authorization: 'Basic ' + auth } : {} });
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).error || msg; } catch (e) { /* not JSON */ }
    throw new Error(msg);
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await res.blob());
  a.download = name;
  a.click();
}

function upload(kind) {
  const file = $(`#${kind}-file`).files[0];
  if (!file) { toast('Choose a file'); return; }
  const prog = $(`#${kind}-prog`);
  prog.classList.remove('hidden');
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/ota/' + kind);
    if (auth) xhr.setRequestHeader('Authorization', 'Basic ' + auth);
    xhr.upload.onprogress = e => { prog.firstElementChild.style.width = (e.loaded / e.total * 100) + '%'; };
    xhr.onload = () => {
      let r = {};
      try { r = JSON.parse(xhr.responseText); } catch (e) { /* not JSON */ }
      if (xhr.status !== 200) { reject(new Error(r.error || xhr.statusText)); return; }
      toast(r.restarting ? 'Uploaded, restarting into the new firmware' : 'Uploaded ' + (r.version || ''));
      if (r.restarting) waitForRestart();
      resolve();
    };
    xhr.onerror = () => reject(new Error('upload failed'));
    xhr.send(file);
  });
}

let restarting = false;
async function waitForRestart() {
  restarting = true;
  await new Promise(r => setTimeout(r, 4000));
  for (let i = 0; i < 120; i++) {
    try { status = await api('/api/status'); restarting = false; render(true); toast('Gateway is back'); return; } catch (e) { /* still down */ }
    await new Promise(r => setTimeout(r, 2000));
  }
  restarting = false;
}

/* ---------------- log ---------------- */

let logSeq = 0, logText = '', logPaused = false;
function renderLog() {
  const box = $('#log');
  if (!box) return;
  const f = $('#log-filter')?.value.toLowerCase();
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  box.textContent = f ? logText.split('\n').filter(l => l.toLowerCase().includes(f)).join('\n') : logText;
  if (stick) box.scrollTop = box.scrollHeight;
}
async function pollLog() {
  if (route() !== 'system/diag' || logPaused || restarting) return;
  try {
    const { data, res } = await api('/api/logs?since=' + logSeq, { raw: true });
    logSeq = +res.headers.get('X-Log-Seq') || logSeq;
    if (data) {
      logText = (logText + data.replace(/\x1b\[[0-9;]*m/g, '')).slice(-200000);
      renderLog();
    }
  } catch (e) { /* retry next tick */ }
}
document.addEventListener('input', e => {
  if (e.target.id === 'log-filter') renderLog();
  if (e.target.id === 'cls-search') {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.cls-row').forEach(r => { r.style.display = !q || r.dataset.name.includes(q) ? 'flex' : 'none'; });
    document.querySelectorAll('#cls-tree details').forEach(d => { d.open = !!q && [...d.querySelectorAll('.cls-row')].some(r => r.style.display !== 'none'); });
  }
});

/* ---------------- loop ---------------- */

/* pages without form input, redrawn on every status poll */
const PASSIVE = ['overview', 'role', 'zigbee/info', 'zigbee/diag', 'zigbee/backups', 'system/info'];

function pageTitle() {
  const sec = NAV.find(n => n.id === tab), s = sec.subs?.find(x => x.id === sub);
  return `<h2 class="page-title">${ic(s?.icon || sec.icon)}<span>${sec.label}</span>${s ? `<small>›</small><small>${s.label}</small>` : ''}</h2>`;
}

function render(full) {
  if (!status) return;
  renderHeader();
  const main = $('#main');
  /* Forms keep their input: only redraw passive pages on every poll. */
  if (full || PASSIVE.includes(route())) {
    if (full) renderNav();
    main.innerHTML = pageTitle() + views[route()]();
    if (tab === 'thread') { loadThread(); if (sub === 'settings') loadDataset(false); }
    if (route() === 'ha/mqtt') loadMqtt();
    if (route() === 'system/diag') renderLog();
    if (tab === 'sound') {
      loadSound(); loadSoundConfig().catch(err => toast('Error: ' + err.message));
      if (!soundTimer) soundTimer = setInterval(() => { loadSound(); loadScoresAndLog(); if (sndTick % 10 === 0 && sndCfg && !$('#ev-dlg').open) api('/api/sound/events').then(c => { sndCfg = c; renderEvents(); }).catch(() => {}); }, 1000);
    }
  } else if (tab === 'thread') {
    loadThread();
  }
}

async function poll() {
  if (!restarting) {
    try { status = await api('/api/status'); render(false); } catch (e) { $('#hdr-role').innerHTML = '<span class="dot bad"></span><span>offline</span>'; }
  }
  setTimeout(poll, status?.c6?.flash?.busy ? 1000 : 5000);
}

renderNav();
history.replaceState(null, '', '#' + route());
poll().then(() => render(true));
setInterval(pollLog, 1500);
</script>
</body>
</html>
