/* ---------------- network surroundings ----------------
 * The gateway stores the raw scan (quick: OpenThread scans of the Thread role; full: C6 scanner image
 * with Wi-Fi). The rating is computed here so it can be refined without new firmware. */
const L = (en, cs) => lang === 'cs' ? cs : en;
const f154 = ch => 2405 + 5 * (ch - 11);
const fWifi = ch => ch === 14 ? 2484 : 2407 + 5 * ch;
const dbmSum = list => list.length ? 10 * Math.log10(list.reduce((a, v) => a + 10 ** (v / 10), 0)) : null;
/* 2.4 GHz access points: only they share the band with 802.15.4 (radio B also reports 5 GHz) */
const wifi24 = last => (last.wifi || []).filter(ap => ap.ch <= 14);
/* channel width: "bw" of scanner 1.1, older results only tell 20 or 40 MHz */
const apWidth = ap => ap.bw || (ap.ch2 === 'none' ? 20 : 40);
const SECURITY = { open: ['open', 'otevřená'], other: ['protected (unknown type)', 'chráněná (neznámý typ)'] };
function apSpan(ap) {
  const wide = apWidth(ap) >= 40;
  const center = fWifi(ap.ch) + (!wide ? 0 : ap.ch2 === 'above' ? 10 : ap.ch2 === 'below' ? -10 : 0);
  return [center - (wide ? 20 : 10), center + (wide ? 20 : 10)];
}
/* 5 GHz: the channel block of the AP's width (40/80/160 MHz blocks start at fixed channels) */
const f5 = ch => 5000 + 5 * ch;
const BLOCKS5 = { 40: [36, 44, 52, 60, 100, 108, 116, 124, 132, 140, 149, 157, 165, 173], 80: [36, 52, 100, 116, 132, 149, 165], 160: [36, 100, 149] };
function apSpan5(ap) {
  const w = apWidth(ap), base = (BLOCKS5[w] || []).filter(b => b <= ap.ch).pop();
  const center = base === undefined ? f5(ap.ch) : f5(base) + (w - 20) / 2;
  return [center - w / 2, center + w / 2];
}
/* BSSIDs of one access point: its virtual networks differ in the first byte (locally administered
 * addresses), some vendors also in the upper nibble of the fourth; the 2.4 and 5 GHz radios in the
 * last bytes by a few. Same AP: bytes 2-3 and the low nibble of byte 4 equal, last two bytes within 8. */
function apGroups(list) {
  const b = list.map(a => a.bssid.match(/../g).map(x => parseInt(x, 16)));
  const same = (p, q) => p[1] === q[1] && p[2] === q[2] && (p[3] & 15) === (q[3] & 15) && Math.abs((p[4] << 8 | p[5]) - (q[4] << 8 | q[5])) <= 8;
  const parent = list.map((_, i) => i), root = i => parent[i] === i ? i : (parent[i] = root(parent[i]));
  for (let i = 0; i < list.length; i++) for (let j = 0; j < i; j++) if (same(b[i], b[j])) parent[root(i)] = root(j);
  const groups = new Map();
  list.forEach((a, i) => { const r = root(i); groups.set(r, [...(groups.get(r) || []), a]); });
  return [...groups.values()].map(g => g.sort((x, y) => (x.ch > 14) - (y.ch > 14) || y.rssi - x.rssi))
    .sort((x, y) => Math.max(...y.map(a => a.rssi)) - Math.max(...x.map(a => a.rssi)));
}
/* 802.15.4 channels by the non-overlapping Wi-Fi channels 1, 6, 11 (22 MHz each) and the gaps between */
const ZONES = [[11, 14, ['under Wi-Fi 1', 'pod Wi-Fi 1']], [15, 15, ['gap Wi-Fi 1/6', 'mezera Wi-Fi 1/6']], [16, 19, ['under Wi-Fi 6', 'pod Wi-Fi 6']],
  [20, 20, ['gap Wi-Fi 6/11', 'mezera Wi-Fi 6/11']], [21, 24, ['under Wi-Fi 11', 'pod Wi-Fi 11']], [25, 26, ['above Wi-Fi 11 (Wi-Fi 12/13 in Europe)', 'nad Wi-Fi 11 (v Evropě Wi-Fi 12/13)']]];
/* Wi-Fi channels 1-13 whose 22 MHz cover an 802.15.4 channel */
const wifiOver = ch => Array.from({ length: 13 }, (_, i) => i + 1).filter(w => Math.abs(fWifi(w) - f154(ch)) < 12);
const apOverlaps = (ap, ch) => { const [a, b] = apSpan(ap); return f154(ch) + 1 > a && f154(ch) - 1 < b; };

function nsNetworks(last) {
  const nets = new Map();
  const add = (x, type) => {
    const key = x.ch + '/' + x.pan;
    const n = nets.get(key) || { ch: x.ch, pan: x.pan, type: 'unknown', devices: new Set(), rssi: -128, frames: 0 };
    const rank = { zigbee: 3, thread: 3, other: 2, no_payload: 1, unknown: 0 };
    if ((rank[type] ?? 0) > (rank[n.type] ?? 0)) n.type = type;
    if (x.name) n.name = x.name;
    if (x.epid) n.epid = x.epid;
    if (x.permit !== undefined) n.permit = n.permit || x.permit;
    if (x.joinable !== undefined) n.permit = n.permit || x.joinable;
    if (x.src) n.devices.add(x.src);
    if (x.frames) n.frames += x.frames;
    n.rssi = Math.max(n.rssi, x.rssi ?? -128);
    nets.set(key, n);
  };
  (last.beacons || []).forEach(x => add(x, x.type));
  (last.thread || []).forEach(x => add(x, 'thread'));
  (last.pans || []).forEach(x => add(x, 'unknown'));
  /* a PAN that answers beacon requests without payload and is not Zigbee: Thread 1.2+ */
  for (const n of nets.values()) if (n.type === 'no_payload') n.type = 'thread';
  return [...nets.values()].sort((a, b) => a.ch - b.ch || b.rssi - a.rssi);
}

/* Own networks of this gateway (Thread role) and of the Zigbee host are marked by channel and PAN. */
function nsOwn(nets) {
  const rs = protoStatus('thread');
  if (!isThread() || !rs.channel) return;
  /* the full scan sees the own network often only as a PAN in traffic: on the role's channel that is it */
  nets.filter(n => n.ch === rs.channel && n.type !== 'zigbee').forEach(n => {
    n.own = true;
    n.type = 'thread';
    n.name = n.name || rs.network_name;
  });
}

function nsChannels(last, nets) {
  const wifi = wifi24(last);
  return Array.from({ length: 16 }, (_, i) => {
    const ch = 11 + i, c = (last.channels || []).find(x => x.ch === ch) || {};
    const aps = wifi.filter(ap => apOverlaps(ap, ch));
    const wifiDbm = dbmSum(aps.map(ap => ap.rssi));
    const here = nets.filter(n => n.ch === ch);
    const noise = c.ed_max ?? null;
    let penalty = 0;
    if (wifiDbm !== null) penalty += Math.min(40, Math.max(0, wifiDbm + 90));
    if (noise !== null) penalty += 0.7 * Math.min(30, Math.max(0, noise + 92));
    penalty += here.reduce((a, n) => a + (n.rssi > -80 ? 15 : 8), 0);
    const score = Math.round(Math.max(0, 100 - penalty));
    return { ch, mhz: f154(ch), noise, noiseAvg: c.ed_avg, frames: c.frames, aps, wifiDbm, nets: here, score,
      rating: score >= 75 ? 'good' : score >= 50 ? 'ok' : 'bad' };
  });
}

const RATING = { good: ['ok', 'good', 'dobrý'], ok: ['warn', 'usable', 'použitelný'], bad: ['bad', 'poor', 'špatný'] };
const ratingPill = r => pill(RATING[r][0], L(RATING[r][1], RATING[r][2]));

/* 2.4 GHz in lanes on one frequency axis: Wi-Fi access points (arcs, height = signal) over the
 * non-overlapping Wi-Fi channels 1/6/11/13, the Wi-Fi channel ruler, MHz, then the 802.15.4 channels
 * coloured by rating with the Thread and Zigbee networks found on them. Guides show the overlap. */
function nsSpectrum(chs, last, nets) {
  const W = 900, H = 300, X0 = 74, base = 160, x = f => X0 + (f - 2400) / 85 * (W - X0 - 16), y = rssi => base - (Math.min(-30, Math.max(-100, rssi)) + 100) / 70 * 140;
  let svg = `<svg class="spectrum" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('2.4 GHz spectrum', 'Spektrum 2,4 GHz')}">`;
  for (const db of [-40, -60, -80, -100]) svg += `<line class="grid-line" x1="${X0}" x2="${W - 16}" y1="${y(db)}" y2="${y(db)}"/><text x="${X0 - 6}" y="${y(db) + 4}" text-anchor="end">${db} dBm</text>`;
  for (const w of [1, 6, 11, 13]) {
    svg += `<rect class="wband" x="${x(fWifi(w) - 11)}" y="${y(-32)}" width="${x(fWifi(w) + 11) - x(fWifi(w) - 11)}" height="${base - y(-32)}"/>
      <text x="${x(fWifi(w))}" y="${y(-32) + 12}" text-anchor="middle">Wi-Fi ${w}</text>`;
  }
  for (const c of chs) svg += `<line class="guide" x1="${x(c.mhz)}" x2="${x(c.mhz)}" y1="${y(-32)}" y2="236"/>`;
  const aps = wifi24(last).sort((a, b) => a.rssi - b.rssi);
  for (const ap of aps) {
    const [a, b] = apSpan(ap), top = y(ap.rssi);
    svg += `<path class="ap ${ap.rssi > -65 ? 'strong' : ''}" d="M${x(a)},${base} C${x(a + 4)},${top} ${x(b - 4)},${top} ${x(b)},${base} Z"><title>${esc(ap.ssid || L('hidden', 'skrytá'))} · ch ${ap.ch} · ${apWidth(ap)} MHz · ${ap.rssi} dBm</title></path>`;
  }
  /* one label per Wi-Fi channel: its SSIDs, strongest first */
  const byCh = new Map();
  for (const ap of [...aps].reverse()) {
    if (!ap.ssid || ap.rssi < -80) continue;
    const e = byCh.get(ap.ch) || { rssi: ap.rssi, names: [] };
    if (!e.names.includes(ap.ssid)) e.names.push(ap.ssid);
    byCh.set(ap.ch, e);
  }
  for (const [ch, e] of byCh) {
    const text = e.names.slice(0, 3).join(', ') + (e.names.length > 3 ? ' +' + (e.names.length - 3) : '');
    svg += `<text x="${x(fWifi(ch))}" y="${Math.max(y(-32) + 28, y(e.rssi) - 5)}" text-anchor="middle" style="fill:var(--text)">${esc(text)}</text>`;
  }
  /* lanes: Wi-Fi channels, MHz, 802.15.4 */
  svg += `<rect class="lane" x="${X0}" y="${base + 4}" width="${W - X0 - 16}" height="20" rx="4"/><text x="${X0 - 6}" y="${base + 18}" text-anchor="end">Wi-Fi</text>`;
  for (let w = 1; w <= 13; w++) svg += `<text x="${x(fWifi(w))}" y="${base + 18}" text-anchor="middle" class="${[1, 6, 11].includes(w) ? 'strong' : ''}">${w}</text>`;
  svg += `<text x="${X0 - 6}" y="${base + 40}" text-anchor="end">MHz</text>`;
  for (let f = 2410; f <= 2480; f += 10) svg += `<text x="${x(f)}" y="${base + 40}" text-anchor="middle">${f}</text>`;
  svg += `<text x="${X0 - 6}" y="${base + 66}" text-anchor="end">802.15.4</text>`;
  for (const c of chs) {
    const cx = x(c.mhz), here = nets.filter(n => n.ch === c.ch);
    svg += `<rect class="ch-${c.rating} ${here.some(n => n.own) ? 'own' : ''}" x="${cx - 10}" y="${base + 50}" width="20" height="26" rx="4"><title>${L('channel', 'kanál')} ${c.ch} (${c.mhz} MHz): ${c.score}/100</title></rect>
      <text x="${cx}" y="${base + 90}" text-anchor="middle" class="${[15, 20, 25].includes(c.ch) ? 'strong' : ''}">${c.ch}</text>`;
    here.forEach((n, k) => {
      const t = n.type === 'zigbee' ? 'Z' : n.type === 'thread' ? 'T' : '·';
      svg += `<circle class="net-${n.type}" cx="${cx}" cy="${base + 104 + k * 14}" r="6"><title>${n.type === 'zigbee' ? 'Zigbee' : n.type === 'thread' ? 'Thread' : '802.15.4'} ${esc(n.name || n.pan)}${n.own ? ' ★' : ''}</title></circle>
        <text x="${cx}" y="${base + 108 + k * 14}" text-anchor="middle" style="fill:var(--accent-text);font-size:9px">${t}</text>`;
    });
  }
  return svg + '</svg>';
}

/* 5 GHz (radio B): access points over the U-NII bands, DFS bands shaded; 802.15.4 is not here */
function nsSpectrum5(last) {
  const aps = (last.wifi || []).filter(a => a.ch > 14).sort((a, b) => a.rssi - b.rssi);
  if (!aps.length) return '';
  const W = 900, H = 230, X0 = 74, F0 = 5150, F1 = 5895, base = 160, x = f => X0 + (f - F0) / (F1 - F0) * (W - X0 - 16), y = rssi => base - (Math.min(-30, Math.max(-100, rssi)) + 100) / 70 * 130;
  let svg = `<svg class="spectrum" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('5 GHz spectrum', 'Spektrum 5 GHz')}">`;
  for (const [a, b, name, dfs] of [[5150, 5250, 'U-NII-1', 0], [5250, 5350, 'U-NII-2A (DFS)', 1], [5470, 5725, 'U-NII-2C (DFS)', 1], [5725, 5850, 'U-NII-3', 0]]) {
    svg += `<rect class="${dfs ? 'dfs' : 'wband'}" x="${x(a)}" y="20" width="${x(b) - x(a)}" height="${base - 20}"/><text x="${(x(a) + x(b)) / 2}" y="32" text-anchor="middle">${name}</text>`;
  }
  for (const db of [-40, -60, -80, -100]) svg += `<line class="grid-line" x1="${X0}" x2="${W - 16}" y1="${y(db)}" y2="${y(db)}"/><text x="${X0 - 6}" y="${y(db) + 4}" text-anchor="end">${db} dBm</text>`;
  for (const ap of aps) {
    const [a, b] = apSpan5(ap), top = y(ap.rssi), k = Math.min(8, (b - a) / 5);
    svg += `<path class="ap ${ap.rssi > -65 ? 'strong' : ''}" d="M${x(a)},${base} C${x(a + k)},${top} ${x(b - k)},${top} ${x(b)},${base} Z"><title>${esc(ap.ssid || L('hidden', 'skrytá'))} · ch ${ap.ch} · ${apWidth(ap)} MHz · ${ap.rssi} dBm</title></path>`;
  }
  const byBlock = new Map();
  for (const ap of [...aps].reverse()) {
    if (!ap.ssid || ap.rssi < -80) continue;
    const [a, b] = apSpan5(ap), key = (a + b) / 2, e = byBlock.get(key) || { rssi: ap.rssi, names: [] };
    if (!e.names.includes(ap.ssid)) e.names.push(ap.ssid);
    byBlock.set(key, e);
  }
  for (const [f, e] of byBlock) svg += `<text x="${x(f)}" y="${Math.max(48, y(e.rssi) - 5)}" text-anchor="middle" style="fill:var(--text)">${esc(e.names.slice(0, 2).join(', ') + (e.names.length > 2 ? ' +' + (e.names.length - 2) : ''))}</text>`;
  svg += `<rect class="lane" x="${X0}" y="${base + 4}" width="${W - X0 - 16}" height="20" rx="4"/><text x="${X0 - 6}" y="${base + 18}" text-anchor="end">${L('channel', 'kanál')}</text>`;
  for (const ch of [36, 40, 44, 48, 52, 56, 60, 64, 100, 104, 108, 112, 116, 120, 124, 128, 132, 136, 140, 144, 149, 153, 157, 161, 165]) {
    svg += `<text x="${x(f5(ch))}" y="${base + 18}" text-anchor="middle" class="${aps.some(a => a.ch === ch) ? 'strong' : ''}" style="font-size:10px">${ch}</text>`;
  }
  svg += `<text x="${X0 - 6}" y="${base + 40}" text-anchor="end">MHz</text>`;
  for (let f = 5200; f <= 5850; f += 100) svg += `<text x="${x(f)}" y="${base + 40}" text-anchor="middle">${f}</text>`;
  return svg + '</svg>';
}

function nsRecommend(chs, nets, last) {
  const best = list => [...list].sort((a, b) => b.score - a.score || b.ch - a.ch);
  const thread = best(chs.filter(c => c.ch <= 25)).slice(0, 3);
  const zigbee = best(chs.filter(c => [11, 15, 20, 25].includes(c.ch)))[0];
  const own = nets.filter(n => n.own || n.type === 'zigbee');
  const wifi = wifi24(last);
  let wifiReco = '';
  if (wifi.length) {
    const ownCh = own.map(n => n.ch);
    const cands = [1, 6, 11, 13].map(w => {
      const ap = { ch: w, ch2: 'none' };
      const near = wifi.filter(x => Math.abs(fWifi(x.ch) - fWifi(w)) < 20);
      const clash = ownCh.filter(ch => apOverlaps(ap, ch));
      return { w, load: dbmSum(near.map(x => x.rssi)) ?? -100, count: near.length, clash };
    }).sort((a, b) => (a.clash.length - b.clash.length) || (a.load - b.load));
    const c = cands[0];
    wifiReco = `<div><div class="muted">${L('Wi-Fi channel', 'Kanál Wi-Fi')}</div><b class="big">${c.w}</b>
      <div>${L(`${c.count} networks nearby`, `${c.count} sítí v okolí`)}${c.clash.length ? '' : L(', does not overlap your 802.15.4 networks', ', nepřekrývá vaše sítě 802.15.4')}</div></div>`;
  }
  const chList = list => list.map(c => `${c.ch} <span class="muted">(${c.score})</span>`).join(', ');
  const ownRows = own.map(n => {
    const c = chs.find(x => x.ch === n.ch);
    const clash = c.aps.filter(a => a.rssi > -75).map(a => a.ssid).filter(Boolean);
    return `<div><b>${n.type === 'zigbee' ? 'Zigbee' : 'Thread'} ${esc(n.name || n.pan)}</b> · ${L('channel', 'kanál')} ${n.ch} ${ratingPill(c.rating)}
      <div class="muted">${clash.length ? L(`overlaps strong Wi-Fi: ${[...new Set(clash)].slice(0, 3).map(esc).join(', ')}`, `překrývá silnou Wi-Fi: ${[...new Set(clash)].slice(0, 3).map(esc).join(', ')}`) : L('no strong Wi-Fi overlap', 'bez překryvu se silnou Wi-Fi')}</div></div>`;
  }).join('');
  return `<div class="reco">
    <div><div class="muted">${L('New Thread network', 'Nová Thread síť')}</div><b class="big">${thread[0].ch}</b><div>${L('also', 'také')} ${chList(thread.slice(1))}</div></div>
    <div><div class="muted">${L('New Zigbee network (11/15/20/25)', 'Nová Zigbee síť (11/15/20/25)')}</div><b class="big">${zigbee.ch}</b> <span class="muted">(${zigbee.score})</span></div>
    ${wifiReco}${ownRows}</div>`;
}

let nsTimer = null;
async function loadNetscan() {
  if (route() !== 'radios/scan') { clearInterval(nsTimer); nsTimer = null; return; }
  let d;
  try { d = await api('/api/net/scan'); } catch (e) { return; }
  if (!$('#ns-state')) return;
  const busy = d.state !== 'idle';
  $('#ns-quick').disabled = busy || !d.quick_available;
  $('#ns-full').disabled = busy;
  const last = d.last;
  const when = last && last.at ? new Date(last.at * 1000).toLocaleString(lang === 'cs' ? 'cs-CZ' : 'en-GB') : '';
  $('#ns-state').innerHTML = busy ? pill('warn', L('scanning…', 'skenuji…'))
    : last ? `${L('Last scan', 'Poslední sken')}: ${esc(when)} · ${last.mode === 'full' ? L('full', 'úplný') : L('quick', 'rychlý')}${last.radio ? ` · ${L('radio', 'rádio')} ${esc(last.radio.toUpperCase())}` : ''} · ${(last.duration_ms / 1000).toFixed(0)} s${(last.errors || []).map(e => `<div class="warn-text">${esc(e)}</div>`).join('')}`
    : L('No scan yet.', 'Zatím bez skenu.');
  if (busy && !nsTimer) nsTimer = setInterval(loadNetscan, 2000);
  if (!busy && nsTimer) { clearInterval(nsTimer); nsTimer = null; }
  if (!last || $('#ns-state').dataset.at === String(last.at) + last.mode + last.duration_ms) return;
  $('#ns-state').dataset.at = String(last.at) + last.mode + last.duration_ms;
  const nets = nsNetworks(last);
  nsOwn(nets);
  const chs = nsChannels(last, nets);
  $('#ns-reco').classList.remove('muted');
  $('#ns-reco').innerHTML = nsRecommend(chs, nets, last);
  $('#ns-spectrum').classList.remove('muted');
  $('#ns-spectrum').innerHTML = nsSpectrum(chs, last, nets) + (last.wifi ? `<p class="muted">${L('Wi-Fi access points as arcs (height = signal) over the non-overlapping Wi-Fi channels 1, 6, 11 and 13 (dashed, 22 MHz). Below on the same frequency axis the 802.15.4 channels coloured by rating, your network outlined, with the networks found on them: T Thread, Z Zigbee. Dotted guides show which Wi-Fi covers which 802.15.4 channel; 15, 20 and 25 lie in the gaps.',
      'Přístupové body Wi-Fi jako oblouky (výška = signál) nad nepřekrývajícími se kanály Wi-Fi 1, 6, 11 a 13 (čárkovaně, 22 MHz). Pod nimi na stejné frekvenční ose kanály 802.15.4 barevně podle hodnocení, vaše síť orámovaná, se sítěmi nalezenými na nich: T Thread, Z Zigbee. Tečkovaná vodítka ukazují, která Wi-Fi překrývá který kanál 802.15.4; 15, 20 a 25 leží v mezerách.')}</p>`
    : `<p class="muted">${L('Quick scan: no Wi-Fi data, run a full scan for it.', 'Rychlý sken: bez Wi-Fi, pro ni spusťte úplný sken.')}</p>`);
  const s5 = nsSpectrum5(last);
  $('#ns-5g').classList.toggle('hidden', !s5);
  $('#ns-spectrum5').innerHTML = s5 && s5 + `<p class="muted">${L('5 GHz access points of radio B over the U-NII bands, width as reported (20 to 160 MHz). DFS bands (shaded) need radar detection. 5 GHz does not disturb Thread or Zigbee.',
    'Přístupové body 5 GHz z rádia B nad pásmy U-NII, šířka podle hlášení (20 až 160 MHz). Pásma DFS (podbarvená) vyžadují detekci radaru. 5 GHz neruší Thread ani Zigbee.')}</p>`;
  $('#ns-channels').innerHTML = `<table><tr>${['Channel', 'MHz', L('Wi-Fi channels', 'Kanály Wi-Fi'), 'Noise', 'Wi-Fi overlap', 'Networks', 'Score'].map(th).join('')}</tr>${chs.map(c => {
    const z = ZONES.find(([a]) => a === c.ch);
    return `${z ? `<tr class="ns-sep"><td colspan="7">${L(...z[2])} · ${f154(z[0]) - 1}–${f154(z[1]) + 1} MHz</td></tr>` : ''}<tr>
    <td><b>${c.ch}</b></td><td>${c.mhz}</td><td>${wifiOver(c.ch).map(w => c.aps.some(a => a.ch === w) ? `<b>${w}</b>` : `<span class="muted">${w}</span>`).join(', ')}</td>
    <td>${c.noise !== null ? c.noise + ' dBm' : '—'}${c.noiseAvg !== undefined ? ` <span class="muted">(${L('avg', 'prům.')} ${c.noiseAvg})</span>` : ''}</td>
    <td>${c.wifiDbm !== null ? `${c.wifiDbm.toFixed(0)} dBm <span class="muted">${c.aps.length}× ${[...new Set(c.aps.filter(a => a.ssid).sort((a, b) => b.rssi - a.rssi).map(a => esc(a.ssid)))].slice(0, 2).join(', ')}</span>` : last.wifi ? '—' : '<span class="muted">?</span>'}</td>
    <td>${c.nets.map(n => `${n.type === 'zigbee' ? 'Zigbee' : n.type === 'thread' ? 'Thread' : '802.15.4'}${n.own ? ' ★' : ''}`).join(', ') || '—'}</td>
    <td>${ratingPill(c.rating)} <span class="muted">${c.score}</span></td></tr>`;
  }).join('')}</table><p class="muted">${L('Wi-Fi channels: those whose 22 MHz cover the channel, bold where an access point was found.', 'Kanály Wi-Fi: ty, jejichž 22 MHz kanál pokrývá, tučně kde byl nalezen přístupový bod.')}</p>`;
  $('#ns-nets').innerHTML = nets.length ? `<table><tr>${[['Type', 'Network type'], 'Name', 'PAN ID', 'Ext PAN ID', 'Channel', 'Devices', 'Best signal', 'Open'].map(th).join('')}</tr>${nets.map(n => `<tr>

    : `<p class="muted">${L('No 802.15.4 network found.', 'Žádná síť 802.15.4 nenalezena.')}</p>`;
  /* one row per BSSID (results stored before the gateway merged them carry duplicates) */
  const wifi = [...new Map([...(last.wifi || [])].sort((a, b) => a.rssi - b.rssi).map(a => [a.bssid, a])).values()].sort((a, b) => b.rssi - a.rssi);
  const groups = apGroups(wifi), multi = groups.filter(g => g.length > 1).length;
  const apHead = g => {
    const bands = [...new Set(g.map(a => a.ch > 14 ? '5 GHz' : L('2.4 GHz', '2,4 GHz')))].join(' + ');
    const names = [...new Set(g.map(a => a.ssid).filter(Boolean))];

  };
  $('#ns-wifi').innerHTML = !last.wifi ? `<p class="muted">${L('Only the full scan sees Wi-Fi.', 'Wi-Fi vidí jen úplný sken.')}</p>`
    : `<table><tr>${['SSID', 'BSSID', 'Band', ['Channel', 'Wi-Fi channel'], 'Width', 'Signal', 'Security', 'Standard'].map(th).join('')}</tr>${groups.map(g => (g.length > 1 ? apHead(g) : '') + g.map(a => `<tr class="${g.length > 1 ? 'ns-member' : ''}">

    <td>${a.ch > 14 ? '5 GHz' : L('2.4 GHz', '2,4 GHz')}</td><td>${a.ch}</td><td>${apWidth(a)} MHz</td>
    <td>${meter(Math.max(0, Math.min(100, (a.rssi + 100) * 1.6)), 101, 101).replace(/\d+ %/, a.rssi + ' dBm')}</td>
    <td data-notr>${SECURITY[a.auth] ? `<span class="${a.auth === 'open' ? 'warn-text' : ''}">${L(...SECURITY[a.auth])}</span>` : esc(a.auth.toUpperCase())}</td>
    <td data-notr>802.11${esc(a.phy)}</td></tr>`).join('')).join('')}</table>
    ${multi ? `<p class="muted">${L(`${multi} access point${multi > 1 ? 's send' : ' sends'} several networks (one radio, several SSIDs, or 2.4 and 5 GHz): grouped by their BSSIDs, which differ only in the first byte or by a few in the last.`, `${multi} ${multi === 1 ? 'přístupový bod vysílá' : multi < 5 ? 'přístupové body vysílají' : 'přístupových bodů vysílá'} víc sítí (jedno rádio s více SSID nebo 2,4 a 5 GHz): seskupeno podle BSSID, která se liší jen prvním bajtem nebo o pár v posledním.`)}</p>` : ''}
    ${last.wifi.some(a => a.auth === 'open') && !last.wifi.some(a => a.bw) ? `<p class="muted">${L('Scans before scanner 1.1 show WPA3 networks as open: run a new full scan.', 'Skeny před skenerem 1.1 ukazují sítě WPA3 jako otevřené: spusťte nový úplný sken.')}</p>` : ''}`;
}

/* traffic: counters since boot from the gateway, rates from the difference of two samples taken
 * every 2 s while the page is open */
let trafficTimer = null, trafficPrev = null, trafficRates = null, trafficHist = [], trafficRoute = '';
const TRAFFIC_API = { 'system/lan': '/api/net/traffic', 'system/wifi': '/api/net/wifi/traffic' };
const TRAFFIC_HIST = 150;
const fmtRate = b => { const v = b * 8; return v >= 1e6 ? (v / 1e6).toFixed(2) + ' Mb/s' : v >= 1e3 ? (v / 1e3).toFixed(1) + ' kb/s' : Math.round(v) + ' b/s'; };
async function loadTraffic() {
  if (!TRAFFIC_API[route()]) { clearInterval(trafficTimer); trafficTimer = null; return; }
  if (trafficRoute !== route()) { trafficRoute = route(); trafficPrev = trafficRates = null; trafficHist = []; }
  let t;
  try { t = await api(TRAFFIC_API[route()]); } catch (e) { return; }
  if (trafficPrev && t.uptime_ms > trafficPrev.uptime_ms) {
    const dt = (t.uptime_ms - trafficPrev.uptime_ms) / 1000, d = (a, b) => Math.max(0, (a - b) / dt);
    trafficRates = { rx: d(t.rx, trafficPrev.rx), tx: d(t.tx, trafficPrev.tx), svc: {} };
    for (const k in t.services) trafficRates.svc[k] = { rx: d(t.services[k].rx, trafficPrev.services[k].rx), tx: d(t.services[k].tx, trafficPrev.services[k].tx) };
    trafficHist.push([trafficRates.rx, trafficRates.tx]);
    if (trafficHist.length > TRAFFIC_HIST) trafficHist.shift();
  } else if (trafficPrev) {
    trafficHist = []; /* the gateway restarted */
  }
  trafficPrev = t;
  renderTraffic(t);
  renderLanState();
  renderWifiState();
}
function spark(hist) {
  const W = 600, H = 120, max = Math.max(1250, ...hist.flat()) * 1.1;
  const path = i => hist.map((h, j) => `${j ? 'L' : 'M'}${(W * (j + TRAFFIC_HIST - hist.length) / (TRAFFIC_HIST - 1)).toFixed(1)},${(H - H * h[i] / max).toFixed(1)}`).join('');
  return { max: max / 1.1, svg: `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="RX/TX">
    ${[0.25, 0.5, 0.75].map(f => `<line class="grid-l" x1="0" x2="${W}" y1="${H * f}" y2="${H * f}"/>`).join('')}
    ${hist.length > 1 ? `<path class="rx" d="${path(0)}"/><path class="tx" d="${path(1)}"/>` : ''}</svg>` };
}

  const svcs = Object.entries(t.services).sort((a, b) => (b[1].rx + b[1].tx) - (a[1].rx + a[1].tx));
  box.classList.remove('muted');
  box.innerHTML = `<div class="row" style="gap:32px">

      <div><div class="muted">${L('Received since start', 'Přijato od startu')}</div><div class="rate">${fmtBytes(t.rx)} <small>${t.rx_packets} ${L('packets', 'paketů')}</small></div></div>

function hwList() {

}

}
document.addEventListener('input', e => {

document.addEventListener('click', async e => {
  const t = e.target.closest('#hw-scan, #hw-save, #hw-add, [data-hw-del], [data-hw-addc], [data-hw-manual]');
  if (!t || !hw) return;
  try {

      t.disabled = true;
      $('#hw-scan-state').textContent = L('scanning…', 'skenuji…');
      try { hw = await api('/api/sensors/scan', { method: 'POST', timeout: 30000 }); } finally { t.disabled = false; }

    } else if (t.id === 'hw-save') {
      await hwPut({ interval_s: +$('#hw-interval').value, sensors: hwList() }, L('Saved', 'Uloženo'));
    } else if (t.dataset.hwDel) {

      if (!await confirmDialog(L(`Remove ${s.name}?`, `Odebrat ${s.name}?`), L('Its entities in Home Assistant become unavailable. A sensor still connected is added again by the next scan: to keep it out, switch it off instead.',
        'Jeho entity v Home Assistant přestanou být dostupné. Senzor, který zůstane připojený, přidá další sken znovu: chcete-li ho vynechat, raději ho vypněte.'))) return;
      await hwPut({ sensors: hwList().filter(x => x.addr !== a) }, L('Removed', 'Odebráno'));
    } else if (t.dataset.hwAddc) {
      const a = +t.dataset.hwAddc, [type, chip] = $(`[data-hw-cand="${a}"]`).value.split('|');
      await hwPut({ sensors: [...hwList(), { addr: a, type, chip, name: chip }] }, L(`Added ${chip}`, `Přidán ${chip}`));
    } else if (t.dataset.hwManual) {
      $('#hw-add-addr').value = hex2(+t.dataset.hwManual);
      $('#hw-add-type').innerHTML = hwTypeOpts(+t.dataset.hwManual, '');
      $('#hw-add-addr').scrollIntoView({ behavior: 'smooth', block: 'center' });

      if (a === null) return toast(L('Address: 0x08 to 0x77', 'Adresa: 0x08 až 0x77'));

      if (hw.sensors.some(s => s.addr === a)) return toast(L('A sensor with this address is configured already', 'Senzor s touto adresou už je nastaven'));
      await hwPut({ sensors: [...hwList(), { addr: a, type, name: tt.label }] }, L(`Added ${tt.label}`, `Přidán ${tt.label}`));
    }
  } catch (err) {
    toast(L('Error: ', 'Chyba: ') + err.message);
  }
});

function mbEditor(title, obj) {
  $('#mb-editor').classList.remove('hidden');
  $('#mb-editor-title').textContent = title;
  $('#mb-editor-text').value = JSON.stringify(obj, null, 1);
  $('#mb-editor-err').textContent = '';
  $('#mb-editor').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
async function loadModbus(full = true) {
  if (route() !== 'system/rs485') { clearInterval(mbTimer); mbTimer = null; return; }
  try {
    mb = await api('/api/modbus');
    if (full || !mbTpls.length) mbTpls = (await api('/api/modbus/templates')).templates;
    for (const id of new Set(mb.devices.map(d => d.template))) await mbTemplate(id).catch(() => {});
  } catch (e) { if ($('#mb-devices')) $('#mb-devices').textContent = e.message; return; }
  if (!$('#mb-devices')) return;
  if (full) {
    if (!$('#mb-baud').matches(':focus')) { $('#mb-baud').value = mb.bus.baud; $('#mb-parity').value = mb.bus.parity; $('#mb-stop').value = mb.bus.stop; $('#mb-timeout').value = mb.bus.timeout_ms; }
    const keep = $('#mb-add-tpl').value;
    $('#mb-add-tpl').innerHTML = mbTplOptions(keep || 'eastron_sdm630', false);
    $('#mb-pr-tpl').innerHTML = mbTplOptions($('#mb-pr-tpl').value, true);
    mbAddNote();
    mbRenderDevices();
    mbRenderTemplates();
    if (mbPrefill) {
      $('#mb-add-tr').value = 'tcp';
      $('#mb-add-host').value = $('#mb-raw-host').value = mbPrefill.host;
      $('#mb-add-port').value = mbPrefill.port;
      $('#mb-add-slave').value = $('#mb-raw-slave').value = mbPrefill.unit;
      $('#mb-raw-tr').value = 'tcp';
      $('#mb-add-tcp').classList.remove('hidden');
      $('#mb-raw-hostf').classList.remove('hidden');
      mbAddNote();
      mbPrefill = null;
      $('#mb-add-tpl').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
  mbRefresh();
  if (!mbTimer) mbTimer = setInterval(() => loadModbus(false), 3000);
  mbProbeState();
}
async function mbProbeState() {
  const p = await api('/api/modbus/probe').catch(() => null);
  if (!p || !$('#mb-pr-state')) return;
  $('#mb-pr-start').classList.toggle('hidden', p.running);
  $('#mb-pr-stop').classList.toggle('hidden', !p.running);
  $('#mb-pr-state').innerHTML = (p.running ? `${pill('warn', L('searching', 'hledám'))} ${p.progress} %${p.baud ? ` · ${p.baud} Bd` : ''}` : p.progress ? L('Done.', 'Hotovo.') : '')
    + (p.found.length ? `<table><tr><th>${L('Address', 'Adresa')}</th><th>${L('Baud rate', 'Rychlost')}</th><th></th></tr>${p.found.map(f =>
      `<tr><td>${f.slave}</td><td>${f.baud || '—'}</td><td><button class="btn" data-mb-use="${f.slave}|${f.baud || ''}">${L('Use', 'Použít')}</button></td></tr>`).join('')}</table>` : p.progress && !p.running ? ` ${L('Nothing answered.', 'Nic neodpovědělo.')}` : '');
}
/* the configured devices with the edits of the table */
function mbList() {
  return mb.devices.map(d => {
    const row = document.querySelector(`tr[data-mbdev="${d.id}"]`);
    const o = { id: d.id, name: d.name, template: d.template, transport: d.transport, slave: d.slave, poll_s: d.poll_s, expose: d.expose, enabled: d.enabled };
    if (d.transport === 'tcp') Object.assign(o, { host: d.host, port: d.port });
    if (row) Object.assign(o, { name: row.querySelector('[data-mb-name]').value.trim(), expose: row.querySelector('[data-mb-expose]').value, enabled: row.querySelector('[data-mb-en]').checked });
    return o;
  });
}
async function mbPut(body, msg) {
  mb = await api('/api/modbus', { method: 'PUT', json: body });
  await loadModbus(true);
  if (msg) toast(msg);
}
async function mbWrite(device, key, value) {
  await api('/api/modbus/write', { json: value === undefined ? { device, key } : { device, key, value } });
  toast(L('Written', 'Zapsáno'));
  setTimeout(() => loadModbus(false), 1200);
}
function mbRawOut(r, fc) {
  if (!r.ok) return `<p class="warn-text">${esc(r.error)}</p>`;
  if (r.bits) return `<p>${r.bits.join(' ')}</p>`;
  if (!r.registers) return `<p>${L('Written.', 'Zapsáno.')}</p>`;
  const regs = r.registers, a0 = parseInt($('#mb-raw-addr').value) || 0;
  const fl = (hi, lo) => { const dv = new DataView(new ArrayBuffer(4)); dv.setUint16(0, hi); dv.setUint16(2, lo); const v = dv.getFloat32(0); return isFinite(v) ? +v.toPrecision(7) : '—'; };
  return `<table><tr><th>${L('Register', 'Registr')}</th><th>hex</th><th>u16</th><th>s16</th><th>u32 ABCD</th><th>u32 CDAB</th><th>f32 ABCD</th><th>f32 CDAB</th></tr>${regs.map((v, i) => {
    const n = regs[i + 1];
    return `<tr><td><code>0x${(a0 + i).toString(16).padStart(4, '0')}</code> (${a0 + i})</td><td><code>${v.toString(16).padStart(4, '0')}</code></td><td>${v}</td><td>${v > 32767 ? v - 65536 : v}</td>
      <td>${n !== undefined ? v * 65536 + n : ''}</td><td>${n !== undefined ? n * 65536 + v : ''}</td><td>${n !== undefined ? fl(v, n) : ''}</td><td>${n !== undefined ? fl(n, v) : ''}</td></tr>`;
  }).join('')}</table>`;
}
document.addEventListener('change', e => {
  if (e.target.id === 'mb-add-tpl' || e.target.id === 'mb-add-tr') {
    $('#mb-add-tcp').classList.toggle('hidden', $('#mb-add-tr').value !== 'tcp');
    if (e.target.id === 'mb-add-tpl') $('#mb-add-name').dataset.auto = '1', $('#mb-add-name').value = '';
    mbAddNote();
  }
  if (e.target.id === 'mb-pr-tr') { const tcp = e.target.value === 'tcp'; $('#mb-pr-tcp').classList.toggle('hidden', !tcp); $('#mb-pr-bauds').classList.toggle('hidden', tcp); }
  if (e.target.id === 'mb-raw-tr') $('#mb-raw-hostf').classList.toggle('hidden', e.target.value !== 'tcp');
  if (e.target.id === 'mb-add-name') e.target.dataset.auto = '0';
  if (e.target.matches('[data-mb-sel]')) { const [d, k] = e.target.dataset.mbSel.split('|'); mbWrite(d, k, e.target.value).catch(err => toast(L('Error: ', 'Chyba: ') + err.message)); }
  if (e.target.id === 'mb-tpl-import' && e.target.files[0]) {
    e.target.files[0].text().then(t => { mbEditor(L('Imported template', 'Importovaná šablona'), JSON.parse(t)); }).catch(err => toast(L('Error: ', 'Chyba: ') + err.message));
    e.target.value = '';
  }
});
document.addEventListener('click', async e => {
  const t = e.target.closest('#mb-bus-save, #mb-add, #mb-dev-save, #mb-bus-from-tpl, #mb-pr-start, #mb-pr-stop, #mb-raw-send, #mb-tpl-new, #mb-editor-save, #mb-editor-close, [data-mb-open], [data-mb-del], [data-mb-set], [data-mb-sw], [data-mb-press], [data-mb-use], [data-mb-tpl-export], [data-mb-tpl-copy], [data-mb-tpl-edit], [data-mb-tpl-del]');
  if (!t || !mb) return;
  try {
    if (t.id === 'mb-bus-save' || t.id === 'mb-bus-from-tpl') {
      const tp = mbTpl($('#mb-add-tpl').value);
      const bus = t.id === 'mb-bus-save' ? { baud: +$('#mb-baud').value, parity: $('#mb-parity').value, stop: +$('#mb-stop').value, timeout_ms: +$('#mb-timeout').value }
        : { baud: tp.baud, parity: tp.serial[1], stop: +tp.serial[2] };
      await mbPut({ bus }, L('Bus settings saved', 'Nastavení sběrnice uloženo'));
    } else if (t.id === 'mb-add') {
      const tcp = $('#mb-add-tr').value === 'tcp';
      const d = { name: $('#mb-add-name').value.trim(), template: $('#mb-add-tpl').value, transport: tcp ? 'tcp' : 'rtu', slave: +$('#mb-add-slave').value,
        poll_s: +$('#mb-add-poll').value, expose: $('#mb-add-expose').value };
      if (tcp) Object.assign(d, { host: $('#mb-add-host').value.trim(), port: +$('#mb-add-port').value });
      await mbPut({ devices: [...mbList(), d] }, L(`Added ${d.name}`, `Přidáno ${d.name}`));
    } else if (t.id === 'mb-dev-save') {
      await mbPut({ devices: mbList() }, L('Saved', 'Uloženo'));
    } else if (t.dataset.mbOpen) {
      mbOpen.has(t.dataset.mbOpen) ? mbOpen.delete(t.dataset.mbOpen) : mbOpen.add(t.dataset.mbOpen);
      mbRenderDevices();
    } else if (t.dataset.mbDel) {
      const d = mb.devices.find(x => x.id === t.dataset.mbDel);
      if (!await confirmDialog(L(`Remove ${d.name}?`, `Odebrat ${d.name}?`), L('Its entities in Home Assistant become unavailable.', 'Jeho entity v Home Assistant přestanou být dostupné.'))) return;
      await mbPut({ devices: mbList().filter(x => x.id !== d.id) }, L('Removed', 'Odebráno'));
    } else if (t.dataset.mbSet) {
      const [d, k] = t.dataset.mbSet.split('|');
      await mbWrite(d, k, +document.querySelector(`[data-mb-num="${t.dataset.mbSet}"]`).value);
    } else if (t.dataset.mbSw) {
      const [d, k, v] = t.dataset.mbSw.split('|');
      await mbWrite(d, k, v);
    } else if (t.dataset.mbPress) {
      const [d, k] = t.dataset.mbPress.split('|');
      if (!await confirmDialog(L('Run the command?', 'Spustit příkaz?'), L('It is sent to the device at once.', 'Odešle se do zařízení hned.'))) return;
      await mbWrite(d, k);
    } else if (t.id === 'mb-pr-start') {
      const tcp = $('#mb-pr-tr').value === 'tcp';
      const body = { transport: tcp ? 'tcp' : 'rtu', from: +$('#mb-pr-from').value, to: +$('#mb-pr-to').value };
      if ($('#mb-pr-tpl').value) body.template = $('#mb-pr-tpl').value;
      if (tcp) Object.assign(body, { host: $('#mb-pr-host').value.trim(), port: +$('#mb-pr-port').value });
      else body.bauds = [...document.querySelectorAll('[data-mb-baud]:checked')].map(c => +c.dataset.mbBaud);
      await api('/api/modbus/probe', { json: body });
      mbProbeState();
    } else if (t.id === 'mb-pr-stop') {
      await api('/api/modbus/probe', { json: { stop: true } });
    } else if (t.dataset.mbUse) {
      const [slave, baud] = t.dataset.mbUse.split('|');
      $('#mb-add-slave').value = slave;
      $('#mb-add-tr').value = $('#mb-pr-tr').value;
      if ($('#mb-pr-tr').value === 'tcp') { $('#mb-add-host').value = $('#mb-pr-host').value; $('#mb-add-port').value = $('#mb-pr-port').value; }
      if ($('#mb-pr-tpl').value) $('#mb-add-tpl').value = $('#mb-pr-tpl').value;
      $('#mb-add-tcp').classList.toggle('hidden', $('#mb-add-tr').value !== 'tcp');
      mbAddNote();
      if (baud && +baud !== mb.bus.baud) toast(L(`Found at ${baud} Bd: set the bus to it`, `Nalezeno při ${baud} Bd: nastavte na ni sběrnici`));
      $('#mb-add-tpl').scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else if (t.id === 'mb-raw-send') {
      const fc = +$('#mb-raw-fc').value, tcp = $('#mb-raw-tr').value === 'tcp';
      const addr = parseInt($('#mb-raw-addr').value), n = $('#mb-raw-n').value.trim();
      const body = { transport: tcp ? 'tcp' : 'rtu', slave: +$('#mb-raw-slave').value, fc, addr };
      if (tcp) body.host = $('#mb-raw-host').value.trim();
      if (fc <= 4) body.count = +n; else body.values = n.split(',').map(x => parseInt(x.trim()));
      $('#mb-raw-out').innerHTML = mbRawOut(await api('/api/modbus/raw', { json: body }), fc);
    } else if (t.id === 'mb-tpl-new') {
      mbEditor(L('New template', 'Nová šablona'), { schema: 1, id: 'my_device', manufacturer: 'Manufacturer', model: 'Model', category: 'energy_meter',
        serial: { baud: 9600, parity: 'N', stop: 1 }, slave: 1, poll_s: 10, max_regs: 40,
        entities: [{ key: 'voltage', name: 'Voltage', name_cs: 'Napětí', reg: 'input', addr: '0x0000', type: 'f32', unit: 'V', class: 'voltage', state: 'measurement', precision: 1 }] });
    } else if (t.dataset.mbTplExport || t.dataset.mbTplCopy || t.dataset.mbTplEdit) {
      const id = t.dataset.mbTplExport || t.dataset.mbTplCopy || t.dataset.mbTplEdit;
      const j = await api(`/api/modbus/template?id=${encodeURIComponent(id)}`);
      delete j.builtin; delete j.rev;
      if (t.dataset.mbTplExport) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(j, null, 1)], { type: 'application/json' }));
        a.download = `${id}.json`;
        a.click();
      } else if (t.dataset.mbTplCopy) mbEditor(L('Copy of ', 'Kopie ') + j.model, { ...j, id: `${id}_copy`.slice(0, 31), model: `${j.model} (copy)`.slice(0, 47) });
      else mbEditor(L('Edit ', 'Upravit ') + j.model, j);
    } else if (t.id === 'mb-editor-save') {
      let j;
      try { j = JSON.parse($('#mb-editor-text').value); } catch (err) { $('#mb-editor-err').textContent = 'JSON: ' + err.message; return; }
      try { await api('/api/modbus/template', { method: 'PUT', json: j }); } catch (err) { $('#mb-editor-err').textContent = err.message; return; }
      $('#mb-editor').classList.add('hidden');
      await loadModbus(true);
      toast(L(`Template ${j.id} saved`, `Šablona ${j.id} uložena`));
    } else if (t.id === 'mb-editor-close') {
      $('#mb-editor').classList.add('hidden');
    } else if (t.dataset.mbTplDel) {
      if (!await confirmDialog(L(`Delete template ${t.dataset.mbTplDel}?`, `Smazat šablonu ${t.dataset.mbTplDel}?`), L('Export it first to keep a copy.', 'Pro zachování kopie ji nejdřív exportujte.'))) return;
      await api(`/api/modbus/template?id=${encodeURIComponent(t.dataset.mbTplDel)}`, { method: 'DELETE' });
      await loadModbus(true);
      toast(L('Deleted', 'Smazáno'));
    }
  } catch (err) {
    toast(L('Error: ', 'Chyba: ') + err.message);
  }
});

    <p class="muted">${L('Connects to the port of every address of the range and asks each open one a few unit ids; an exception counts as an answer too. Victron GX and GoodWe are recognised by their serial numbers. Only reads; the Modbus devices keep being read. A /24 takes about 20-60 s.',
      'Připojí se na port každé adresy rozsahu a otevřeného se zeptá na několik jednotek; i výjimka je odpověď. Victron GX a GoodWe pozná podle sériového čísla. Jen čte; zařízení Modbus se dál čtou. Rozsah /24 trvá asi 20-60 s.')}</p>

      <label class="field" style="margin:0"><span>${L('Units', 'Jednotky')}</span><input type="text" id="ms-units" value="1, 247, 255" style="width:110px" data-notr></label></div>
    <div class="row"><label><input type="checkbox" id="ms-udp" checked> ${L('GoodWe dongles on UDP 8899', 'Moduly GoodWe na UDP 8899')}</label></div>
    <div class="row"><button class="btn primary" id="ms-start">${ic('magnify-scan')}${L('Search', 'Hledat')}</button><button class="btn hidden" id="ms-stop">${L('Stop', 'Zastavit')}</button></div>
    <div id="ms-state" class="muted" style="margin-top:8px"></div></div>
  <div class="card wide">${h3('lan-connect', L('Found', 'Nalezeno'))}<div class="table-wrap" id="ms-found"><p class="muted">${L('No search yet.', 'Zatím bez hledání.')}</p></div></div>
</div>`;

let msTimer = null, msLast = '';
const msAnswer = f => f.answer ? L(`exception ${f.answer}`, `výjimka ${f.answer}`) : L('data', 'data');
async function loadMbScan(first) {
  if (route() !== 'system/mbscan') { clearInterval(msTimer); msTimer = null; return; }
  let d;
  try { d = await api('/api/modbus/scan'); } catch (e) { if ($('#ms-state')) $('#ms-state').textContent = e.message; return; }
  if (!$('#ms-state')) return;
  if (first && !$('#ms-net').value) $('#ms-net').value = d.net || d.default_net || '';
  $('#ms-start').classList.toggle('hidden', d.running);
  $('#ms-stop').classList.toggle('hidden', !d.running);
  $('#ms-state').innerHTML = !d.net ? '' : `${d.running ? `${pill('warn', L('searching', 'hledám'))} ${d.progress} % · ` : d.stopped ? `${L('Stopped', 'Zastaveno')} · ` : `${L('Done', 'Hotovo')} · `}`
    + `${esc(d.net)} · ${L(`${d.addresses} addresses, ${d.open} open`, `${d.addresses} adres, ${d.open} otevřených`)} · ${(d.duration_ms / 1000).toFixed(0)} s`;
  if (d.running && !msTimer) msTimer = setInterval(loadMbScan, 2000);
  if (!d.running && msTimer) { clearInterval(msTimer); msTimer = null; }
  const key = JSON.stringify([d.found, d.udp, d.running]);
  if (key === msLast && !first) return;
  msLast = key;
  if (!d.net) return;
  const ro = perm('system/rs485') < 2 ? 'disabled' : '';
  const rows = d.found.map(f => {
    const dev = f.manufacturer ? `<b>${esc(f.manufacturer)}</b> ${esc(f.model)}${f.serial ? ` <span class="muted">${esc(f.serial)}</span>` : ''}` : `<span class="muted">${L('unknown device', 'neznámé zařízení')}</span>`;
    const units = [f.device_unit !== undefined ? f.device_unit : f.unit, f.vebus_unit].filter(u => u !== undefined);
    const acts = (f.template ? `<button class="btn" data-ms-add="${f.host}|${f.port}|${f.device_unit}|${f.template}" ${ro}>${ic('plus')}${L('Add', 'Přidat')}</button>` : '')
      + (f.vebus_unit ? `<button class="btn" data-ms-add="${f.host}|${f.port}|${f.vebus_unit}|victron_vebus" ${ro}>${ic('plus')}VE.Bus</button>` : '')
      + `<button class="btn" data-ms-use="${f.host}|${f.port}|${f.device_unit !== undefined ? f.device_unit : f.unit}" title="${L('Open in RS485 › Add a device and Manual request', 'Otevřít v RS485 › Přidat zařízení a Ruční dotaz')}">${ic('chevron-right')}RS485</button>`;
    return `<tr><td data-notr>${esc(f.host)}:${f.port}</td><td class="hw-wrap">${dev}</td><td data-notr>${units.join(', ')}</td><td>${L('unit', 'jednotka')} ${f.unit}: ${msAnswer(f)}</td><td>${acts}</td></tr>`;
  }).join('');
  const udp = d.udp.map(u => `<tr><td data-notr>${esc(u.host)}</td><td class="hw-wrap"><b>GoodWe</b> <span class="muted" data-notr>${esc(u.info)}</span></td><td>UDP</td>
    <td colspan="2" class="hw-wrap">${L('Modbus only on UDP: the gateway reads Modbus TCP. A WiFi/LAN Kit-20 or the LAN+WiFi kit 2.0 offers TCP port 502.', 'Modbus jen přes UDP: brána čte Modbus TCP. WiFi/LAN Kit-20 nebo LAN+WiFi kit 2.0 nabízí TCP port 502.')}</td></tr>`).join('');
  $('#ms-found').innerHTML = rows || udp ? `<table class="hw-stack"><tr>${[L('Address', 'Adresa'), L('Device', 'Zařízení'), L('Units', 'Jednotky'), L('Answer', 'Odpověď'), ''].map(x => `<th>${x}</th>`).join('')}</tr>${rows}${udp}</table>`
    : `<p class="muted">${d.running ? L('Nothing yet.', 'Zatím nic.') : L('No Modbus TCP device answered. A routed network needs a route from the gateway; an inverter\'s dongle may be off at night.', 'Žádné zařízení Modbus TCP neodpovědělo. Do jiné sítě musí z brány vést trasa; modul střídače může být v noci vypnutý.')}</p>`;
}
const msList = t => t.split(/[\s,;]+/).filter(Boolean).map(Number);
document.addEventListener('click', async e => {
  const t = e.target.closest('#ms-start, #ms-stop, [data-ms-add], [data-ms-use]');
  if (!t) return;
  try {
    if (t.id === 'ms-start') {
      await api('/api/modbus/scan', { json: { net: $('#ms-net').value.trim(), ports: msList($('#ms-ports').value), units: msList($('#ms-units').value), udp: $('#ms-udp').checked } });
      loadMbScan();
    } else if (t.id === 'ms-stop') {
      await api('/api/modbus/scan', { json: { stop: true } });
    } else if (t.dataset.msAdd) {
      const [host, port, unit, template] = t.dataset.msAdd.split('|');
      mb = await api('/api/modbus');
      mbTpls = (await api('/api/modbus/templates')).templates;
      const tp = mbTpl(template);
      if (mb.devices.some(d => d.transport === 'tcp' && d.host === host && d.port === +port && d.slave === +unit)) { toast(L('Already added', 'Už je přidané')); return; }
      const name = `${tp ? tp.manufacturer.split(' ')[0] + ' ' + tp.model.split(' (')[0] : template}`.slice(0, 32);
      await api('/api/modbus', { method: 'PUT', json: { devices: [...mbList(), { name, template, transport: 'tcp', host, port: +port, slave: +unit, poll_s: 0, expose: 'integration' }] } });
      toast(L(`Added ${name}: System › RS485`, `Přidáno ${name}: Systém › RS485`));
    } else if (t.dataset.msUse) {
      const [host, port, unit] = t.dataset.msUse.split('|');
      mbPrefill = { host, port: +port, unit: +unit };
      go('system/rs485');
    }
  } catch (err) {
    toast(L('Error: ', 'Chyba: ') + err.message);
  }
});

/* ---------------- users and permissions ---------------- */
const ROLE_NAMES = () => ({ admin: L('Admin', 'Správce'), user: L('User', 'Uživatel'), viewer: L('Viewer', 'Divák') });
const LEVELS = () => [L('Hidden', 'Skryto'), L('Read', 'Číst'), L('Edit', 'Upravovat')];
const fmtTime = t => t ? new Date(t * 1000).toLocaleString(lang === 'cs' ? 'cs-CZ' : 'en-GB') : '–';
/* label of a permission page: "Thread › Settings" */
function pageLabel(page) {
  const tr = v => (lang === 'cs' && CS[v]) || v, out = [];
  for (const n of NAV.filter(x => !x.hidden)) {
    for (const x of n.subs || [n]) {
      const r = n.subs ? `${n.id}/${x.id}` : n.id;
      if ((PERM[r] || r) === page) out.push(tr(n.label) + (n.subs ? ' › ' + tr(x.label) : ''));
    }
  }
  const extra = { 'system/settings': L('device name, settings backup', 'název zařízení, záloha nastavení') }[page];
  return [...out, ...(extra ? [extra] : [])].join(', ') || page;
}
function genPassword() {
  const a = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint8Array(14));
  return [...r].map(v => a[v % a.length]).join('');
}

  let sessions = [];
  try { sessions = await api('/api/auth/sessions'); } catch (e) { /* tokens have none */ }
  $('#prof-info').innerHTML = `<div data-notr>${dl([[L('Name', 'Jméno'), `<b>${esc(me.name)}</b>`], [L('Role', 'Role'), ROLE_NAMES()[me.role]],
    [L('Active sessions', 'Aktivní relace'), sessions.length]])}</div>`;
  $('#prof-totp').innerHTML = `<div data-notr>${me.totp
    ? `<p>${pill('ok', L('on', 'zapnuto'))} ${L(`${me.recovery_left} recovery codes left.`, `Zbývá ${me.recovery_left} záložních kódů.`)}</p>
      ${me.totp_required ? `<p class="muted">${L('Required for your role.', 'Pro vaši roli povinné.')}</p>` : `<button class="btn danger" id="totp-off">${L('Turn off', 'Vypnout')}</button>`}`
    : `<p>${pill('', L('off', 'vypnuto'))} ${me.totp_required ? `<b class="warn-text">${L('Required for your role.', 'Pro vaši roli povinné.')}</b>` : ''}</p>
      <p class="muted">${L('Sign-in then also asks for a 6-digit code from Google Authenticator or a similar app.', 'Přihlášení si pak vyžádá i 6místný kód z aplikace Google Authenticator nebo podobné.')}</p>
      <button class="btn primary" id="totp-on">${ic('qrcode')}${L('Set up', 'Nastavit')}</button>`}</div>`;
}

/* QR code, confirmation by a code, then the recovery codes (shown once) */
async function totpSetup(required) {
  const d = await api('/api/auth/totp/setup', { method: 'POST', noLogin: required });
  const v = await formDialog(L('Two-factor sign-in', 'Dvoufázové přihlášení'), `
    ${required ? `<p class="warn-text">${L('Your role requires two-factor sign-in.', 'Vaše role vyžaduje dvoufázové přihlášení.')}</p>` : ''}
    <p>${L('1. Scan the code with Google Authenticator (or Microsoft Authenticator, 1Password, Aegis…).', '1. Naskenujte kód aplikací Google Authenticator (nebo Microsoft Authenticator, 1Password, Aegis…).')}</p>
    <div class="row" style="align-items:flex-start;gap:18px"><div class="qr">${d.qr_svg || ''}</div>
      <div><p class="muted" style="margin-top:0">${L('Or enter the key by hand:', 'Nebo zadejte klíč ručně:')}</p><code style="word-break:break-all">${esc(d.secret.replace(/(.{4})/g, '$1 ').trim())}</code></div></div>
    ${d.clock_set ? '' : `<p class="bad-text">${L('The gateway clock is not set (no internet for SNTP): codes cannot be checked now.', 'Hodiny brány nejsou nastavené (bez internetu pro SNTP): kódy teď nejde ověřit.')}</p>`}
    <label class="field" style="margin-top:12px"><span>${L('2. Enter the 6-digit code from the app', '2. Zadejte 6místný kód z aplikace')}</span>
      <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>`,
    val => api('/api/auth/totp/enable', { json: { code: val.code.trim() }, noLogin: required }), { ok: L('Turn on', 'Zapnout'), required });
  if (!v) return;
  const codes = v.recovery_codes || [];
  await formDialog(L('Recovery codes', 'Záložní kódy'), `<p>${L('Keep these codes safe. Each one signs you in once instead of the app code, for example after losing the phone. They are shown only now.',
    'Uložte si tyto kódy. Každý vás jednou přihlásí místo kódu z aplikace, třeba po ztrátě telefonu. Zobrazují se jen teď.')}</p>
    <div class="codes" data-notr>${codes.map(c => `<span>${c}</span>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn" type="button" id="codes-copy">${ic('content-copy')}${L('Copy', 'Kopírovat')}</button>
      <button class="btn" type="button" id="codes-save">${ic('download')}${L('Download', 'Stáhnout')}</button></div>`, () => true, { ok: L('I have saved them', 'Mám uloženo'), required: true });
}
document.addEventListener('click', e => {
  const codes = [...document.querySelectorAll('#form-dlg .codes span')].map(x => x.textContent).join('\n');
  if (e.target.closest('#codes-copy')) copyText(codes).then(() => toast(L('Copied', 'Zkopírováno')));
  if (e.target.closest('#codes-save')) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([`P4 Gateway ${status?.hostname || ''} – ${me?.name || ''}\n${codes}\n`], { type: 'text/plain' }));
    a.download = `p4gw-recovery-codes-${me?.name || ''}.txt`;
    a.click();
  }
});

        <p class="muted">${L('Or send the bot this message:', 'Nebo botovi pošlete zprávu:')} <code>/start ${p.code}</code> ${L('(valid 10 minutes)', '(platí 10 minut)')}</p>`,
        () => true, { ok: L('Done', 'Hotovo') }).then(loadProfileTelegram);
    } else if (b.id === 'tg-unpair') {
      if (!await confirmDialog(L('Unpair Telegram?', 'Zrušit spárování Telegramu?'), L('Notifications and commands stop for this chat.', 'Notifikace a příkazy pro tento chat skončí.'))) return;
      await api('/api/auth/telegram/unpair', { method: 'POST' });
      loadProfileTelegram();

      await api('/api/auth/telegram/test', { method: 'POST' });

        val => api('/api/auth/totp/disable', { json: { password: val.password } }), { ok: L('Turn off', 'Vypnout') });

/* ---------------- actions ---------------- */

document.addEventListener('click', async e => {
  const t = e.target.closest('button');
  if (!t) return;
  try {
    if (t.dataset.rolesView) {
      rolesView = t.dataset.rolesView;
      try { localStorage.setItem('rolesView', rolesView); } catch (e) { /* storage blocked */ }
      render(true);
    } else if (t.dataset.role) {
      const radio = t.dataset.radio || 'a', name = ROLES[t.dataset.role]?.name || L('off', 'vypnuto');
      if (!await confirmDialog(L(`Radio ${radio.toUpperCase()}: ${name}?`, `Rádio ${radio.toUpperCase()}: ${name}?`),
        L('The gateway restarts and may reflash the radio. Devices on its current network go offline until you switch back.',
          'Brána se restartuje a může přeflashovat rádio. Zařízení v jeho současné síti budou do přepnutí zpět offline.'))) return;
      try {
        await api('/api/role', { json: { role: t.dataset.role, radio } });
      } catch (err) {
        if (err.message !== 'c6_backup_required' && err.message !== 'radio_b_backup_required') throw err;
        if (!await confirmDialog(L('No backup of the factory firmware yet', 'Zatím bez zálohy továrního firmwaru'),
          L('This role overwrites the factory firmware of the radio, which cannot be downloaded again. Cancel and back it up first (Radios › Status and maintenance), or continue without a backup.',
            'Role přepíše tovární firmware rádia, který už nejde znovu stáhnout. Zrušte a nejdřív ho zazálohujte (Rádia › Stav a údržba), nebo pokračujte bez zálohy.'))) {
          go('radios/status');
          return;
        }
        await api('/api/role', { json: { role: t.dataset.role, radio, skip_backup: true } });
      }
      toast(L('Switching, the page reconnects automatically', 'Přepínám, stránka se sama znovu připojí'));
      waitForRestart(true);
    } else if (t.dataset.radioProbe !== undefined) {
      t.disabled = true;
      const r = await api('/api/radios/b/probe', { method: 'POST' });
      toast(r.wired ? L(`${r.chip} found, all lines work`, `${r.chip} nalezeno, všechny linky fungují`) : r.verdict);
      loadRadios();
    } else if (t.dataset.threadForget) {
      const radio = t.dataset.threadForget;
      if (!await confirmDialog(L(`Forget the Thread network of radio ${radio.toUpperCase()}?`, `Zapomenout síť Thread rádia ${radio.toUpperCase()}?`),
        L('Its next Thread role starts a new network; devices of the old one have to join again.', 'Jeho příští role Thread založí novou síť; zařízení ze staré se musí připojit znovu.'))) return;
      await api('/api/radios/thread/forget', { json: { radio } });
      toast(L('Forgotten', 'Zapomenuto'));
    } else if (t.id === 'esw-save') {
      const body = { ssid: $('#esw-ssid').value.trim() };
      if ($('#esw-pass').value) body.password = $('#esw-pass').value;
      await api('/api/esphome/wifi', { json: body });
      $('#esw-pass').value = '';
      toast(L('Saved: used when the ESPHome role starts', 'Uloženo: použije se při startu role ESPHome'));
      loadEsphomeWifi();
    } else if (t.dataset.cli) {
      runCli(t.dataset.cli);
    } else if (t.id === 'cli-run') {
      const cmd = $('#cli-cmd').value.trim();
      if (cmd) runCli(cmd);
    } else if (t.id === 'ds-reveal') {
      loadDataset(true);
    } else if (t.id === 'ds-copy') {
      if (!datasetTlvs) await loadDataset(true);
      await showCopy('Thread dataset TLVs', datasetTlvs, 'Contains the network key, keep it private.');
    } else if (t.id === 'ds-apply') {
      const tlvs = $('#ds-tlvs').value.replace(/\s+/g, '');
      if (!tlvs || !await confirmDialog('Apply dataset?', 'The gateway leaves its current Thread network and joins the one in the dataset.')) return;
      const r = await api('/api/thread/dataset', { json: { tlvs } });
      toast('Joining ' + r.network_name);
      loadDataset(false);
    } else if (t.id === 'zb-reset') {
      if (!await confirmDialog('Reset the C6?', 'The Zigbee host loses its connection and has to reinitialise the coordinator.')) return;
      await api('/api/zigbee/reset', { method: 'POST' });
      toast('C6 reset');
    } else if (t.id === 'identify-btn') {
      await api('/api/identify', { json: { seconds: 10 } });
      status = await api('/api/status');
      renderHeader();
    } else if (t.id === 'thr-txp-set' || t.id === 'zr-txp-set') {
      const thr = t.id === 'thr-txp-set', v = +$(thr ? '#thr-txp' : '#zr-txp').value;
      if (!Number.isInteger(v) || v < -15 || v > 20) return toast(L('Transmit power: -15 to 20 dBm', 'Vysílací výkon: -15 až 20 dBm'));
      if (thr) { await api('/api/thread/txpower', { json: { dbm: v } }); loadThreadTxPower(); }
      else await api('/api/zigbee/command', { json: { cmd: 'txpower', value: v } });
      t.blur();
      toast(L(`Transmit power ${v} dBm`, `Vysílací výkon ${v} dBm`));
    } else if (t.dataset.mqp) {
      document.querySelectorAll('[data-mqg]').forEach(c => { c.checked = t.dataset.mqp === 'all' || c.dataset.mqg === 'sound_triggers'; });
    } else if (t.dataset.zr) {
      const cmd = t.dataset.zr;
      if (['leave', 'factory_reset'].includes(cmd) && !await confirmDialog('Run ' + cmd + '?', 'The router leaves its Zigbee network.')) return;
      await api('/api/zigbee/command', { json: { cmd } });
      toast('Sent ' + cmd);
    } else if (t.dataset.snap) {
      download(`/api/c6/zigbee-snapshot?bundle=${encodeURIComponent(t.dataset.snap)}&radio=${t.dataset.snapRadio}`, `${t.dataset.snap}_${t.dataset.snapRadio}_nvram.bin`);
    } else if (t.id === 'mq-save') {
      const body = { uri: $('#mq-uri').value.trim(), user: $('#mq-user').value, prefix: $('#mq-prefix').value.trim(), enabled: $('#mq-en').checked,
        tls: $('#mq-tls').value, ca: $('#mq-ca').value.trim(), skip_cn_check: $('#mq-nocn').checked, client_id: $('#mq-cid').value.trim(),
        keepalive: +$('#mq-ka').value, base: $('#mq-base').value.trim(), interval: +$('#mq-int').value, discovery: $('#mq-disc').checked,
        discovery_groups: [...document.querySelectorAll('[data-mqg]')].filter(c => c.checked).map(c => c.dataset.mqg) };
      if ($('#mq-pass').value) body.password = $('#mq-pass').value;
      await api('/api/mqtt', { json: body });
      toast('MQTT saved');
      setTimeout(loadMqtt, 1500);
    } else if (t.id === 'ping-run') {
      $('#ping-out').textContent = '…';
      const r = await api('/api/tools/ping', { json: { host: $('#ping-host').value.trim(), count: +$('#ping-count').value } });
      $('#ping-out').textContent = `PING ${r.target}\n` + r.replies.map(x => x.timeout ? `seq ${x.seq}: timeout` : `seq ${x.seq}: ${x.ms} ms`).join('\n') + `\n${r.received}/${r.sent} received`;
    } else if (t.id === 'c6-backup') {
      toast('Reading the C6 flash, about 2 minutes…');
      t.disabled = true;
      try { await download('/api/c6/backup', status.hostname + '_c6_flash.bin'); toast('C6 backup saved'); } finally { t.disabled = false; }
    } else if (t.id === 'b-backup') {
      toast(L('Reading the flash of radio B, about 4 minutes…', 'Čtu flash rádia B, asi 4 minuty…'));
      t.disabled = true;
      try { await download('/api/c6/backup?radio=b', status.hostname + '_radio_b_flash.bin'); toast(L('Radio B backup saved', 'Záloha rádia B uložena')); } finally { t.disabled = false; }
    } else if (t.id === 'b-reflash') {
      if (!await confirmDialog(L('Reflash radio B?', 'Přeflashovat rádio B?'), L('The gateway restarts and rewrites radio B with the firmware of its role.', 'Brána se restartuje a přepíše rádio B firmwarem jeho role.'))) return;
      await api('/api/c6/reflash?radio=b', { method: 'POST' });
      waitForRestart();
    } else if (t.id === 'copy-btn') {
      toast(await copyText($('#copy-text').value) ? 'Copied to the clipboard' : 'Select the text and copy it (Ctrl/Cmd+C)');
    } else if (t.id === 'ev-preset-apply') {
      if (!await confirmDialog('Apply preset?', 'Replaces all events and the sound selection. Removed events disappear from Home Assistant.')) return;
      sndCfg = await api('/api/sound/events/preset', { json: { preset: $('#ev-preset').value } });
      sndExclude = new Set(sndCfg.exclude); sndDirty = false; renderEvents(); renderTree(); toast('Preset applied');
    } else if (t.id === 'ev-new') {
      openEditor(-1, { id: '', name: '', kind: 'impulse', threshold: 0.5, windows: 1, hold_s: 3, cooldown_s: 30, classes: [], suppress: [], enabled: true });
    } else if (t.dataset.evEdit !== undefined) {
      openEditor(+t.dataset.evEdit);
    } else if (t.dataset.evDel !== undefined) {
      const ev = sndCfg.events[+t.dataset.evDel];
      if (!await confirmDialog('Delete ' + ev.name + '?', 'Its entities disappear from Home Assistant; automations using them stop working.')) return;
      await putEvents({ events: sndCfg.events.filter((_, i) => i !== +t.dataset.evDel) });
    } else if (t.dataset.evYaml !== undefined) {
      const ev = sndCfg.events[+t.dataset.evYaml];
      await showCopy('Automation: ' + ev.name, automationYaml(ev),
        'Home Assistant: Settings → Automations & scenes → Create automation → ⋮ → Edit in YAML, paste, save.');
    } else if (t.id === 'ev-export') {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify({ exclude: [...sndExclude], events: sndCfg.events.map(({ active, count, last_ago_s, ...e }) => e) }, null, 2)], { type: 'application/json' }));
      a.download = status.hostname + '_sound_events.json';
      a.click();
    } else if (t.id === 'cls-save') {
      await putEvents(sndCfg);
    } else if (t.dataset.clsAll || t.dataset.clsNone) {

async function download(path, name) {
  const res = await fetch(path);
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).error || msg; } catch (e) { /* not JSON */ }
    throw new Error(msg);
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await res.blob());
  a.download = name;
  a.click();
}

function upload(kind) {
  const file = $(`#${kind}-file`).files[0];
  if (!file) { toast('Choose a file'); return; }
  const prog = $(`#${kind}-prog`);
  prog.classList.remove('hidden');
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/ota/' + kind);
    xhr.upload.onprogress = e => { prog.firstElementChild.style.width = (e.loaded / e.total * 100) + '%'; };
    xhr.onload = () => {
      let r = {};
      try { r = JSON.parse(xhr.responseText); } catch (e) { /* not JSON */ }
      if (xhr.status !== 200) { reject(new Error(r.error || xhr.statusText)); return; }
      toast(r.restarting ? 'Uploaded, restarting into the new firmware' : 'Uploaded ' + (r.version || ''));
      if (r.restarting) waitForRestart();
      resolve();
    };
    xhr.onerror = () => reject(new Error('upload failed'));
    xhr.send(file);
  });
}

let restarting = false;
/* modal: the restart and what follows it (C6 flashing, role start) blocks the UI until done */
async function importSettings(file) {
  const c = JSON.parse(await file.text());
  if (c.format !== 'p4gw-settings') throw new Error(L('not a settings file of this gateway', 'není to soubor nastavení této brány'));
  const when = c.exported ? new Date(c.exported * 1000).toLocaleString() : '?';
  if (!await confirmDialog('Import settings?', L(`Settings of ${c.hostname} from ${when} (${Object.keys(c.keys || {}).length} items${c.secrets ? ', with passwords' : ''}) overwrite the current ones and the gateway restarts.`,
    `Nastavení ${c.hostname} z ${when} (${Object.keys(c.keys || {}).length} položek${c.secrets ? ', s hesly' : ''}) přepíše současné a brána se restartuje.`))) return;
  await api('/api/settings/import', { json: c });
  toast('Settings imported: the gateway restarts');
  waitForRestart();
}
async function waitForRestart(modal = true) {
  restarting = true;
  Object.assign(busy, { expect: modal, since: Date.now(), eta: null });
  renderBusy();
  await new Promise(r => setTimeout(r, 3000));
  for (let i = 0; i < 240; i++) {
    /* short timeout: a request sent while the board is down hangs in TCP retries and would see it back late */
    try { status = await api('/api/status', { timeout: 1500 }); restarting = false; render(true); toast('Gateway is back'); return; } catch (e) { /* still down */ }
    renderBusy();
    await new Promise(r => setTimeout(r, 1000));
  }
  restarting = false;
  busy.expect = false;
  renderBusy();
}

/* Blocking progress dialog while the gateway restarts, the C6 is flashed (also a C6 backup) or the
 * new role starts. The bar moves in 0.5 s steps; the estimate comes from the elapsed time. */
const busy = { expect: false, since: 0, eta: null, at: 0 };
function flashStage(st) {
  const m = /^writing 0x([0-9a-f]+) \((\d+) kB\)$/.exec(st);
  if (m) return L(`writing ${m[2]} kB at 0x${m[1]}`, `zápis ${m[2]} kB na 0x${m[1]}`);
  return L(st, { 'verifying image': 'kontrola image', 'connecting to C6 bootloader': 'připojení k zavaděči C6',
    'saving Zigbee network data': 'záloha dat Zigbee sítě', 'erasing settings area': 'mazání oblasti nastavení',
    'restoring Zigbee network data': 'obnova dat Zigbee sítě', 'reading C6 flash': 'čtení flash C6', done: 'hotovo', failed: 'selhalo' }[st] || st);
}
function renderBusy() {
  const dlg = $('#busy-dlg'), fl = status?.c6?.flash, r = status?.role;
  const phase = restarting ? (busy.expect ? 'restart' : '') : fl?.busy ? 'flash'
    : busy.expect && r && !r.maintenance && r.active !== r.desired ? 'start' : '';
  if (!phase) {
    busy.expect = false;
    busy.eta = null;
    if (dlg.open) dlg.close();
    return;
  }
  const bar = $('#busy-bar'), secs = Math.round((Date.now() - busy.since) / 1000);
  bar.classList.toggle('ind', phase !== 'flash');
  if (phase === 'flash') {
    $('#busy-title').textContent = fl.stage === 'reading C6 flash' ? L('Backing up the C6 flash', 'Záloha flash C6') : L('Flashing the C6', 'Flashování C6');
    $('#busy-stage').textContent = flashStage(fl.stage);
    bar.firstElementChild.style.width = fl.percent + '%';
    $('#busy-pct').textContent = fl.percent + ' %';
    /* remaining time at the average pace so far, smoothed and counted down between samples */
    if (fl.elapsed_s && fl.percent >= 12 && fl.percent < 100) {
      const e = fl.elapsed_s * (100 - fl.percent) / fl.percent, now = Date.now();
      busy.eta = busy.eta === null ? e : Math.max(0, busy.eta - (now - busy.at) / 1000) * 0.6 + e * 0.4;
      busy.at = now;
    }
    $('#busy-eta').textContent = busy.eta === null ? L('estimating…', 'odhaduji…') : L(`about ${Math.ceil(busy.eta)} s left`, `zbývá asi ${Math.ceil(busy.eta)} s`);
  } else {
    $('#busy-title').textContent = phase === 'restart' ? L('The gateway is restarting', 'Brána se restartuje') : L('Starting the role', 'Spouštím roli');
    $('#busy-stage').textContent = phase === 'start' ? (ROLES[r.desired]?.name || r.desired) : '';
    bar.firstElementChild.style.width = '';
    $('#busy-pct').textContent = '';
    $('#busy-eta').textContent = phase === 'restart' ? L(`${secs} s`, `${secs} s`) : '';
  }
  $('#busy-note').textContent = L('The page is locked until the gateway is done. Do not unplug the board.',
    'Stránka je zamčená, dokud brána neskončí. Desku neodpojujte od napájení.');
  if (!dlg.open) dlg.showModal();
}
$('#busy-dlg').addEventListener('cancel', e => e.preventDefault());

/* ---------------- log ---------------- */

/* Lines from the gateway start with the time they were logged ("<unix ms> " or "+<ms since boot> ");
 * ESP-IDF's own time in the line is dropped, the local time of the browser is shown instead. */
const LOG_SOURCES = {
  all: { label: 'all sources' },
  system: { label: 'system', tags: /^(main|gw_boot|gw_config|gw_api|gw_update|gw_log|cpu_start|heap_init|spi_flash|esp_image|boot|app_init|efuse|esp_psram|esp_core_dump.*|ota|esp_ota_ops|esp_https_ota|pp|phy|temperature_sensor)$/i },
  network: { label: 'network, MQTT, web', tags: /^(gw_eth|gw_http|gw_mqtt|esp_eth.*|eth_.*|mdns.*|esp-tls.*|transport.*|mqtt_client|httpd.*|netscan|esp_netif.*|sntp|ping_sock|lwip)$/i },
  thread: { label: 'Thread', tags: /^(OPENTHREAD|OT_.*|obtr_web|esp_ot.*|role_thread|ot_.*|esp_br.*|thread_.*)$/i },
  zigbee: { label: 'Zigbee', tags: /^(role_zigbee|zigbee_net|zb_.*)$/i },
  sound: { label: 'sound', tags: /^(sound.*|I2S_IF|ES8311|Adev_Codec|FbsLoader|i2s_.*|dl_.*|esp-dl)$/i },
  sensors: { label: 'I2C sensors', tags: /^(sensors|gw_i2c|i2c\..*)$/i },
  modbus: { label: 'Modbus', tags: /^(modbus|mb_bus|uart)$/i },
  c6: { label: 'C6 flashing', tags: /^(c6_flasher|esp_loader.*|serial_flasher.*)$/i },
};
let logSeq = 0, logPaused = false, logRest = '', logLines = [], logTags = new Map();
const logView = { src: 'all', lvl: 'IWED', tag: '', q: '' };
const LOG_MAX = 6000;

/* Parses complete lines; a partial last line waits for its end. */
function logParse(text) {
  const lines = (logRest + text).split('\n');
  logRest = lines.pop();
  for (const raw of lines) {
    const m = raw.match(/^(\d{13}|\+\d+) (.*)$/);
    const at = m ? (m[1][0] === '+' ? null : +m[1]) : null, body = (m ? m[2] : raw).replace(/\r$/, '');
    if (!body.trim()) continue;
    /* "I (11:18:23.116) tag: msg", OpenThread "W(12831) OPENTHREAD:[W] ..." */
    const p = body.match(/^([IWEDV]) ?\(([\d:.]+)\) ([^:\s]+): ?(.*)$/);
    const prev = logLines[logLines.length - 1];
    const line = p ? { at, lvl: p[1], tag: p[3], msg: p[4] } : { at, lvl: prev?.lvl || 'I', tag: prev?.tag || '', msg: body };
    if (!p && !m) line.at = prev?.at ?? null;
    logLines.push(line);
    if (line.tag) logTags.set(line.tag, (logTags.get(line.tag) || 0) + 1);
  }
  if (logLines.length > LOG_MAX) logLines.splice(0, logLines.length - LOG_MAX);
}

const pad = (n, w = 2) => String(n).padStart(w, '0');
function logTime(at, full) {
  if (at == null) return full ? '????-??-?? ??:??:??.???' : '??:??:??.???';
  const d = new Date(at);
  const t = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`;
  return full ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${t}`
    : (new Date().toDateString() === d.toDateString() ? t : `${d.getDate()}.${d.getMonth() + 1}. ${t}`);
}

function logMatcher() {
  const q = logView.q.trim();
  if (!q) return null;
  const re = q.match(/^\/(.+)\/$/);
  try { return new RegExp(re ? re[1] : q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); } catch (e) { return null; }
}

function logFilter() {
  const src = LOG_SOURCES[logView.src], m = logMatcher();
  return logLines.filter(l => logView.lvl.includes(l.lvl) && (!src.tags || src.tags.test(l.tag)) && (!logView.tag || l.tag === logView.tag)
    && (!m || (m.lastIndex = 0, m.test(l.tag + ': ' + l.msg))));
}

function renderLog() {
  const box = $('#log');
  if (!box) return;
  const sel = $('#log-tag');
  const tags = [...logTags.keys()].filter(t => !LOG_SOURCES[logView.src].tags || LOG_SOURCES[logView.src].tags.test(t)).sort((a, b) => a.localeCompare(b));
  const opts = `<option value="">${L('all tags', 'všechny tagy')}</option>` + tags.map(t => `<option value="${esc(t)}" ${t === logView.tag ? 'selected' : ''}>${esc(t)} (${logTags.get(t)})</option>`).join('');
  if (sel.dataset.opts !== opts) { sel.innerHTML = opts; sel.dataset.opts = opts; }
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  const shown = logFilter(), m = logMatcher(), last = shown.slice(-2000);
  const hl = t => {
    if (!m) return esc(t);
    let out = '', i = 0;
    for (const x of t.matchAll(m)) {
      if (!x[0]) break;
      out += esc(t.slice(i, x.index)) + `<mark>${esc(x[0])}</mark>`;
      i = x.index + x[0].length;
    }
    return out + esc(t.slice(i));
  };
  box.innerHTML = last.map(l => `<span class="muted">${logTime(l.at)}</span> <span class="lv-${l.lvl}">${l.lvl}</span> ${l.tag ? `<a href="#" class="log-tag" data-log-tag="${esc(l.tag)}">${hl(l.tag)}</a>: ` : ''}<span class="lv-${l.lvl}m">${hl(l.msg)}</span>`).join('\n');
  $('#log-count').textContent = `${shown.length} / ${logLines.length} ${L('lines', 'řádků')}` + (shown.length > last.length ? ` (${L('showing the last 2000', 'zobrazeno posledních 2000')})` : '');
  if (stick) box.scrollTop = box.scrollHeight;
}

/* Text for a file: full local date and time, level, tag. */
const logFileText = lines => lines.map(l => `${logTime(l.at, true)} ${l.lvl} ${l.tag ? l.tag + ': ' : ''}${l.msg}`).join('\n') + '\n';

async function pollLog() {
  if (route() !== 'system/diag' || logPaused || restarting) return;
  try {
    const { data, res } = await api('/api/logs?since=' + logSeq, { raw: true });
    logSeq = +res.headers.get('X-Log-Seq') || logSeq;
    if (data) {
      logParse(data.replace(/\x1b\[[0-9;]*m/g, ''));
      renderLog();
    }
  } catch (e) { /* retry next tick */ }
}
document.addEventListener('input', e => {
  if (e.target.id === 'log-filter') { logView.q = e.target.value; renderLog(); }
  if (e.target.id === 'zdev-filter' && z2m) renderZDevices([...zInfo.values()], z2m.now);
  if (e.target.id === 'cls-search') {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.cls-row').forEach(r => { r.style.display = !q || r.dataset.name.includes(q) ? 'flex' : 'none'; });
    document.querySelectorAll('#cls-tree details').forEach(d => { d.open = !!q && [...d.querySelectorAll('.cls-row')].some(r => r.style.display !== 'none'); });
  }
});

/* ---------------- loop ---------------- */

/* pages without form input, redrawn on every status poll */
const PASSIVE = ['overview', 'flows', 'radios/roles', 'zigbee/info', 'zigbee/diag', 'zigbee/backups', 'system/info'];

function pageTitle() {
  const [s1, s2] = (sub || '').split('/');
  const sec = NAV.find(n => n.id === tab), s = sec.subs?.find(x => x.id === s1), t = s?.subs?.find(x => x.id === s2);
  const ro = perm(route()) === 1 ? `<div class="alert readonly-note" data-notr>${ic('eye-outline')}${L('Read only: your account cannot change this page.', 'Jen ke čtení: váš účet tuto stránku nemůže měnit.')}</div>` : '';
  return `<h2 class="page-title">${ic(t?.icon || s?.icon || sec.icon)}<span>${sec.label}</span>${s ? `<small>›</small><small>${s.label}</small>` : ''}${t ? `<small>›</small><small>${t.label}</small>` : ''}</h2>${ro}`;
}

function render(full) {
  if (!status) return;
  /* a page of a role that is not active (bookmark, role switched meanwhile): the first page that works */
  if (!pageEnabled(tab, sub)) {
    const fp = firstPage(NAV.find(n => n.id === tab));
    const any = NAV.find(n => !n.hidden && (n.subs ? firstPage(n) : perm(n.id) > 0));
    return go(fp ? `${tab}/${fp.id}` : any ? (any.subs ? `${any.id}/${firstPage(any).id}` : any.id) : 'profile', true);
  }
  if (navRole !== radioRoles().join()) renderNav();
  renderHeader();
  if (wiz && $('#wiz').open && !$('#wiz').contains(document.activeElement)) wizShow(false);
  const main = $('#main');
  /* Forms keep their input: only redraw passive pages on every poll. */
  const editing = document.activeElement?.matches?.('#main input, #main select');
  if (full || (PASSIVE.includes(route()) && !editing)) {
    if (full) renderNav();
    main.innerHTML = pageTitle() + views[route()]();
    if (perm(route()) === 1) main.querySelectorAll('button.primary, button.danger').forEach(b => { b.disabled = true; });
    applyCardPerms(main);
    if (tab === 'thread') { loadThread(); if (sub === 'settings') { loadDataset(false); loadThreadTxPower(); } if (sub === 'topology') loadTopology(); }
    if (route() === 'ha/mqtt') loadMqtt();
    if (route() === 'flows') requestAnimationFrame(drawFlows);
    if (route() === 'system/diag') renderLog();
    if (route() === 'radios/scan') loadNetscan();
    if (route() === 'system/lan' || route() === 'system/wifi') {
      if (route() === 'system/lan') { loadLan(); renderLanState(); } else { loadWifi(); renderWifiState(); }
      loadTraffic();
      if (!trafficTimer) trafficTimer = setInterval(loadTraffic, 2000);
    }
    if (route() === 'ha/matter') loadHaFound();
    if (route() === 'radios/status') loadRadios();
    if (route() === 'system/hw') loadHw();
    if (route() === 'system/rs485') loadModbus();
    if (route() === 'system/mbscan') loadMbScan(true);
    if (route() === 'esphome') loadEsphomeWifi();
    if (route().startsWith('system/users/')) loadUsersPage();
    if (route() === 'profile') loadProfile();
    if (route() === 'system/notify') loadNotifyAdmin();
    if (route() === 'zigbee/network') loadZigbeeNet(true);
    if (tab === 'sound') {
      loadSound(); loadSoundConfig().catch(err => toast('Error: ' + err.message));
      if (route() === 'sound/learn') loadLearn();
      if (!soundTimer) soundTimer = setInterval(() => { loadSound(); loadScoresAndLog(); loadLearn(); if (sndTick % 10 === 0 && sndCfg && !$('#ev-dlg').open) api('/api/sound/events').then(c => { sndCfg = c; renderEvents(); }).catch(() => {}); }, 1000);
    }
  } else if (tab === 'thread') {
    loadThread();
  }
}

let meTick = 0;
async function poll() {
  /* admins see new reset requests within half a minute */
  if (me && !me.open && me.role === 'admin' && ++meTick % 6 === 0) {
    api('/api/auth/me').then(m => { if (m.requests !== me.requests) { me = m; renderUser(); renderNav(); } else me = m; }).catch(() => {});
  }
  if (!restarting) {
    try { status = await api('/api/status'); await sampleNet(); render(false); } catch (e) { setTag('#hdr-role', 'bad', ic('close'), 'offline', L('Gateway', 'Brána'), [[L('State', 'Stav'), L('does not answer', 'neodpovídá')]]); }
  }
  setTimeout(poll, $('#busy-dlg').open ? 500 : status?.c6?.flash?.busy || status?.identify_s || status?.eth?.confirm_s ? 1000 : 5000);
}

uiReady = true;
renderPrefs();
async function loadMe() {
  try { me = await api('/api/auth/me'); } catch (e) { me = null; }
  renderPrefs();
  renderNav();
}
history.replaceState(null, '', '#' + route());
loadMe().then(poll).then(() => { render(true); wizAuto(); });
setInterval(pollLog, 1500);
</script>
