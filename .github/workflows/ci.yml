name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: ./scripts/ci_checks.sh

  ha-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r tests/ha_integration/requirements.txt
      - run: python -m pytest tests/ha_integration --timeout 60 -q
      - uses: home-assistant/actions/hassfest@master

  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.5
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe gives the firmware version
      - run: ./scripts/ci_build.sh
        shell: bash
      # p4gw.bin, c6fw.bin and c5fw.bin hold no secrets (the ESPHome image with the API key is not built here)
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            dist/p4gw.bin
            dist/c6fw.bin
            dist/c5fw.bin
          retention-days: 14
