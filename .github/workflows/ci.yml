name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: ./scripts/ci_checks.sh

  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.5
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe gives the firmware version
      - run: ./scripts/ci_build.sh
        shell: bash
      # p4gw.bin and c6fw.bin hold no secrets (the ESPHome image with the API key is not built here)
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            dist/p4gw.bin
            dist/c6fw.bin
          retention-days: 14
