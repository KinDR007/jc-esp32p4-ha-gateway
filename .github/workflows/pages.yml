name: Pages

# Publishes documentation/ (the HTML user documentation) as the GitHub Pages site of the repository.
on:
  push:
    branches: [main]
    paths: ["documentation/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: documentation
      - id: deployment
        uses: actions/deploy-pages@v4
