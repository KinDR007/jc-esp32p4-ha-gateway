name: Pages

# Publishes the GitHub Pages site of the repository: the project page (marketing/, built by marketing/build.py)
# at the root, the HTML user documentation (documentation/) under docs/.
on:
  push:
    branches: [main]
    paths: ["documentation/**", "marketing/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: |
          mkdir -p _site/docs
          cp -r marketing/index.html marketing/style.css marketing/app.js marketing/img _site/
          cp -r documentation/. _site/docs/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
